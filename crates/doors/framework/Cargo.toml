[package]
name = "russh-bbs-door"
description = "russh-bbs door framework: the Door trait, saves, clock, RNG, daily tick, sandbox rules"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
russh-bbs-core = { workspace = true }
# Canvas, Rect and Style: the door draws into the board's own ratatui buffer (and nothing else).
ratatui = { workspace = true }
# `Content` tables: typed TOML embedded in a door crate, validated at load.
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Property tests: random buffers through the compositing pass.
proptest = { workspace = true }
tempfile = { workspace = true }
# `#[tokio::test]` for the store-backed tests.
tokio = { workspace = true }

[[bench]]
name = "composite"
# A plain timing loop (no benchmark crate to add): `cargo bench -p russh-bbs-door`.
harness = false
