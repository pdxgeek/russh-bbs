# Story arcs: six chains of scenes (ordinary transit events with family "arc"), each with
# branches that close doors later and several endings. The order of the arcs is the order of their
# ending codes in saves (arc * 8 + ending): gates, league, union, free, guild, church. Scenes are
# appended to the event table after transit.toml; append new ones at the end of this file only.

[[arc]]
id = "gates"
title = "The Gate Song"
hint = "Pilgrims, scholars and old miners all say the song from the dead gates has gone flat. Someone is listening."
blurb = "The gates were never broken, only locked, and every faction wants the key or wants it lost. You have to decide who hears the last note."
branches = ["scored", "vow", "ringore", "ledger", "charts", "warded", "leaguekey", "blood", "truth"]

[[arc.ending]]
id = "open"
title = "The Gates Open"
text = "The note holds. Every dead gate wakes at once and a thousand hulls turn to look at each other. Prices fall, borders blur, and the lanes you knew belong to somebody else's maps."
gates = true

[[arc.ending]]
id = "shut"
title = "The Lock Holds"
text = "The song settles into its low, patient note and the Church takes the vigil for good. The gates stay dark by choice now, not by accident. The frontier goes on being a frontier, and you are the reason."
gates = true

[[arc.ending]]
id = "burn"
title = "The Loom Burns"
text = "The charge goes up, the core sings once, very high, and stops. Nothing will ever jump again. Some cheer. The pilgrims keep a silence the whole frontier can hear."
gates = true

[[arc.ending]]
id = "crown"
title = "One Hand on the Key"
text = "The gates wake on one faction's terms, and the tariff is posted before the song fades. You made it happen, and you will read the toll board for the rest of your life."
gates = true

[[arc.ending]]
id = "walk"
title = "You Walk Away"
text = "You leave the song to the next ship. The gates stay dark, the arguments go on, and sooner or later someone less careful than you comes to Anchorage."

[[arc]]
id = "league"
title = "The Long Patrol"
faction = "league"
hint = "The League is stringing a patrol line across the frontier and needs hulls it can trust, or at least afford."
blurb = "You ride the Long Patrol for the Station League. The line is long, the pay is real and not every order is clean."
branches = ["oath", "strict", "mercy", "evidence", "truce", "warned", "bribed"]

[[arc.ending]]
id = "commission"
title = "The Officer's Pin"
text = "Commodore Varga pins grey cloth to your collar in front of the whole picket yard. You have a rank, a pension and a leash. The lanes are safer and a little smaller."

[[arc.ending]]
id = "charter"
title = "The Warden's Charter"
text = "The League gives you a patch of lane to keep and no one to report to. Haulers wave as they pass. The League gets quiet, the Union gets a fair hearing, and you get a long, uneven peace."

[[arc.ending]]
id = "reckoning"
title = "The Reckoning"
text = "The aide who sold the schedules is stripped of rank in front of the picket yard. The League owes you a debt it will never admit to, and the Free Captains remember the name on the file."

[[arc.ending]]
id = "dark"
title = "Gone Dark"
text = "You leave the League's service with the ship, the pay stub and whatever you learned on the way. Nobody comes after you. That is its own kind of message."

[[arc]]
id = "union"
title = "The Deep Strike"
faction = "miners"
hint = "The Miners' Union is bleeding wages and talking strike. They need ships that can keep a camp fed."
blurb = "The deep strike is on. The camps need food, the stewards need friends, and the Company has a better offer than either."
branches = ["committee", "ran", "sabotage", "hardline", "parley", "informer"]

[[arc.ending]]
id = "charter"
title = "The Miners' Charter"
text = "The Company folds. The Union gets two seats on the board and the fever ward reopens on Deep Nine. For one season, the ore comes up at a fair price and everyone eats."

[[arc.ending]]
id = "settlement"
title = "A Settlement"
text = "Pay rises a little, safety rules a little less. Neither side is happy and both sign. The strike ends, the camps eat, and you are remembered kindly by the half who liked the deal."

[[arc.ending]]
id = "ashes"
title = "Ashes in the Shaft"
text = "The charges go off at Deep Nine. The Company stops mining there. The Union stops being the kind of Union that sits down at tables. The camps eat, for a while, from what is left."

[[arc.ending]]
id = "bought"
title = "The Company's Man"
text = "The Company pays on time and the Union never forgives. You carry a purse and a reputation, and the stewards turn their backs when you come into the hall."

[[arc]]
id = "free"
title = "The Black Ledger"
faction = "free"
hint = "Havens whisper about a book of debts that lost its keeper, and a captain who wants it delivered."
blurb = "Dray Orsk's Black Ledger holds every debt of honour the Free Captains ever swore. You are carrying it, and someone wants it."
branches = ["reader", "blood", "oath", "handed", "turncoat"]

[[arc.ending]]
id = "burned"
title = "Ashes of the Ledger"
text = "The Black Ledger is ash and every debt of honour with it. The Free Captains owe nobody anything, and are finding out what that is worth."

[[arc.ending]]
id = "sold"
title = "The Ledger Sold"
text = "You sold the book. The League arrests the captains it names one at a time, over years, and every haven remembers who held the pen."

[[arc.ending]]
id = "keeper"
title = "The Reckoner"
text = "You sit in the Reckoner's chair. The book is yours to keep square, and the Free Captains pay their debts to a name now, not a flag."

[[arc.ending]]
id = "passed"
title = "The Ledger Moves On"
text = "You left the book to the moot. It finds another keeper, and another ledger of what you did not do."

[[arc]]
id = "guild"
title = "The Blank Charts"
faction = "guild"
hint = "Guild surveyors mutter about a chart that has no business existing, in a hand that should be dead."
blurb = "A dead surveyor's chart shows a system nobody ever sold. The Guild would like it forgotten. You would like to know."
branches = ["copy", "report", "ally", "buried", "silence"]

[[arc.ending]]
id = "published"
title = "The Open Chart"
text = "You pushed the chart to every beacon on the lane. The blank on the map is filled in, the Cartographer-General is looking for work, and the Church is not speaking to you."

[[arc.ending]]
id = "sold"
title = "The Chart Sold"
text = "You sold the coordinates to the havens. The Guild's surveyors never forgave you, and the Free Captains are in places the maps still call empty."

[[arc.ending]]
id = "sealed"
title = "The Chart Sealed"
text = "The Church put the chart in a reliquary under a candle. It is safe, and nobody will ever read it, and you carried it there."

[[arc.ending]]
id = "filed"
title = "The Chart Filed"
text = "The chart sits in a drawer, where the Guild argues about it politely. A blank on a map is a promise nobody has to keep."

[[arc]]
id = "church"
title = "The Quiet Vigil"
faction = "church"
hint = "The Quiet Church wants someone to sit a vigil at a gate that will not wake. Some of its flock want it woken."
blurb = "Mother Quill keeps a vigil at a gate that will not wake. Brother Wren says it is only asleep. You are the one with a ship."
branches = ["vigil", "heresy", "informer", "key", "heard"]

[[arc.ending]]
id = "kept"
title = "The Gate Kept"
text = "The candle burned down in your hands. The Reach stayed dark, the wardens slept, and the Church counted another generation of closed gate."

[[arc.ending]]
id = "opened"
title = "The Gate Woken"
text = "The lamps in the Reach went out for a long second. The Church calls it a catastrophe. The Opened call it a prayer. You carried the key."

[[arc.ending]]
id = "answered"
title = "The Gate Answered"
text = "You sang the phrase back and the gate answered once, then slept. Nobody agrees what it said. Everyone agrees you were there."

[[arc.ending]]
id = "unwatched"
title = "The Unwatched Night"
text = "You walked away from the ring. The candle guttered, or it did not. You never learned which, and the Church never asked you to."

[[season_ending]]
id = "tycoon"
title = "Tycoon"
text = "You ended the season among the richest."
[[season_ending]]
id = "solvent"
title = "Solvent"
text = "You paid what you owed and kept the ship."
[[season_ending]]
id = "pirate_king"
title = "Pirate King"
text = "Your name made haulers change course."
[[season_ending]]
id = "folk_hero"
title = "Folk Hero"
text = "The lanes remember who stood in the way."
[[season_ending]]
id = "cartographer"
title = "Cartographer"
text = "Your charts will outlast the frontier."
[[season_ending]]
id = "bankrupt"
title = "Bankrupt"
text = "The lender took what was left."
[[season_ending]]
id = "drifter"
title = "Drifter"
text = "You got through the season. That was something."

[[event]]
id = "gates_1_flat"
family = "arc"
title = "A Note Out of Tune"
text = "At the research dock a Guild clerk catches your sleeve. Her instruments have logged the gate song for forty years, and for six weeks it has been sliding flat. She wants it recorded properly before it slides off the scale."
weight = 2000
arc = "gates"
step = 1
when = [{ kind = "arc_at", arc = "gates", step = 1 }, { kind = "economy", economy = "research" }]

[[event.options]]
label = "Have the scientist record the full score"
req = [{ kind = "role", role = "scientist", min = 2 }]
needs = "a scientist of skill 2 or better"
[[event.options.outcomes]]
weight = 80
text = "Three nights of headphones and a very good pencil. Your scientist hands you the whole score, every bar, with a Guild stamp on the first page."
effects = [{ kind = "arc_branch", arc = "gates", branch = "scored" }, { kind = "standing", faction = "guild", amount = 3 }, { kind = "xp", skill = "survey", amount = 8 }, { kind = "arc_step", arc = "gates" }]
[[event.options.outcomes]]
weight = 20
text = "The signal slides while you record it. You get half a score and an apology."
effects = [{ kind = "standing", faction = "guild", amount = 1 }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Sweep the band with your scanner"
req = [{ kind = "scanner", min = 1 }]
needs = "a working scanner"
[[event.options.outcomes]]
weight = 60
text = "The scanner holds the carrier long enough to log it end to end. It is not pretty, but it is complete."
effects = [{ kind = "arc_branch", arc = "gates", branch = "scored" }, { kind = "xp", skill = "survey", amount = 4 }, { kind = "arc_step", arc = "gates" }]
[[event.options.outcomes]]
weight = 40
text = "The scan returns static and a headache. The clerk thanks you for trying."
effects = [{ kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Buy her notes for 400 credits"
req = [{ kind = "cash", min = 400 }]
needs = "400 credits"
[[event.options.outcomes]]
weight = 100
text = "Her notes are a thick pile of figures you will never read. She pockets the money and looks at you as though you have been rude to a hymn."
effects = [{ kind = "credits", amount = -400 }, { kind = "standing", faction = "guild", amount = 2 }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Tell her you are not a chorister"
[[event.options.outcomes]]
weight = 100
text = "She lets go of your sleeve. 'Somebody will have to listen,' she says, to nobody in particular."
effects = [{ kind = "arc_step", arc = "gates" }]

# ----

[[event]]
id = "gates_2_vigil"
family = "arc"
title = "The Vigil-Keeper's Request"
text = "A Church vigil-keeper comes aboard at the next dock, lamp in hand, hood back. Keeper Aldous tends a dead gate called Anchorage, and says the song there has changed. He wants fuel, company and, he admits, a witness who is not of the faith."
weight = 2000
arc = "gates"
step = 2
when = [{ kind = "arc_at", arc = "gates", step = 2 }, { kind = "arc_wait", arc = "gates", days = 1 }]

[[event.options]]
label = "Take the vow of the lamp"
req = [{ kind = "standing", faction = "church", min = 10 }]
needs = "Church standing 10 or better"
[[event.options.outcomes]]
weight = 100
text = "You hold the lamp and say the old words. It weighs less than you expected and asks more. Aldous marks your forehead with ash, and the pilgrims at the dock make room for you."
effects = [{ kind = "credits", amount = -250 }, { kind = "standing", faction = "church", amount = 6 }, { kind = "arc_branch", arc = "gates", branch = "vow" }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Sell him the score you recorded"
req = [{ kind = "arc_branch", arc = "gates", branch = "scored" }]
needs = "the gate score you recorded"
[[event.options.outcomes]]
weight = 100
text = "He reads it with his lips moving, then closes his eyes. 'Bar nine is wrong,' he says. 'It was always wrong, and we kept singing it.' He pays what the vigil has."
effects = [{ kind = "credits", amount = 700 }, { kind = "standing", faction = "church", amount = 4 }, { kind = "standing", faction = "guild", amount = -2 }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Give him fuel for the road"
[[event.options.outcomes]]
weight = 70
text = "He thanks you in three sentences and a blessing. The Church remembers fuel."
effects = [{ kind = "fuel", amount = -12 }, { kind = "standing", faction = "church", amount = 3 }, { kind = "arc_step", arc = "gates" }]
[[event.options.outcomes]]
weight = 30
text = "He takes the fuel and says nothing about the song. You are a donor, not a witness."
effects = [{ kind = "fuel", amount = -12 }, { kind = "standing", faction = "church", amount = 1 }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Say you keep a schedule"
[[event.options.outcomes]]
weight = 100
text = "He smiles with great patience and leaves the lamp's smell in your cabin."
effects = [{ kind = "standing", faction = "church", amount = -2 }, { kind = "arc_step", arc = "gates" }]

# ----

[[event]]
id = "gates_3_ore"
family = "arc"
title = "The Steward's Quiet Cargo"
text = "At the mining dock a Union steward, Dunmore, walks you past three guards to a locked shed. Inside are crates of a pale, ringing metal. Ten years of Union wages are built on it, he says, and a certain dead gate is thinner than it was."
weight = 2000
arc = "gates"
step = 3
when = [{ kind = "arc_at", arc = "gates", step = 3 }, { kind = "arc_wait", arc = "gates", days = 1 }, { kind = "economy", economy = "mining" }]

[[event.options]]
label = "Haul a crate to the refinery, no questions"
req = [{ kind = "not", req = { kind = "arc_branch", arc = "gates", branch = "vow" } }]
needs = "you have not taken the vow of the lamp"
[[event.options.outcomes]]
weight = 100
text = "The crate rings against the bulkhead all the way to the refinery, a note you cannot place. Dunmore pays cash and does not meet your eye."
effects = [{ kind = "credits", amount = 900 }, { kind = "standing", faction = "miners", amount = 6 }, { kind = "standing", faction = "church", amount = -3 }, { kind = "arc_branch", arc = "gates", branch = "ringore" }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Have the engineer assay a sample"
req = [{ kind = "role", role = "engineer", min = 2 }]
needs = "an engineer of skill 2 or better"
[[event.options.outcomes]]
weight = 85
text = "Your engineer holds a sliver to the lamp and goes quiet. 'That's coil,' she says. 'Gate coil. Somebody is eating a gate.' Dunmore pays you to keep it between friends."
effects = [{ kind = "credits", amount = 500 }, { kind = "standing", faction = "miners", amount = 3 }, { kind = "arc_branch", arc = "gates", branch = "ringore" }, { kind = "arc_step", arc = "gates" }]
[[event.options.outcomes]]
weight = 15
text = "The sliver bites your engineer's hand and the sample bag screams. Dunmore has to pull you both out of the shed, and then he pays you to forget it."
effects = [{ kind = "hurt", who = "engineer", days = 3 }, { kind = "credits", amount = 500 }, { kind = "arc_branch", arc = "gates", branch = "ringore" }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Tell the vigil-keepers what you saw"
req = [{ kind = "arc_branch", arc = "gates", branch = "vow" }]
needs = "the vow of the lamp"
[[event.options.outcomes]]
weight = 100
text = "Aldous goes white and then very still. He asks only that you show him the shed. By the next shift the Union has a new problem called the Church."
effects = [{ kind = "standing", faction = "church", amount = 6 }, { kind = "standing", faction = "miners", amount = -8 }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Refuse and go back to your ship"
[[event.options.outcomes]]
weight = 100
text = "Dunmore shrugs. The guards walk you to the dock as if it was their idea."
effects = [{ kind = "standing", faction = "miners", amount = -3 }, { kind = "arc_step", arc = "gates" }]

# ----

[[event]]
id = "gates_4_ledger"
family = "arc"
title = "A Log in a Red Scarf"
text = "In a haven bar, a Free Captain in a red scarf slides a data stick across the table without looking at it. Sable Quill says it is the override log of the League convoy that was pushed through the gates the night they failed. She wants it gone from her pocket, and she wants paying."
weight = 2000
arc = "gates"
step = 4
when = [{ kind = "arc_at", arc = "gates", step = 4 }, { kind = "arc_wait", arc = "gates", days = 2 }, { kind = "economy", economy = "haven" }]

[[event.options]]
label = "Pay her 1500 for the stick"
req = [{ kind = "cash", min = 1500 }]
needs = "1500 credits"
[[event.options.outcomes]]
weight = 100
text = "She counts it twice, once for greed and once for fear. The stick is warm, as if someone had been holding it a long time."
effects = [{ kind = "credits", amount = -1500 }, { kind = "standing", faction = "free", amount = 3 }, { kind = "arc_branch", arc = "gates", branch = "ledger" }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Call in a favour"
req = [{ kind = "standing", faction = "free", min = 15 }]
needs = "Free Captains standing 15 or better"
[[event.options.outcomes]]
weight = 100
text = "'You've stood by Free hulls,' Quill says. 'So you get a discount. Nothing, and a debt.' The stick is yours, and so is the debt."
effects = [{ kind = "standing", faction = "free", amount = -3 }, { kind = "arc_branch", arc = "gates", branch = "ledger" }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Lift it while she drinks"
req = [{ kind = "skill", skill = "stealth", min = 3 }]
needs = "stealth of 3 or better"
[[event.options.outcomes]]
weight = 65
text = "Her hand never leaves her cup. Yours leaves with the stick. The bar is loud and so are you, in a quiet way."
effects = [{ kind = "xp", skill = "stealth", amount = 8 }, { kind = "standing", faction = "free", amount = -4 }, { kind = "arc_branch", arc = "gates", branch = "ledger" }, { kind = "arc_step", arc = "gates" }]
[[event.options.outcomes]]
weight = 35
text = "Quill's hand closes on your wrist, kindly. Two of her crew walk you to the dock, and one of them charges for the courtesy."
effects = [{ kind = "credits", amount = -300 }, { kind = "standing", faction = "free", amount = -6 }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Trade her a hold of contraband"
req = [{ kind = "contraband", tons = 6 }]
needs = "6 t of contraband aboard"
[[event.options.outcomes]]
weight = 100
text = "She does the sum with a smile and her crew empty your hold in nine minutes. The stick lands in your hand like a coin."
effects = [{ kind = "lose_contraband", pct = 100 }, { kind = "standing", faction = "free", amount = 4 }, { kind = "arc_branch", arc = "gates", branch = "ledger" }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Say it is none of your business"
[[event.options.outcomes]]
weight = 100
text = "Quill pockets the stick and orders another round. 'Somebody's business, then,' she says."
effects = [{ kind = "arc_step", arc = "gates" }]

# ----

[[event]]
id = "gates_5_override"
family = "arc"
title = "The Commander's Table"
text = "Commander Hask of the Station League asks you aboard his picket. He has heard you have been asking about the convoy that went through the gates. He pours two cups of something that is not coffee, and says the Navy is not the villain of this story, though it may be in the room."
weight = 2000
arc = "gates"
step = 5
when = [{ kind = "arc_at", arc = "gates", step = 5 }, { kind = "arc_wait", arc = "gates", days = 1 }, { kind = "economy", economy = "military" }]

[[event.options]]
label = "Lay the ledger on his table"
req = [{ kind = "arc_branch", arc = "gates", branch = "ledger" }]
needs = "the Free Captains' override log"
[[event.options.outcomes]]
weight = 70
text = "Hask reads for a long time. Then he opens a drawer and takes out a plain steel key. 'The override,' he says. 'Take it where I cannot be asked about it.' A cheque comes out of the same drawer."
effects = [{ kind = "credits", amount = 1500 }, { kind = "standing", faction = "league", amount = -6 }, { kind = "arc_branch", arc = "gates", branch = "leaguekey" }, { kind = "arc_step", arc = "gates" }]
bonus = [{ req = { kind = "role", role = "face", min = 2 }, add = 20 }]
[[event.options.outcomes]]
weight = 30
text = "Hask reads, nods and presses a button. Two marines walk you to a cell for the better part of a week. You get your ship back. You do not get the log."
effects = [{ kind = "days", amount = 3 }, { kind = "credits", amount = -400 }, { kind = "standing", faction = "league", amount = -10 }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Accept a League commission"
req = [{ kind = "standing", faction = "league", min = 15 }]
needs = "League standing 15 or better"
[[event.options.outcomes]]
weight = 100
text = "Hask takes your hand in both of his. The key is in a velvet pouch, which he treats as a joke and does not laugh at. 'Hold it,' he says. 'Do not use it.'"
effects = [{ kind = "credits", amount = 600 }, { kind = "standing", faction = "league", amount = 6 }, { kind = "arc_branch", arc = "gates", branch = "leaguekey" }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Take the key by force"
req = [{ kind = "weapons", min = 4 }]
needs = "weapons power 4 or better"
[[event.options.outcomes]]
weight = 60
text = "The scuffle is short. By the time the picket's marines know the key is gone you are in the dark with it in your fist and a gun at your back."
effects = [{ kind = "standing", faction = "league", amount = -12 }, { kind = "arc_branch", arc = "gates", branch = "leaguekey" }, { kind = "arc_branch", arc = "gates", branch = "blood" }, { kind = "combat", enemy = "picket" }, { kind = "arc_step", arc = "gates" }]
[[event.options.outcomes]]
weight = 40
text = "Hask is faster than he looks. The picket cuts you off and you fight your way to open space with nothing to show for it."
effects = [{ kind = "standing", faction = "league", amount = -12 }, { kind = "arc_branch", arc = "gates", branch = "blood" }, { kind = "combat", enemy = "picket" }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Offer to serve as a civilian witness"
[[event.options.outcomes]]
weight = 100
text = "Hask nods like a man hearing a bell he had hoped not to hear. He sends you off with a letter of passage and the feeling of having been weighed."
effects = [{ kind = "credits", amount = 200 }, { kind = "standing", faction = "league", amount = 2 }, { kind = "arc_step", arc = "gates" }]

# ----

[[event]]
id = "gates_6_charts"
family = "arc"
title = "The Sealed Shelf"
text = "At a Guild archive, Archivist Pell leads you to a shelf behind glass. The original tuning charts for the gate network sit there, withheld under a rule older than she is. Someone worked out what the charts could do, she says, and was frightened."
weight = 2000
arc = "gates"
step = 6
when = [{ kind = "arc_at", arc = "gates", step = 6 }, { kind = "arc_wait", arc = "gates", days = 1 }, { kind = "economy", economy = "research" }]

[[event.options]]
label = "Rebuild the tuning from your score"
req = [{ kind = "arc_branch", arc = "gates", branch = "scored" }, { kind = "role", role = "scientist", min = 2 }]
needs = "the gate score and a scientist of skill 2"
[[event.options.outcomes]]
weight = 85
text = "Your scientist lays the score beside the Guild's indexes and works until the numbers begin to answer back. By dawn you hold a chart in your own hand and your own words, which the rule does not cover."
effects = [{ kind = "standing", faction = "guild", amount = 5 }, { kind = "xp", skill = "survey", amount = 10 }, { kind = "arc_branch", arc = "gates", branch = "charts" }, { kind = "arc_step", arc = "gates" }]
[[event.options.outcomes]]
weight = 15
text = "The numbers answer back wrongly, and a clerk finds you at dawn with a chart that will not hold. Pell tears it in half, kindly."
effects = [{ kind = "standing", faction = "guild", amount = 1 }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Ask the Guild for access"
req = [{ kind = "standing", faction = "guild", min = 20 }]
needs = "Guild standing 20 or better"
[[event.options.outcomes]]
weight = 100
text = "Pell unlocks the glass herself. 'Copy, do not take,' she says, and closes the room while you work."
effects = [{ kind = "standing", faction = "guild", amount = 2 }, { kind = "arc_branch", arc = "gates", branch = "charts" }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Board the archive barge by night"
[[event.options.outcomes]]
weight = 60
text = "The archive barge is quiet in the way of locked rooms. You go in, with all that implies."
