[[event]]
id = "gates_7_wardens"
family = "arc"
title = "The Wardens of Anchorage"
text = "Anchorage lies where the lane runs thin: a dead gate, its ring half in shadow and half in white light. Three bright points detach from the ring and settle before your bow. The wardens do not hail. They wait, and the song in the speakers goes very quiet."
weight = 2000
arc = "gates"
step = 7
when = [{ kind = "arc_at", arc = "gates", step = 7 }, { kind = "arc_wait", arc = "gates", days = 2 }, { kind = "not", req = { kind = "hazard", hazard = "none" } }]

[[event.options]]
label = "Sing the full score"
req = [{ kind = "arc_branch", arc = "gates", branch = "scored" }]
needs = "the gate score you recorded"
[[event.options.outcomes]]
weight = 85
text = "You key the score into the comm and the wardens lean in to listen. At bar nine they tilt, as if to correct you. You correct it. They bow, and the ring lets you through."
effects = [{ kind = "standing", faction = "church", amount = 3 }, { kind = "xp", skill = "survey", amount = 6 }, { kind = "arc_branch", arc = "gates", branch = "warded" }, { kind = "arc_step", arc = "gates" }]
[[event.options.outcomes]]
weight = 15
text = "Bar nine comes out wrong. The wardens' light turns white and the ring answers."
effects = [{ kind = "scare", amount = 2 }, { kind = "combat", enemy = "gate_warden" }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Kneel under the vow of the lamp"
req = [{ kind = "arc_branch", arc = "gates", branch = "vow" }]
needs = "the vow of the lamp"
[[event.options.outcomes]]
weight = 100
text = "Aldous's lamp, hung in your cabin, comes on by itself. The wardens bow to it, and then to you. 'Keeper,' one says, in a voice like a cold bell."
effects = [{ kind = "standing", faction = "church", amount = 4 }, { kind = "arc_branch", arc = "gates", branch = "warded" }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Hold the League key up to the lights"
req = [{ kind = "arc_branch", arc = "gates", branch = "leaguekey" }]
needs = "the League override key"
[[event.options.outcomes]]
weight = 40
text = "The lights flinch from the key and stop. They remember who silenced them. For a long moment they weigh it, and then they let you pass, because the alternative is a conversation they do not want."
effects = [{ kind = "standing", faction = "church", amount = -3 }, { kind = "arc_branch", arc = "gates", branch = "warded" }, { kind = "arc_step", arc = "gates" }]
[[event.options.outcomes]]
weight = 60
text = "They remember the key. They remember the night. They come at you."
effects = [{ kind = "standing", faction = "church", amount = -6 }, { kind = "scare", amount = 2 }, { kind = "combat", enemy = "gate_warden" }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Run the gauntlet of the ring"
[[event.options.outcomes]]
weight = 30
text = "The ring opens a hand's width as you cross the lamp-line. The wardens do not forgive, but they do not follow."
effects = [{ kind = "hull", amount = -8 }, { kind = "xp", skill = "pilot", amount = 8 }, { kind = "arc_step", arc = "gates" }]
bonus = [{ req = { kind = "role", role = "pilot", min = 3 }, add = 50 }]
[[event.options.outcomes]]
weight = 70
text = "The ring clips you as you cross the lamp-line. The paint, the plating and a piece of your night's rest do not come through."
effects = [{ kind = "hull", amount = -22 }, { kind = "scare", amount = 1 }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Open fire first"
req = [{ kind = "weapons", min = 3 }]
needs = "weapons power 3 or better"
[[event.options.outcomes]]
weight = 100
text = "You fire on the lights. The ring answers in the only language it has left."
effects = [{ kind = "standing", faction = "church", amount = -8 }, { kind = "scare", amount = 1 }, { kind = "arc_branch", arc = "gates", branch = "blood" }, { kind = "combat", enemy = "gate_warden" }, { kind = "arc_step", arc = "gates" }]

