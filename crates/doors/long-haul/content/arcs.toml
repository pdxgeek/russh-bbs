[[event]]
id = "league_7_flare"
family = "arc"
title = "The Flare at Beacon Nine"
text = "A radiation flare rolls over Beacon Nine, the last link of the Long Patrol. Two ships are in the glare: a League picket with a failing shield and a Union tug that tried the shortcut for its own reasons. You can reach one of them before the flare peaks."
