[[event]]
id = "gates_8_loom"
family = "arc"
title = "The Loom at the Heart"
text = "Beyond the ring, the old gate's core is a room of glass and humming copper. A voice you cannot place says the gates were never broken. They were locked, from inside, by a design that fails safe. It is waiting for someone to sing them open."
weight = 2000
arc = "gates"
step = 8
when = [{ kind = "arc_at", arc = "gates", step = 8 }, { kind = "arc_wait", arc = "gates", days = 1 }]

[[event.options]]
label = "Listen to the whole song"
req = [{ kind = "arc_branch", arc = "gates", branch = "warded" }]
needs = "peace with the wardens"
[[event.options.outcomes]]
weight = 100
text = "The wardens hold the room quiet while the Loom sings. It takes all night. At the end you understand the lock and the price: one true note, sung by a singer who stays, or never. You also understand it is a choice, and not yours alone."
effects = [{ kind = "standing", faction = "church", amount = 3 }, { kind = "arc_branch", arc = "gates", branch = "truth" }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Read the Guild's charts against the core"
req = [{ kind = "arc_branch", arc = "gates", branch = "charts" }]
needs = "the Guild's tuning charts"
[[event.options.outcomes]]
weight = 100
text = "Chart and core agree to the third decimal. The Guild's secret was never a weapon. It was a price list: the note, the singer, the cost. You copy it down with hands that are not quite steady."
effects = [{ kind = "xp", skill = "survey", amount = 10 }, { kind = "standing", faction = "guild", amount = 3 }, { kind = "arc_branch", arc = "gates", branch = "truth" }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Check the League's log against the core"
req = [{ kind = "arc_branch", arc = "gates", branch = "ledger" }]
needs = "the Free Captains' override log"
[[event.options.outcomes]]
weight = 100
text = "The log's timestamps match the core's own to the second. A League convoy, pushed through on override at three times rated load, and the Loom shut every gate it could reach. It is not a conspiracy so much as a bill."
effects = [{ kind = "xp", skill = "survey", amount = 6 }, { kind = "standing", faction = "league", amount = -4 }, { kind = "arc_branch", arc = "gates", branch = "truth" }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Strip a coil for ring-ore"
req = [{ kind = "arc_branch", arc = "gates", branch = "ringore" }]
needs = "the Union's ring-ore secret"
[[event.options.outcomes]]
weight = 75
text = "The coil comes away with a sound like a sob. Your hold fills with pale metal worth more than your ship. Somewhere in the core, the lock is a little heavier."
effects = [{ kind = "credits", amount = 2500 }, { kind = "standing", faction = "miners", amount = 6 }, { kind = "standing", faction = "church", amount = -6 }, { kind = "wear", amount = 20 }, { kind = "arc_step", arc = "gates" }]
[[event.options.outcomes]]
weight = 25
text = "The coil bites. You get it out, and a piece of your deck with it."
effects = [{ kind = "credits", amount = 1200 }, { kind = "hull", amount = -18 }, { kind = "standing", faction = "church", amount = -6 }, { kind = "arc_step", arc = "gates" }]

[[event.options]]
label = "Take what is loose and go"
[[event.options.outcomes]]
weight = 100
text = "A few relic plates, a coil housing, a vase of something old. The Loom watches you take it, and says nothing."
effects = [{ kind = "cargo", good = "gate_relics", tons = 2 }, { kind = "standing", faction = "church", amount = -2 }, { kind = "arc_step", arc = "gates" }]

