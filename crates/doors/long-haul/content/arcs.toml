title = "The Vote at the Shaft Hall"
text = "The committee meets to vote on the League's offer: a pay rise with no safety ruling, or hold out for both. Dunmore wants the hold-out. The younger stewards want something louder. A vote that goes the wrong way ends the strike. A vote that goes the other way ends something else."
