[[event]]
id = "gates_10_song"
family = "arc"
title = "The Last Bar"
text = "Dawn at Anchorage. The core hums, the wardens hold, and the lane is yours to close or open. Everyone with a claim is in range of a message. The Loom does not rush you. It has waited a generation."
weight = 2000
