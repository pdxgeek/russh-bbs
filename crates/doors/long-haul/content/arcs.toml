needs = "a pilot of skill 2 or better"
[[event.options.outcomes]]
weight = 65
text = "Your pilot flies the picket off its own sensor range. Nobody gets a shot."
effects = [{ kind = "fuel", amount = -6 }, { kind = "arc_step", arc = "free" }]
[[event.options.outcomes]]
weight = 35
text = "A burst clips the stern as you break. You get away, mostly."
effects = [{ kind = "hull", amount = -12 }, { kind = "fuel", amount = -6 }, { kind = "arc_step", arc = "free" }]
[[event.options]]
label = "Make them fight for it"
req = [{ kind = "weapons", min = 2 }]
needs = "weapons of power 2"
[[event.options.outcomes]]
weight = 100
text = "The picket's courtesy ends where your guns begin."
effects = [{ kind = "combat", enemy = "picket" }, { kind = "arc_step", arc = "free" }]
[[event.options]]
label = "Let them search"
[[event.options.outcomes]]
weight = 55
text = "They find a book of numbers they cannot read, and leave unconvinced. You lose an afternoon."
effects = [{ kind = "days", amount = 1 }, { kind = "arc_step", arc = "free" }]
[[event.options.outcomes]]
weight = 45
text = "They photograph a dozen pages before you object. The Free Captains will hear of it soon."
effects = [{ kind = "standing", faction = "free", amount = -3 }, { kind = "standing", faction = "league", amount = 2 }, { kind = "arc_step", arc = "free" }]

[[event]]
id = "free_5_hands"
family = "arc"
title = "Orsk at the rendezvous"
text = "The Fat Mercy waits at the rendezvous with her running lights off. Orsk comes across with Tamsin Vey, his first mate, who carries a sidearm like a pen. 'Good flying,' he says. 'Change of plan. The Reckoner's moved. Hand it over and we're square.'"
weight = 2000
arc = "free"
step = 5
when = [{ kind = "arc_at", arc = "free", step = 5 }, { kind = "arc_wait", arc = "free", days = 1 }]
[[event.options]]
label = "Hand it to Orsk as you swore"
[[event.options.outcomes]]
weight = 100
text = "Orsk takes it like a baby he doesn't much like. He pays 600 for the trouble. Tamsin watches your hands the whole time."
effects = [{ kind = "credits", amount = 600 }, { kind = "standing", faction = "free", amount = 2 }, { kind = "arc_branch", arc = "free", branch = "handed" }, { kind = "arc_step", arc = "free" }]
[[event.options]]
label = "Confront him with his own handwriting"
req = [{ kind = "arc_branch", arc = "free", branch = "reader" }]
needs = "you read the Ledger earlier"
[[event.options.outcomes]]
weight = 60
text = "'The sworn entries are in your hand, Dray.' He does not deny it. Tamsin's hand drifts and drifts back. He pays 1,200 for a silence you have not promised."
effects = [{ kind = "credits", amount = 1200 }, { kind = "standing", faction = "free", amount = -2 }, { kind = "arc_step", arc = "free" }]
[[event.options.outcomes]]
weight = 40
text = "He laughs, then stops. Tamsin's gun is out. You leave with the book, a graze and an enemy."
effects = [{ kind = "hull", amount = -10 }, { kind = "standing", faction = "free", amount = -3 }, { kind = "arc_step", arc = "free" }]
[[event.options]]
label = "Check the pages for forgery"
req = [{ kind = "role", role = "scientist", min = 2 }]
needs = "a scientist of skill 2 or better"
[[event.options.outcomes]]
weight = 100
text = "Your scientist runs the ink under a lamp. Eleven pages are new ink dressed as old. You close the book. 'Back to the haven,' Orsk says, with a smile that doesn't reach."
effects = [{ kind = "arc_branch", arc = "free", branch = "reader" }, { kind = "arc_step", arc = "free" }]
[[event.options]]
label = "Not until the Reckoner has it"
[[event.options.outcomes]]
weight = 50
text = "Orsk shrugs and lets you go, which is worse than shouting. Tamsin's ship holds station behind you for a day."
effects = [{ kind = "standing", faction = "free", amount = -2 }, { kind = "arc_step", arc = "free" }]
[[event.options.outcomes]]
weight = 50
text = "Tamsin fires across your bow, Orsk shouts at her, and then, a long moment later, at you."
effects = [{ kind = "hull", amount = -8 }, { kind = "standing", faction = "free", amount = -2 }, { kind = "arc_step", arc = "free" }]

[[event]]
id = "free_6_raid"
family = "arc"
title = "Blackout at Brindle's Rest"
text = "The haven's lights go out in a pattern. Union enforcers are in the lane, five of them, on a schedule only someone who had sold the haven's own could have given them. Everyone is shouting on the comm and nobody is in command."
weight = 2000
arc = "free"
step = 6
when = [{ kind = "arc_at", arc = "free", step = 6 }, { kind = "arc_wait", arc = "free", days = 1 }, { kind = "economy", economy = "haven" }]
[[event.options]]
label = "Hold the lane and fight"
req = [{ kind = "weapons", min = 3 }]
needs = "weapons of power 3"
[[event.options.outcomes]]
weight = 100
text = "You put your hull between the haven and the enforcers. The Free Captains don't forget this kind of thing."
effects = [{ kind = "standing", faction = "free", amount = 6 }, { kind = "combat", enemy = "enforcer" }, { kind = "arc_step", arc = "free" }]
[[event.options]]
label = "Broadcast the warning to every dock"
[[event.options.outcomes]]
weight = 70
text = "The haven scatters. Every captain who can fly is out of the pocket in twenty minutes, and your name is on the comm."
effects = [{ kind = "standing", faction = "free", amount = 4 }, { kind = "hull", amount = -10 }, { kind = "arc_step", arc = "free" }]
[[event.options.outcomes]]
weight = 30
text = "The warning lands late. The haven loses a dock, and some of the people on it."
effects = [{ kind = "standing", faction = "free", amount = 2 }, { kind = "hull", amount = -15 }, { kind = "arc_step", arc = "free" }]
[[event.options]]
label = "Trade the haven's lanes to the Union"
req = [{ kind = "standing", faction = "miners", min = 10 }]
needs = "standing 10 with the Miners' Union"
[[event.options.outcomes]]
weight = 100
text = "A marshal takes your offer with the grace of a man buying a coat. 800 credits and a promise to pass the Fat Mercy by. The haven burns anyway."
effects = [{ kind = "credits", amount = 800 }, { kind = "standing", faction = "miners", amount = 6 }, { kind = "standing", faction = "free", amount = -10 }, { kind = "arc_branch", arc = "free", branch = "turncoat" }, { kind = "arc_step", arc = "free" }]
[[event.options]]
label = "Ask Orsk's mate where the book is"
req = [{ kind = "arc_branch", arc = "free", branch = "handed" }]
needs = "you handed the Ledger to Orsk"
[[event.options.outcomes]]
weight = 100
text = "Tamsin Vey tells you, flat as a deck plate: the Ledger is on the Union's table, traded for Orsk's pardon. She is crying and does not want to be seen. She asks you to remember she said it."
effects = [{ kind = "standing", faction = "free", amount = 2 }, { kind = "arc_step", arc = "free" }]

[[event]]
id = "free_7_moot"
family = "arc"
title = "The moot in the dark"
text = "The survivors meet in a gutted cargo hall and call it a moot. Forty captains, the Reckoner's empty chair, and a long table where the Ledger would be. They want to hear who will speak for it, and they do not much care who."
weight = 2000
arc = "free"
step = 7
when = [{ kind = "arc_at", arc = "free", step = 7 }, { kind = "arc_wait", arc = "free", days = 1 }]
[[event.options]]
label = "Speak for the debts you paid"
req = [{ kind = "arc_branch", arc = "free", branch = "oath" }]
needs = "you paid Calla's debt"
[[event.options.outcomes]]
weight = 100
text = "Calla Voss stands up in the third row and says, 'Paid.' It carries."
effects = [{ kind = "standing", faction = "free", amount = 8 }, { kind = "arc_step", arc = "free" }]
[[event.options]]
label = "Read the forged pages aloud"
req = [{ kind = "arc_branch", arc = "free", branch = "reader" }]
needs = "you read the Ledger earlier"
[[event.options.outcomes]]
weight = 70
text = "You name the pages Orsk forged. A groan, a chair knocked over. The moot decides, noisily, that Orsk's seat is empty."
effects = [{ kind = "standing", faction = "free", amount = 6 }, { kind = "arc_step", arc = "free" }]
[[event.options.outcomes]]
weight = 30
text = "A Marrow Hand captain objects that your proof is your word. The vote is close, and ugly."
effects = [{ kind = "standing", faction = "free", amount = 2 }, { kind = "arc_step", arc = "free" }]
[[event.options]]
label = "Ask Ysolde Bright to stand with you"
req = [{ kind = "not", req = { kind = "arc_branch", arc = "free", branch = "blood" } }]
needs = "you did not shoot first at Gallows Reach"
[[event.options.outcomes]]
weight = 100
text = "Bright arrives with two skiffs and a sour face. 'I said I'd remember you,' she says. 'I'd rather remember this.'"
effects = [{ kind = "standing", faction = "free", amount = 4 }, { kind = "credits", amount = 300 }, { kind = "arc_step", arc = "free" }]
[[event.options]]
label = "Slip out before the vote"
req = [{ kind = "arc_branch", arc = "free", branch = "turncoat" }]
needs = "you traded the haven to the Union"
[[event.options.outcomes]]
weight = 100
text = "You leave before the vote. Nobody follows you, which is its own verdict."
effects = [{ kind = "standing", faction = "free", amount = -4 }, { kind = "arc_step", arc = "free" }]
[[event.options]]
label = "Stand at the back and listen"
[[event.options.outcomes]]
weight = 100
text = "Nobody shouts at you. Nobody speaks to you. You learn which captains still count."
effects = [{ kind = "standing", faction = "free", amount = 1 }, { kind = "arc_step", arc = "free" }]

[[event]]
id = "free_8_ledger"
family = "arc"
title = "Who owns the Black Ledger"
text = "Whoever holds the Ledger holds every captain's name. If you hold it, the moot goes quiet and waits. If you do not, it waits for what you do about the man who does. Dawn is coming through the cargo hall's broken roof."
weight = 2000
arc = "free"
step = 8
when = [{ kind = "arc_at", arc = "free", step = 8 }]
[[event.options]]
label = "Burn it page by page"
req = [{ kind = "not", req = { kind = "arc_branch", arc = "free", branch = "handed" } }, { kind = "not", req = { kind = "arc_branch", arc = "free", branch = "turncoat" } }]
needs = "the book in your hold, and no turncoat"
[[event.options.outcomes]]
weight = 100
text = "You feed it to the furnace a handful of pages at a time. By dawn every debt in the Free Captains is forgiven, and every grudge is theirs again."
effects = [{ kind = "standing", faction = "free", amount = 10 }, { kind = "ending", arc = "free", ending = "burned" }]
[[event.options]]
label = "Sell it to the League"
req = [{ kind = "not", req = { kind = "arc_branch", arc = "free", branch = "handed" } }]
needs = "the book in your hold"
[[event.options.outcomes]]
weight = 70
text = "A League attaché pays 4,500 for the book and 500 more not to ask how it was edited. The captains it names will be arrested one at a time, over years."
effects = [{ kind = "credits", amount = 5000 }, { kind = "standing", faction = "league", amount = 8 }, { kind = "standing", faction = "free", amount = -20 }, { kind = "ending", arc = "free", ending = "sold" }]
[[event.options.outcomes]]
weight = 30
text = "The attaché gets his book and a lawyer's promise that your fee will be 'processed'. 2,500 arrives eventually."
effects = [{ kind = "credits", amount = 2500 }, { kind = "standing", faction = "league", amount = 5 }, { kind = "standing", faction = "free", amount = -20 }, { kind = "ending", arc = "free", ending = "sold" }]
[[event.options]]
label = "Take the Reckoner's chair"
req = [{ kind = "not", req = { kind = "arc_branch", arc = "free", branch = "handed" } }, { kind = "not", req = { kind = "arc_branch", arc = "free", branch = "turncoat" } }, { kind = "arc_branch", arc = "free", branch = "oath" }, { kind = "standing", faction = "free", min = 25 }]
needs = "oath kept, standing 25 with the Free Captains"
[[event.options.outcomes]]
weight = 100
text = "The chair is too tall and the seat is cold, but nobody argues. You are the Reckoner now, a job with no pay and a long reach."
effects = [{ kind = "standing", faction = "free", amount = 12 }, { kind = "credits", amount = 1000 }, { kind = "ending", arc = "free", ending = "keeper" }]
[[event.options]]
label = "Hunt Orsk down for the book"
req = [{ kind = "arc_branch", arc = "free", branch = "handed" }]
needs = "you handed the Ledger to Orsk"
[[event.options.outcomes]]
weight = 100
text = "Orsk runs with a Union pardon in his teeth and a corsair at his heel. When it is over the book is yours, and the furnace is lit."
effects = [{ kind = "standing", faction = "free", amount = 4 }, { kind = "combat", enemy = "corsair" }, { kind = "ending", arc = "free", ending = "burned" }]
[[event.options]]
label = "Walk away from it all"
[[event.options.outcomes]]
weight = 100
text = "You are not the Reckoner and do not want to be. The Ledger finds another hand, and another, and they all end with the same ink."
effects = [{ kind = "standing", faction = "free", amount = -2 }, { kind = "ending", arc = "free", ending = "passed" }]

[[event]]
id = "guild_1_gap"
family = "arc"
title = "Blanks on the board"
text = "Surveyor-Chief Idris Holm has a wall of charts with the same grey hole in one corner. 'The Guild won't fund it,' he says. 'Blank is a policy, not a fact. Take a sounding in the dark and I'll pay for it, and I'll pretend I never asked.'"
weight = 2000
arc = "guild"
step = 1
when = [{ kind = "arc_at", arc = "guild", step = 1 }, { kind = "standing", faction = "guild", min = 10 }, { kind = "economy", economy = "research" }]
[[event.options]]
label = "Take the commission"
[[event.options.outcomes]]
weight = 100
text = "Holm stamps a chit and looks relieved. A modest commission for a modest sounding, and the hole in his wall stays where it is."
effects = [{ kind = "survey", value = 300 }, { kind = "standing", faction = "guild", amount = 3 }, { kind = "arc_step", arc = "guild" }]
[[event.options]]
label = "Bring a scientist's sounding"
req = [{ kind = "role", role = "scientist", min = 2 }]
needs = "a scientist of skill 2 or better"
[[event.options.outcomes]]
weight = 100
text = "Your scientist's rig is better than anything on the Guild's racks. Holm takes the data like a man handed a cold drink."
effects = [{ kind = "survey", value = 600 }, { kind = "standing", faction = "guild", amount = 4 }, { kind = "arc_step", arc = "guild" }]
[[event.options]]
label = "Ask for an advance"
[[event.options.outcomes]]
weight = 100
text = "Holm winces and pays 400 out of a drawer marked 'Contingency'. He writes it down anyway."
effects = [{ kind = "credits", amount = 400 }, { kind = "standing", faction = "guild", amount = -1 }, { kind = "arc_step", arc = "guild" }]

[[event]]
id = "guild_2_buoy"
family = "arc"
title = "A buoy that won't die"
text = "A Guild buoy tumbles by with a dead beacon and a live data port, still transmitting a chart on a loop. A lovely chart, hand-inked, every sounding in neat columns. Four of the systems on it are on no list you have ever seen."
weight = 2000
arc = "guild"
step = 2
when = [{ kind = "arc_at", arc = "guild", step = 2 }, { kind = "arc_wait", arc = "guild", days = 1 }]
[[event.options]]
label = "Copy the full chart to your own drive"
req = [{ kind = "scanner", min = 1 }]
needs = "a working scanner"
[[event.options.outcomes]]
weight = 100
text = "The buoy hands it over without a flicker. A hundred megabytes of somebody's patient life."
effects = [{ kind = "survey", value = 400 }, { kind = "arc_branch", arc = "guild", branch = "copy" }, { kind = "arc_step", arc = "guild" }]
[[event.options]]
label = "Report the buoy to the Guild as found"
[[event.options.outcomes]]
weight = 100
text = "Dispatch logs it with a clerk's boredom and a receipt number. 200 credits for the find, a promise of a callback."
effects = [{ kind = "credits", amount = 200 }, { kind = "standing", faction = "guild", amount = 3 }, { kind = "arc_branch", arc = "guild", branch = "report" }, { kind = "arc_step", arc = "guild" }]
[[event.options]]
label = "Copy it, then report it"
req = [{ kind = "scanner", min = 1 }, { kind = "standing", faction = "guild", min = 10 }]
needs = "a scanner, and Guild standing 10"
[[event.options.outcomes]]
weight = 100
text = "You copy the chart, then file the buoy by the book. The receipt is for a dead buoy. The copy is for you."
effects = [{ kind = "survey", value = 200 }, { kind = "standing", faction = "guild", amount = 2 }, { kind = "arc_branch", arc = "guild", branch = "copy" }, { kind = "arc_branch", arc = "guild", branch = "report" }, { kind = "arc_step", arc = "guild" }]
[[event.options]]
label = "Pull the core and move on"
[[event.options.outcomes]]
weight = 60
text = "You pull the memory core and drop it into the dark. It is the kind of thing that sticks to you afterwards."
effects = [{ kind = "xp", skill = "stealth", amount = 20 }, { kind = "arc_step", arc = "guild" }]
[[event.options.outcomes]]
weight = 40
text = "The buoy wipes itself and takes a spar of your antenna with it. You would have done the same."
effects = [{ kind = "hull", amount = -4 }, { kind = "arc_step", arc = "guild" }]

[[event]]
id = "guild_3_pell"
family = "arc"
title = "Pell Anwen's drawer"
text = "At a research dock an archivist named Pell Anwen asks to see your chart over tea. She knows the hand at once: Marek Osei, the Guild's best surveyor, dead forty years. She keeps her voice level. 'He drew this after they said he died, you know.'"
weight = 2000
arc = "guild"
step = 3
when = [{ kind = "arc_at", arc = "guild", step = 3 }, { kind = "arc_wait", arc = "guild", days = 1 }, { kind = "economy", economy = "research" }]
[[event.options]]
label = "Show her your copy"
req = [{ kind = "arc_branch", arc = "guild", branch = "copy" }]
needs = "you copied the chart"
[[event.options.outcomes]]
weight = 100
text = "Pell reads all night and finds the soundings match Marek's last working papers, down to a coffee ring. She trusts you, and she is afraid."
effects = [{ kind = "standing", faction = "guild", amount = 2 }, { kind = "credits", amount = 300 }, { kind = "arc_branch", arc = "guild", branch = "ally" }, { kind = "arc_step", arc = "guild" }]
[[event.options]]
label = "Let her read the Guild's receipt"
req = [{ kind = "arc_branch", arc = "guild", branch = "report" }]
needs = "you reported the buoy"
[[event.options.outcomes]]
weight = 100
text = "Pell frowns at the receipt. The Guild never opened it, she says; the report went to the Cartographer-General's desk and nowhere else."
effects = [{ kind = "standing", faction = "guild", amount = 1 }, { kind = "xp", skill = "survey", amount = 30 }, { kind = "arc_step", arc = "guild" }]
[[event.options]]
label = "Pay her to authenticate it"
req = [{ kind = "cash", min = 200 }]
needs = "200 credits in the purse"
[[event.options.outcomes]]
weight = 100
text = "Pell examines the ink, the rounding, the constants. 'It's his,' she says. 'Forgers never make his mistakes.' She will not take more."
effects = [{ kind = "credits", amount = -200 }, { kind = "arc_branch", arc = "guild", branch = "ally" }, { kind = "arc_step", arc = "guild" }]
[[event.options]]
label = "Say it's nothing and finish the tea"
[[event.options.outcomes]]
weight = 100
text = "Pell nods and does not believe you. The cup rings on its saucer for some time afterwards."
effects = [{ kind = "standing", faction = "guild", amount = -1 }, { kind = "arc_step", arc = "guild" }]

[[event]]
id = "guild_4_system"
family = "arc"
title = "A system on nobody's list"
text = "You find the system where Marek's chart says it should be: a dim K star, six planets, and a ring of old coils where nothing should be. Your sensors match his soundings to the decimal. It is like finding a stranger's face on a coin."
weight = 2000
arc = "guild"
step = 4
when = [{ kind = "arc_at", arc = "guild", step = 4 }, { kind = "arc_wait", arc = "guild", days = 1 }]
[[event.options]]
label = "Survey it properly"
req = [{ kind = "skill", skill = "survey", min = 2 }]
needs = "Surveying 2"
[[event.options.outcomes]]
weight = 100
text = "Three days of careful work. The data is the best the Guild will never see. Marek Osei's soundings agree with yours."
effects = [{ kind = "survey", value = 1000 }, { kind = "xp", skill = "survey", amount = 60 }, { kind = "days", amount = 1 }, { kind = "arc_step", arc = "guild" }]
[[event.options]]
label = "Read the ring of coils"
req = [{ kind = "role", role = "engineer", min = 2 }]
needs = "an engineer of skill 2 or better"
[[event.options.outcomes]]
weight = 70
text = "Your engineer reads the coils: gate coils, cold, older than the Guild, with a Church seal on the housing."
effects = [{ kind = "survey", value = 500 }, { kind = "arc_step", arc = "guild" }]
[[event.options.outcomes]]
weight = 30
text = "A coil flares and burns a patch of hull before your engineer can say what it is."
effects = [{ kind = "survey", value = 500 }, { kind = "hull", amount = -8 }, { kind = "arc_step", arc = "guild" }]
[[event.options]]
label = "Board the survey cutter in the ring"
[[event.options.outcomes]]
weight = 100
text = "Marek's own cutter, patient as a held breath."
effects = [{ kind = "board", derelict = "survey_cutter" }, { kind = "arc_step", arc = "guild" }]
[[event.options]]
label = "Sound it from the edge and leave"
[[event.options.outcomes]]
weight = 100
text = "A brisk, quiet pass. You tell yourself you will be back."
effects = [{ kind = "survey", value = 350 }, { kind = "arc_step", arc = "guild" }]

[[event]]
id = "guild_5_auditor"
family = "arc"
title = "The auditor's tender"
text = "A Guild tender matches your velocity and a woman in grey brocade comes across on a line. Auditor Sele Marrick, of the Cartographer-General's office. 'You've been out of the pattern,' she says. 'A buoy, a system, a copy. We take the Guild's property very seriously.' She holds out a hand."
weight = 2000
arc = "guild"
step = 5
when = [{ kind = "arc_at", arc = "guild", step = 5 }, { kind = "arc_wait", arc = "guild", days = 1 }]
[[event.options]]
label = "Hand over the copy"
req = [{ kind = "arc_branch", arc = "guild", branch = "copy" }]
needs = "you copied the chart"
[[event.options.outcomes]]
weight = 100
text = "Marrick checks the drive, wipes it, and writes a cheque for 1,500 with an apology folded in. The cheque clears. The apology doesn't."
effects = [{ kind = "credits", amount = 1500 }, { kind = "standing", faction = "guild", amount = 5 }, { kind = "arc_branch", arc = "guild", branch = "buried" }, { kind = "arc_step", arc = "guild" }]
[[event.options]]
label = "Hide the copy and bluff"
req = [{ kind = "skill", skill = "stealth", min = 2 }]
needs = "Stealth 2"
[[event.options.outcomes]]
weight = 65
text = "She goes through your ship politely and finds an honest manifest and a tired crew. The copy sits in a coffee tin."
effects = [{ kind = "xp", skill = "stealth", amount = 30 }, { kind = "arc_step", arc = "guild" }]
[[event.options.outcomes]]
weight = 35
text = "A search dog sniffs out the tin. Marrick keeps the copy, fines you 600, and writes your hull number in a small neat book."
effects = [{ kind = "credits", amount = -600 }, { kind = "standing", faction = "guild", amount = -4 }, { kind = "arc_branch", arc = "guild", branch = "buried" }, { kind = "arc_step", arc = "guild" }]
[[event.options]]
label = "Have Pell Anwen vouch for you"
req = [{ kind = "arc_branch", arc = "guild", branch = "ally" }]
needs = "Pell Anwen is on your side"
[[event.options.outcomes]]
weight = 100
text = "Marrick reads the vouch. 'Pell is a bad influence,' she says, and lets you go, and probably writes down Pell's name too."
effects = [{ kind = "standing", faction = "guild", amount = 2 }, { kind = "arc_step", arc = "guild" }]
[[event.options]]
label = "Cut the tender loose"
req = [{ kind = "weapons", min = 2 }]
needs = "weapons of power 2"
[[event.options.outcomes]]
weight = 100
text = "You decline, in the loudest way a ship can."
effects = [{ kind = "standing", faction = "guild", amount = -6 }, { kind = "combat", enemy = "cutter" }, { kind = "arc_step", arc = "guild" }]
[[event.options]]
label = "Say you have nothing, and offer tea"
[[event.options.outcomes]]
weight = 55
text = "Marrick sips the tea. Nothing is said. She leaves a card, and a smell of lavender."
effects = [{ kind = "arc_step", arc = "guild" }]
bonus = [{ req = { kind = "role", role = "face", min = 2 }, add = 30 }]
[[event.options.outcomes]]
weight = 45
text = "She does not believe you, and says so, and writes your name on a list."
effects = [{ kind = "standing", faction = "guild", amount = -3 }, { kind = "arc_step", arc = "guild" }]

[[event]]
id = "guild_6_ring"
family = "arc"
title = "The gate that isn't on the map"
text = "Marek's coordinates end at a dark ring and a grey-robed figure in a skiff, waving a lantern. 'The Church tended this gate before the Guild was a guild,' she says. 'We took it off the maps. We would ask you, nicely, to take it off yours.'"
weight = 2000
arc = "guild"
step = 6
when = [{ kind = "arc_at", arc = "guild", step = 6 }, { kind = "arc_wait", arc = "guild", days = 1 }]
[[event.options]]
label = "Promise the Church your silence"
[[event.options.outcomes]]
weight = 100
text = "She presses a hand to her chest. 'The Quiet thanks you.' You have promised, and you can feel the weight of it."
effects = [{ kind = "standing", faction = "church", amount = 6 }, { kind = "standing", faction = "guild", amount = -2 }, { kind = "arc_branch", arc = "guild", branch = "silence" }, { kind = "arc_step", arc = "guild" }]
[[event.options]]
label = "Show her the chart and ask why"
req = [{ kind = "arc_branch", arc = "guild", branch = "copy" }]
needs = "you copied the chart"
[[event.options.outcomes]]
weight = 60
text = "She reads it by lantern. 'He found it honestly,' she says, 'and we were wrong to hide it. Keep your copy, and keep it to yourself.'"
effects = [{ kind = "standing", faction = "church", amount = 3 }, { kind = "arc_step", arc = "guild" }]
[[event.options.outcomes]]
weight = 40
text = "She reads it and her face shuts. A gate warden wakes behind her. 'Then you cannot be trusted with it.'"
effects = [{ kind = "standing", faction = "church", amount = -6 }, { kind = "combat", enemy = "gate_warden" }, { kind = "arc_step", arc = "guild" }]
[[event.options]]
label = "Propose a joint chart with Pell's help"
req = [{ kind = "arc_branch", arc = "guild", branch = "ally" }]
needs = "Pell Anwen is on your side"
[[event.options.outcomes]]
weight = 100
text = "The sister laughs. 'The Guild has not shared a pencil with us in forty years.' But she writes it down, and signs it."
effects = [{ kind = "standing", faction = "church", amount = 3 }, { kind = "standing", faction = "guild", amount = 3 }, { kind = "arc_step", arc = "guild" }]
[[event.options]]
label = "Tell her the Guild already knows"
req = [{ kind = "arc_branch", arc = "guild", branch = "report" }]
needs = "you reported the buoy"
[[event.options.outcomes]]
weight = 100
text = "She goes grey. 'Then it has already begun,' she says, and signs off before you can ask what."
effects = [{ kind = "standing", faction = "church", amount = -2 }, { kind = "arc_step", arc = "guild" }]

[[event]]
id = "guild_7_blank"
family = "arc"
title = "What the chart is for"
text = "The chart is on the table and it says four things the Guild never wanted said. A blank on a map is a promise nobody has to keep. You can fill it in, hold it back or sell it. Rook's office is on your comm. So are the Church, and the Free Captains."
weight = 2000
arc = "guild"
step = 7
when = [{ kind = "arc_at", arc = "guild", step = 7 }]
[[event.options]]
label = "Publish it to every dock"
req = [{ kind = "arc_branch", arc = "guild", branch = "copy" }, { kind = "not", req = { kind = "arc_branch", arc = "guild", branch = "buried" } }, { kind = "not", req = { kind = "arc_branch", arc = "guild", branch = "silence" } }]
needs = "your own copy, no sale, no oath of silence"
[[event.options.outcomes]]
weight = 100
text = "You push it to every beacon on the lane at once. By morning every dock has a Marek Osei chart on its board. Rook resigns by noon, or is made to."
effects = [{ kind = "standing", faction = "guild", amount = 6 }, { kind = "standing", faction = "church", amount = -10 }, { kind = "credits", amount = 500 }, { kind = "ending", arc = "guild", ending = "published" }]
[[event.options]]
label = "Sell it to the Free Captains"
req = [{ kind = "arc_branch", arc = "guild", branch = "copy" }, { kind = "not", req = { kind = "arc_branch", arc = "guild", branch = "buried" } }]
needs = "your own copy, not handed over"
[[event.options.outcomes]]
weight = 70
text = "A haven pays 3,500 in coin and a promise of passage. The Guild's surveyors notice by noon; so does Rook."
effects = [{ kind = "credits", amount = 3500 }, { kind = "standing", faction = "free", amount = 8 }, { kind = "standing", faction = "guild", amount = -12 }, { kind = "ending", arc = "guild", ending = "sold" }]
[[event.options.outcomes]]
weight = 30
text = "The havens pay less than promised: 2,000 and a bottle. It is enough to be hated for."
effects = [{ kind = "credits", amount = 2000 }, { kind = "standing", faction = "free", amount = 5 }, { kind = "standing", faction = "guild", amount = -12 }, { kind = "ending", arc = "guild", ending = "sold" }]
[[event.options]]
label = "Deliver it to the Church vault"
req = [{ kind = "arc_branch", arc = "guild", branch = "silence" }]
needs = "you promised the Church your silence"
[[event.options.outcomes]]
weight = 100
text = "Sealed in a reliquary under a candle. The Church thanks you the way a cold room is warmed by one match."
effects = [{ kind = "credits", amount = 1500 }, { kind = "standing", faction = "church", amount = 12 }, { kind = "standing", faction = "guild", amount = -4 }, { kind = "ending", arc = "guild", ending = "sealed" }]
[[event.options]]
label = "File it with Pell, let the Guild argue"
req = [{ kind = "arc_branch", arc = "guild", branch = "ally" }]
needs = "Pell Anwen is on your side"
[[event.options.outcomes]]
weight = 100
text = "Pell enters it in the Guild's own drawers under a boring name. The Guild will argue about it for ten years, publicly, which is how truths are kept."
effects = [{ kind = "credits", amount = 800 }, { kind = "standing", faction = "guild", amount = 8 }, { kind = "ending", arc = "guild", ending = "filed" }]
[[event.options]]
label = "Leave it unread"
[[event.options.outcomes]]
weight = 100
text = "You close the drive and fly on. Somebody else will fill the blank one day, with less care."
effects = [{ kind = "credits", amount = 300 }, { kind = "standing", faction = "guild", amount = 2 }, { kind = "ending", arc = "guild", ending = "filed" }]

[[event]]
id = "church_1_candles"
family = "arc"
title = "Candles for a dead gate"
text = "At a Church waystation Warden-Mother Elspeth Quill counts candles into a crate. 'Tallow is cheap and the vigil is long,' she says. 'Carry these to the gate at Hollow Reach and sit with us a night. The Quiet does not ask for much. It asks for it for a very long time.'"
weight = 2000
arc = "church"
step = 1
when = [{ kind = "arc_at", arc = "church", step = 1 }, { kind = "standing", faction = "church", min = 10 }]
[[event.options]]
label = "Carry the candles"
[[event.options.outcomes]]
weight = 100
text = "A crate you can lift with one hand. A night's work, she says, and then the long wait."
effects = [{ kind = "standing", faction = "church", amount = 3 }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Donate medicine for the pilgrims"
req = [{ kind = "good", good = "medicine", tons = 2 }]
needs = "2 t of medicine aboard"
[[event.options.outcomes]]
weight = 100
text = "Quill weighs a vial in her hand like coin. 'The sick are the vigil's first duty.' The ledger is not a place she writes your name, but she remembers."
effects = [{ kind = "cargo", good = "medicine", tons = -2 }, { kind = "standing", faction = "church", amount = 6 }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Charge her for the haul"
[[event.options.outcomes]]
weight = 100
text = "Quill pays 250 without a word, and writes down the sum. The Church has long memories and short change."
effects = [{ kind = "credits", amount = 250 }, { kind = "standing", faction = "church", amount = -2 }, { kind = "arc_step", arc = "church" }]

[[event]]
id = "church_2_vigil"
family = "arc"
title = "A night at Hollow Reach"
text = "The gate at Hollow Reach is a ring of dead coil three kilometres across, and a few dozen of the faithful have anchored a circle of ships around it. They sit in the dark with candles. The gate hums so low you feel it in your teeth."
weight = 2000
arc = "church"
step = 2
when = [{ kind = "arc_at", arc = "church", step = 2 }, { kind = "arc_wait", arc = "church", days = 1 }]
[[event.options]]
label = "Sit the whole vigil"
[[event.options.outcomes]]
weight = 100
text = "A night gone. Nobody speaks; somebody weeps. You think you hear a pattern in the hum, and then you stop thinking."
effects = [{ kind = "days", amount = 1 }, { kind = "standing", faction = "church", amount = 4 }, { kind = "scare", amount = -1 }, { kind = "arc_branch", arc = "church", branch = "vigil" }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Tend the sick pilgrims"
req = [{ kind = "role", role = "medic", min = 2 }]
needs = "a medic of skill 2 or better"
[[event.options.outcomes]]
weight = 100
text = "Your medic has a long night among the fevers. The vigil's hurt are the quietest patients you have known."
effects = [{ kind = "days", amount = 1 }, { kind = "standing", faction = "church", amount = 6 }, { kind = "treat", amount = 1 }, { kind = "arc_branch", arc = "church", branch = "vigil" }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Listen to the gate on your scanner"
req = [{ kind = "scanner", min = 2 }]
needs = "a scanner of grade 2 or better"
[[event.options.outcomes]]
weight = 70
text = "The hum has a rhythm. Your scanner draws it as a spiral. You file the trace and tell no one."
effects = [{ kind = "survey", value = 400 }, { kind = "arc_step", arc = "church" }]
[[event.options.outcomes]]
weight = 30
text = "The hum bites back as a feedback shriek. The scanner ghosts for an hour."
effects = [{ kind = "survey", value = 200 }, { kind = "wear", amount = 20 }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Stay an hour and slip away"
[[event.options.outcomes]]
weight = 100
text = "Hollow Reach is poor company for a captain with a schedule. Quill says nothing; her face says it for her."
effects = [{ kind = "standing", faction = "church", amount = -1 }, { kind = "arc_step", arc = "church" }]

[[event]]
id = "church_3_opened"
family = "arc"
title = "The Opened ask for passage"
text = "A pilgrim barge hails you. Brother Tobias Wren leads it: thin, gentle, certain. The Opened believe the gates were never dead, only asleep, and that the Church's vigils keep them so. 'We want to wake it,' he says. 'Will you carry six of us to the Reach, and not tell Mother Quill?'"
weight = 2000
arc = "church"
step = 3
when = [{ kind = "arc_at", arc = "church", step = 3 }, { kind = "arc_wait", arc = "church", days = 1 }]
[[event.options]]
label = "Carry them for coin"
[[event.options.outcomes]]
weight = 100
text = "Six pilgrims, one honest gentleman, a chest they do not open. Wren pays 500 and shakes your hand with both of his."
effects = [{ kind = "credits", amount = 500 }, { kind = "standing", faction = "church", amount = -4 }, { kind = "arc_branch", arc = "church", branch = "heresy" }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Tell Mother Quill"
[[event.options.outcomes]]
weight = 100
text = "Quill receives the news with a stone face and absolute silence. A week later a Church ship turns the barge around."
effects = [{ kind = "standing", faction = "church", amount = 6 }, { kind = "arc_branch", arc = "church", branch = "informer" }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Argue the sleeping gate with Wren"
req = [{ kind = "role", role = "face", min = 2 }]
needs = "a face of skill 2 or better"
[[event.options.outcomes]]
weight = 60
text = "You talk for an hour and neither of you moves. He leaves a pamphlet; you leave a point he will chew on."
effects = [{ kind = "xp", skill = "trade", amount = 40 }, { kind = "arc_step", arc = "church" }]
[[event.options.outcomes]]
weight = 40
text = "He argues better than you do. You leave with a pamphlet you will secretly read."
effects = [{ kind = "arc_branch", arc = "church", branch = "heresy" }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Turn the barge away without a word"
[[event.options.outcomes]]
weight = 100
text = "Wren bows his head and the barge turns. You feel as though you have closed a door and are not sure on whom."
effects = [{ kind = "standing", faction = "church", amount = 1 }, { kind = "arc_step", arc = "church" }]

[[event]]
id = "church_4_reliquary"
family = "arc"
title = "The reliquary ship"
text = "The Church's reliquary ship rides at anchor near the gate: one vault, one relic, the gate-key, a band of gold-grey metal no bigger than a wedding ring. Quill asks you to stand guard the night. Wren's people have gone very quiet."
weight = 2000
arc = "church"
step = 4
when = [{ kind = "arc_at", arc = "church", step = 4 }, { kind = "arc_wait", arc = "church", days = 1 }]
[[event.options]]
label = "Guard the vault"
req = [{ kind = "weapons", min = 2 }]
needs = "weapons of power 2"
[[event.options.outcomes]]
weight = 100
text = "Someone comes in the small hours, crew in grey masks, and you drive them off. Quill's thanks is a closed hand on your sleeve."
effects = [{ kind = "standing", faction = "church", amount = 5 }, { kind = "combat", enemy = "marauder" }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Slip the key into your pocket"
req = [{ kind = "skill", skill = "stealth", min = 2 }]
needs = "Stealth 2"
[[event.options.outcomes]]
weight = 70
text = "The vault is old and your hands are quick. The ring is in your hold before the candle gutters."
effects = [{ kind = "standing", faction = "church", amount = -8 }, { kind = "arc_branch", arc = "church", branch = "key" }, { kind = "arc_step", arc = "church" }]
[[event.options.outcomes]]
weight = 30
text = "A warden sees your hand in the case. Quill takes the ring back herself, and what she says is the quietest thing you have ever heard."
effects = [{ kind = "standing", faction = "church", amount = -10 }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Raid the reliquary"
[[event.options.outcomes]]
weight = 100
text = "The Church will call it sacrilege. Your crew will call it a payday. The vault's hatch is old and closed and shows no fear."
effects = [{ kind = "standing", faction = "church", amount = -8 }, { kind = "arc_branch", arc = "church", branch = "key" }, { kind = "board", derelict = "church_reliquary" }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Stay out of it"
[[event.options.outcomes]]
weight = 100
text = "A night's sleep. In the morning nobody mentions the vault, and Quill's look says everyone knows who slept."
effects = [{ kind = "standing", faction = "church", amount = -1 }, { kind = "arc_step", arc = "church" }]

[[event]]
id = "church_5_quill"
family = "arc"
title = "Mother Quill asks"
text = "Quill finds you at breakfast, a bowl of grey porridge in her hand, and sits across from you. 'I hear things,' she says. 'Who carried whom. Who knows what. I would like you to answer me honestly, and I would like you to know I will know.'"
weight = 2000
arc = "church"
step = 5
when = [{ kind = "arc_at", arc = "church", step = 5 }, { kind = "arc_wait", arc = "church", days = 1 }]
[[event.options]]
label = "Tell her everything"
req = [{ kind = "arc_branch", arc = "church", branch = "informer" }]
needs = "you told her about the Opened"
[[event.options.outcomes]]
weight = 100
text = "Quill listens, nods, and pays 800 'for the Church's gratitude, which will be in the ledger and not on the floor'."
effects = [{ kind = "credits", amount = 800 }, { kind = "standing", faction = "church", amount = 4 }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Tell her nothing"
req = [{ kind = "arc_branch", arc = "church", branch = "heresy" }]
needs = "you carried the Opened"
[[event.options.outcomes]]
weight = 60
text = "Quill's eyes are the colour of old brass. 'Nothing,' she says, and writes it down. She does not forgive; she does not forget."
effects = [{ kind = "standing", faction = "church", amount = -4 }, { kind = "arc_step", arc = "church" }]
[[event.options.outcomes]]
weight = 40
text = "She knew. She says so quietly. 'We will talk when the Reach decides.'"
effects = [{ kind = "standing", faction = "church", amount = -6 }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Remind her you sat the vigil"
req = [{ kind = "arc_branch", arc = "church", branch = "vigil" }]
needs = "you sat the vigil"
[[event.options.outcomes]]
weight = 100
text = "'I remember,' she says. 'I counted.' Her smile is a small, rare one, and she has the almoner leave 300 credits in your cabin."
effects = [{ kind = "credits", amount = 300 }, { kind = "standing", faction = "church", amount = 4 }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Ask her to trust you"
req = [{ kind = "standing", faction = "church", min = 20 }]
needs = "standing 20 with the Church"
[[event.options.outcomes]]
weight = 100
text = "She considers you for a long time. 'Trust is a candle,' she says. 'Hold it.' She gives you her signet to hold, which is not a gift."
effects = [{ kind = "standing", faction = "church", amount = 3 }, { kind = "xp", skill = "stealth", amount = 20 }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Say what you think of the Opened"
[[event.options.outcomes]]
weight = 100
text = "You tell her what you think. It is honest, which is more than most people give her."
effects = [{ kind = "standing", faction = "church", amount = 1 }, { kind = "arc_step", arc = "church" }]

[[event]]
id = "church_6_wardens"
family = "arc"
title = "The wardens wake"
text = "Gate wardens are slow, enormous, patient drones that sleep in the dark until a gate is threatened. One wakes. Its sensors turn to your ship the way a head turns in a quiet room. The vigil goes silent. Everyone is looking at you."
weight = 2000
arc = "church"
step = 6
when = [{ kind = "arc_at", arc = "church", step = 6 }, { kind = "arc_wait", arc = "church", days = 1 }]
[[event.options]]
label = "Stand your ground and fight"
req = [{ kind = "weapons", min = 3 }]
needs = "weapons of power 3"
[[event.options.outcomes]]
weight = 100
text = "Nobody has fought a warden in a lifetime. You do it with the whole vigil watching."
effects = [{ kind = "standing", faction = "church", amount = -3 }, { kind = "combat", enemy = "gate_warden" }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Sing the old response"
req = [{ kind = "arc_branch", arc = "church", branch = "vigil" }]
needs = "you sat the vigil"
[[event.options.outcomes]]
weight = 100
text = "You remember a phrase from the night, a syllable more breath than word. The warden dims. 'Rest,' says a pilgrim behind you, weeping."
effects = [{ kind = "standing", faction = "church", amount = 6 }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Ride it out under dead power"
req = [{ kind = "role", role = "engineer", min = 2 }]
needs = "an engineer of skill 2 or better"
[[event.options.outcomes]]
weight = 65
text = "Your engineer kills everything but the heartbeat. The warden pauses, cycles through the lane, and sleeps."
effects = [{ kind = "wear", amount = 30 }, { kind = "arc_step", arc = "church" }]
[[event.options.outcomes]]
weight = 35
text = "The warden brushes you with a spar. You live."
effects = [{ kind = "hull", amount = -18 }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Offer the gate-key"
req = [{ kind = "arc_branch", arc = "church", branch = "key" }]
needs = "you hold the gate-key"
[[event.options.outcomes]]
weight = 100
text = "The warden takes the ring's frequency like a name. It does not sleep; it watches, and the watching is patient."
effects = [{ kind = "standing", faction = "church", amount = -2 }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Run"
[[event.options.outcomes]]
weight = 70
text = "You burn out of the Reach. The warden does not follow, but its sensors remember."
effects = [{ kind = "fuel", amount = -10 }, { kind = "standing", faction = "church", amount = -2 }, { kind = "arc_step", arc = "church" }]
[[event.options.outcomes]]
weight = 30
text = "It lands one blow before you clear the Reach."
effects = [{ kind = "hull", amount = -15 }, { kind = "fuel", amount = -10 }, { kind = "arc_step", arc = "church" }]

[[event]]
id = "church_7_hum"
family = "arc"
title = "What the gate says"
text = "The vigil's last night. Quill has asked for silence; Wren has asked for a minute of it. The gate's hum has changed. It was a drone; it is a phrase now, repeating every four minutes, and everyone aboard every ship in the Reach has gone very still."
weight = 2000
arc = "church"
step = 7
when = [{ kind = "arc_at", arc = "church", step = 7 }, { kind = "arc_wait", arc = "church", days = 2 }]
[[event.options]]
label = "Listen with instruments"
req = [{ kind = "role", role = "scientist", min = 2 }]
needs = "a scientist of skill 2 or better"
[[event.options.outcomes]]
weight = 100
text = "Your scientist sets up the lattice. The phrase is not a code but an address: the gate is listening for a particular other gate. It is not dead and not asleep. It is waiting for an answer."
effects = [{ kind = "survey", value = 700 }, { kind = "arc_branch", arc = "church", branch = "heard" }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Listen with your own ears"
req = [{ kind = "skill", skill = "survey", min = 2 }]
needs = "Surveying 2"
[[event.options.outcomes]]
weight = 80
text = "You sit in the dark, and the phrase resolves. The gate is not asleep. It is waiting for a reply."
effects = [{ kind = "xp", skill = "survey", amount = 50 }, { kind = "arc_branch", arc = "church", branch = "heard" }, { kind = "arc_step", arc = "church" }]
[[event.options.outcomes]]
weight = 20
text = "You hear only the hum, and a headache that lasts till dawn."
effects = [{ kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Record it for the Guild"
req = [{ kind = "scanner", min = 1 }]
needs = "a working scanner"
[[event.options.outcomes]]
weight = 100
text = "A clean recording, a paid recording. The Church does not like being recorded."
effects = [{ kind = "survey", value = 500 }, { kind = "standing", faction = "guild", amount = 3 }, { kind = "standing", faction = "church", amount = -3 }, { kind = "arc_step", arc = "church" }]
[[event.options]]
label = "Close your ears and keep watch"
[[event.options.outcomes]]
weight = 100
text = "Someone has to watch the sky while the rest listen. The night passes, long and without incident."
effects = [{ kind = "standing", faction = "church", amount = 2 }, { kind = "arc_step", arc = "church" }]

[[event]]
id = "church_8_rite"
family = "arc"
title = "The last candle"
text = "Quill lifts the last candle. If it goes out, the vigil ends, the wardens sleep, and the gate stays closed another generation. Wren stands at the edge of the ring with six pilgrims and a plea. Everyone looks at the ship that carried the news, the key or the silence. They look at you."
weight = 2000
arc = "church"
step = 8
when = [{ kind = "arc_at", arc = "church", step = 8 }]
[[event.options]]
label = "Stand with Mother Quill and the candle"
req = [{ kind = "not", req = { kind = "arc_branch", arc = "church", branch = "heresy" } }]
needs = "you did not carry the Opened"
[[event.options.outcomes]]
weight = 100
text = "The candle burns down in your hands, and nobody says a word. The Reach stays dark, the wardens sleep, and the Church counts a gate as kept."
effects = [{ kind = "standing", faction = "church", amount = 10 }, { kind = "credits", amount = 1000 }, { kind = "ending", arc = "church", ending = "kept" }]
[[event.options]]
label = "Give Wren the key"
req = [{ kind = "arc_branch", arc = "church", branch = "key" }]
needs = "you hold the gate-key"
[[event.options.outcomes]]
weight = 60
text = "He takes the ring in both hands, and the gate wakes, and for one long second every lamp in the Reach goes out."
effects = [{ kind = "credits", amount = 2000 }, { kind = "standing", faction = "church", amount = -15 }, { kind = "hull", amount = -20 }, { kind = "ending", arc = "church", ending = "opened" }]
[[event.options.outcomes]]
weight = 40
text = "The ring warms and nothing happens, for a long, awful minute. Then it does."
effects = [{ kind = "credits", amount = 2000 }, { kind = "standing", faction = "church", amount = -15 }, { kind = "hull", amount = -10 }, { kind = "ending", arc = "church", ending = "opened" }]
[[event.options]]
label = "Answer the gate"
req = [{ kind = "arc_branch", arc = "church", branch = "heard" }, { kind = "arc_branch", arc = "church", branch = "vigil" }, { kind = "arc_branch", arc = "church", branch = "key" }]
needs = "you heard it, sat the vigil, hold the key"
[[event.options.outcomes]]
weight = 100
text = "You sing the phrase back, the way the vigil taught you, and put the ring against the old coil. The gate answers once: a note, then a silence that feels like permission."
effects = [{ kind = "credits", amount = 2500 }, { kind = "survey", value = 1000 }, { kind = "standing", faction = "church", amount = 8 }, { kind = "ending", arc = "church", ending = "answered" }]
[[event.options]]
label = "Walk away from the ring"
