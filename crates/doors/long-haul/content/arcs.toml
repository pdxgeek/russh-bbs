[[event]]
id = "league_6_inquiry"
family = "arc"
title = "The Court of Inquiry"
text = "The League convenes a court of inquiry at the picket yard. The schedules were sold, and someone must answer. The court has called you because you were on the beat, at the blockade and at Ochre, and because auxiliaries are easy to blame."
weight = 2000
arc = "league"
step = 6
when = [{ kind = "arc_at", arc = "league", step = 6 }, { kind = "arc_wait", arc = "league", days = 1 }, { kind = "economy", economy = "military" }]

[[event.options]]
label = "Lay the evidence before the court"
req = [{ kind = "arc_branch", arc = "league", branch = "evidence" }]
needs = "the cadet's pages or the aide's relay"
[[event.options.outcomes]]
weight = 75
text = "The court reads the pages, matches the relay, and sits very quiet. The aide is taken away within the hour. The commodore, who did not know, is told that she should have."
effects = [{ kind = "standing", faction = "league", amount = 10 }, { kind = "credits", amount = 800 }, { kind = "arc_step", arc = "league" }]
[[event.options.outcomes]]
weight = 25
text = "The court calls the evidence incomplete. The aide's friends make a note of your name."
effects = [{ kind = "standing", faction = "league", amount = -4 }, { kind = "arc_step", arc = "league" }]

[[event.options]]
label = "Testify for the commodore"
req = [{ kind = "arc_branch", arc = "league", branch = "oath" }]
needs = "the League oath"
[[event.options.outcomes]]
weight = 100
text = "You say what you saw: the commodore was always at her post. It is true, and it is exactly what the court wanted to hear."
effects = [{ kind = "standing", faction = "league", amount = 6 }, { kind = "credits", amount = 300 }, { kind = "arc_step", arc = "league" }]

[[event.options]]
label = "Confess to taking a toll"
req = [{ kind = "arc_branch", arc = "league", branch = "bribed" }]
needs = "a toll you took on the beat"
[[event.options.outcomes]]
weight = 70
text = "It is easier than it should be. The court fines you and marks your file. Not hanged, not praised, merely written down."
effects = [{ kind = "credits", amount = -800 }, { kind = "standing", faction = "league", amount = -8 }, { kind = "arc_step", arc = "league" }]
[[event.options.outcomes]]
weight = 30
text = "The court cannot spare an example, and you are the example. Fined, held for the better part of a week, and let go with a sentence that sounds like a promise."
effects = [{ kind = "credits", amount = -1500 }, { kind = "days", amount = 3 }, { kind = "standing", faction = "league", amount = -14 }, { kind = "arc_step", arc = "league" }]

[[event.options]]
label = "Argue the line must be held"
req = [{ kind = "arc_branch", arc = "league", branch = "strict" }]
needs = "a hard line held on the beat"
[[event.options.outcomes]]
weight = 100
text = "You tell the court the line was held because someone held it. Three officers nod. The fourth writes something down, and you are not sure it is good."
effects = [{ kind = "standing", faction = "league", amount = 5 }, { kind = "credits", amount = 400 }, { kind = "standing", faction = "miners", amount = -4 }, { kind = "arc_step", arc = "league" }]

[[event.options]]
label = "Say nothing useful"
[[event.options.outcomes]]
weight = 100
text = "You answer every question with a sentence of exactly the right length. The court lets you go with a nod and a pen-mark."
effects = [{ kind = "standing", faction = "league", amount = -1 }, { kind = "arc_step", arc = "league" }]

