[[event]]
id = "league_5_haven"
family = "arc"
title = "Orders for Port Ochre"
text = "The line wants the haven at Ochre closed: crews, black market and a few honest people who live above them. The order is a landing, a week of fighting. You have been asked to lead the screen. You have also noticed the haven has been ready for days."
weight = 2000
arc = "league"
step = 5
when = [{ kind = "arc_at", arc = "league", step = 5 }, { kind = "arc_wait", arc = "league", days = 1 }, { kind = "economy", economy = "haven" }]

[[event.options]]
label = "Lead the screen, as ordered"
req = [{ kind = "weapons", min = 3 }]
needs = "weapons power 3 or better"
[[event.options.outcomes]]
weight = 55
text = "The haven's raiders come out to meet you in good order. It is a fair fight, which is the best thing you can say about it."
effects = [{ kind = "standing", faction = "league", amount = 6 }, { kind = "standing", faction = "free", amount = -8 }, { kind = "arc_branch", arc = "league", branch = "strict" }, { kind = "combat", enemy = "raider" }, { kind = "arc_step", arc = "league" }]
[[event.options.outcomes]]
weight = 45
text = "The haven has been busy: a corsair meets you at the lane with a boarding crew in the lock."
effects = [{ kind = "standing", faction = "league", amount = 6 }, { kind = "standing", faction = "free", amount = -8 }, { kind = "arc_branch", arc = "league", branch = "strict" }, { kind = "combat", enemy = "corsair" }, { kind = "arc_step", arc = "league" }]

[[event.options]]
label = "Send a warning to the haven"
req = [{ kind = "not", req = { kind = "arc_branch", arc = "league", branch = "oath" } }]
needs = "you have not sworn the League oath"
[[event.options.outcomes]]
weight = 100
text = "A short message on a band the haven's relay catches: 'Tuesday, dawn.' When the marines land there is nobody to fight. You are not thanked, which suits everyone."
effects = [{ kind = "standing", faction = "free", amount = 6 }, { kind = "standing", faction = "league", amount = -8 }, { kind = "arc_branch", arc = "league", branch = "warned" }, { kind = "arc_step", arc = "league" }]

[[event.options]]
label = "Fault the cutter's coil in a quiet way"
req = [{ kind = "role", role = "engineer", min = 2 }]
needs = "an engineer of skill 2 or better"
[[event.options.outcomes]]
weight = 70
text = "Your engineer introduces a fault in a coil nobody else knows how to find. The landing goes in a day late, and the haven is empty."
effects = [{ kind = "standing", faction = "league", amount = -3 }, { kind = "standing", faction = "free", amount = 3 }, { kind = "arc_branch", arc = "league", branch = "warned" }, { kind = "arc_step", arc = "league" }]
[[event.options.outcomes]]
weight = 30
text = "The fault is traced to your engineer's bench. Varga wants a word. She decides to like you anyway, and bills you for the coil."
effects = [{ kind = "credits", amount = -300 }, { kind = "standing", faction = "league", amount = -6 }, { kind = "arc_step", arc = "league" }]

[[event.options]]
label = "Refuse the order"
[[event.options.outcomes]]
weight = 100
text = "'On whose authority?' 'Mine.' The commodore looks at you for a long time and appoints a man who will do it. The haven burns in a quiet way."
effects = [{ kind = "standing", faction = "league", amount = -6 }, { kind = "arc_branch", arc = "league", branch = "mercy" }, { kind = "arc_step", arc = "league" }]

