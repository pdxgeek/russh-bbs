text = "When you come back into range, everyone has arrived. A League gunboat sits in the lane. A Union enforcer idles behind it. Free hulls loiter at the edge of the scope, and a Guild survey ship runs its lamps in a ring. The wardens say nothing. Somebody will do something. It had better not be all of them."
weight = 2000
arc = "gates"
step = 9
