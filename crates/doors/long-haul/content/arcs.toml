effects = [{ kind = "days", amount = 2 }, { kind = "standing", faction = "league", amount = -3 }, { kind = "arc_step", arc = "league" }]

[[event.options]]
label = "Run the cordon with the refinery's cargo"
req = [{ kind = "role", role = "pilot", min = 2 }]
needs = "a pilot of skill 2 or better"
[[event.options.outcomes]]
weight = 70
text = "Your pilot threads between the tugs with a metre to spare on each side. The refinery gets its feed, and the Union gets a story."
effects = [{ kind = "standing", faction = "league", amount = 4 }, { kind = "standing", faction = "miners", amount = -5 }, { kind = "xp", skill = "pilot", amount = 6 }, { kind = "arc_step", arc = "league" }]
[[event.options.outcomes]]
weight = 30
text = "A tug's cable rakes your hull as you pass. The refinery still gets its feed."
effects = [{ kind = "hull", amount = -15 }, { kind = "standing", faction = "league", amount = 2 }, { kind = "standing", faction = "miners", amount = -5 }, { kind = "arc_step", arc = "league" }]

