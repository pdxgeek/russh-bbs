[[event]]
id = "league_4_cadet"
family = "arc"
title = "A Cadet With Pages"
text = "A frightened cadet catches you in the mess. Someone in the commodore's office, she whispers, has been selling picket schedules to the Free Captains for months. She has a copy of the pages. She does not trust anyone with a braid."
weight = 2000
arc = "league"
step = 4
when = [{ kind = "arc_at", arc = "league", step = 4 }, { kind = "arc_wait", arc = "league", days = 2 }]

[[event.options]]
label = "Take the pages to safe keeping"
req = [{ kind = "not", req = { kind = "arc_branch", arc = "league", branch = "bribed" } }]
needs = "you have not taken a toll on the beat"
[[event.options.outcomes]]
weight = 100
text = "You copy them and hide the copy where a League man would not look: inside a cheap sensor housing. The cadet breathes out for the first time in a week."
effects = [{ kind = "xp", skill = "stealth", amount = 6 }, { kind = "arc_branch", arc = "league", branch = "evidence" }, { kind = "arc_step", arc = "league" }]

[[event.options]]
label = "Trace the leak with a sweep"
req = [{ kind = "scanner", min = 2 }]
needs = "a scanner of grade 2 or better"
[[event.options.outcomes]]
weight = 65
text = "The sweep finds a relay in the aide's own quarters, tuned to a Free band. You log the frequency and the hour of every burst."
effects = [{ kind = "xp", skill = "survey", amount = 6 }, { kind = "arc_branch", arc = "league", branch = "evidence" }, { kind = "arc_step", arc = "league" }]
[[event.options.outcomes]]
weight = 35
text = "The sweep trips an alarm. Nobody says anything about it, which is worse."
effects = [{ kind = "standing", faction = "league", amount = -4 }, { kind = "arc_step", arc = "league" }]

[[event.options]]
label = "Ask the cadet to burn the pages"
req = [{ kind = "arc_branch", arc = "league", branch = "bribed" }]
needs = "a toll you would rather stay quiet about"
[[event.options.outcomes]]
weight = 100
text = "She stares at you, then burns them in the sink, one page at a time. Her eyes follow you out of the mess. You are not sure which of you was saved."
effects = [{ kind = "standing", faction = "league", amount = -2 }, { kind = "scare", amount = 1 }, { kind = "arc_step", arc = "league" }]

[[event.options]]
label = "Tell the commodore at once"
[[event.options.outcomes]]
weight = 100
text = "Varga listens with her hands flat on the desk. 'Leave it with me,' she says. Nothing happens, and the cadet looks at you as though you had sold her."
effects = [{ kind = "standing", faction = "league", amount = 2 }, { kind = "arc_step", arc = "league" }]

