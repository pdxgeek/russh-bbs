# The thirty trade goods. `base` is the price in credits of one ton at a balanced market;
# `depth` is how many tons a size-1 station keeps in stock at balance (dear goods have thin
# markets); `volatility` is the nightly random wobble in per-mille of the market's depth.
# Contraband sells only through black markets and is seized in an inspection.

