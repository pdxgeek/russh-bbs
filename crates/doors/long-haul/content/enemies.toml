# Enemy ships. Speed is 1 to 6. `reach` is the band its guns like. `style` sets how it moves.
# `feint_pm` is the chance per-mille its telegraphed intent lies, before the captain's scanner
# and pilot take it down. `kill_standing` is what wrecking it costs with its own faction (the
# faction's rival is pleased a third as much). A `wreck` names a layout that can be boarded.

[[enemy]]
id = "skiff"
name = "Pirate skiff"
faction = "free"
blurb = "A stripped hull and two bored gunners."
hull = 22
shield = 0
speed = 4
accuracy = 55
damage = 6
reach = "close"
style = "rusher"
feint_pm = 100
boarders = 2
flee_pct = 30
loot = [80, 260]
kill_standing = -4
wreck = "pirate_wreck"

