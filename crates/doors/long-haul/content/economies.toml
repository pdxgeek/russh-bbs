# The six station economies. A station produces (cheap, stocked) and needs (dear, short) the
# goods named here and trades a few others at a balanced price. `law_pm` is the chance in
# per-mille that a dock inspects a ship carrying contraband. `weight` is how common the
# economy is. `fuel_pm` scales the fuel price.

[[economy]]
id = "mining"
name = "Mining station"
letter = "M"
faction = "miners"
law_pm = 150
fuel_pm = 900
weight = 22
produces = ["ore", "rare_earths", "volatiles", "water"]
needs = ["grain", "vat_protein", "parts", "medicine", "tools", "coils", "textiles", "antitoxin", "reactor_rods"]

