# The social layer's data: convoy names and night events, the quick notes a convoy can post
# without typing, outpost name endings, and the lines piracy prints. Convoy events are addressed
# by index in the world (append only). `hull` is the hull percent every member loses with no
# guard; guard (the convoy's combined firepower) cuts it. `pool` is credits added to (or taken
# from, if negative) the convoy pool.

outpost_suffix = ["Landing", "Rest", "Hold", "Reach", "Yard", "Anchorage", "Haven-Light", "Wharf"]
convoy_adjective = ["Slow", "Patient", "Long", "Grey", "Stubborn", "Quiet", "Lucky", "Borrowed"]
convoy_noun = ["Kettle", "Wake", "String", "Caravan", "Ledger", "Lantern", "Tow", "Chorus"]

notes = [
  "Holding at the last dock. Catch up when you can.",
  "Fuel is short ahead. Top up before the long lane.",
  "Clean run so far. Nothing on the scope.",
  "Raiders working the lane. Keep your guns warm.",
  "Found a good price. Check the market before you sell.",
  "Moving out at first light. Fly safe.",
  "Need a hand with repairs when you reach port.",
  "The loan shark is circling. Keep a little back.",
]

