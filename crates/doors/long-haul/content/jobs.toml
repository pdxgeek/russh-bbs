# Passenger kinds and the words clients use when they post a job. Passenger kinds are named by
# id in the transit events (a pilgrim hears things a fugitive does not). Every faction-and-kind
# pair a faction can post needs at least one line.

[[passenger]]
id = "pilgrim"
name = "Quiet Church pilgrims"
faction = "church"
count = [2, 4]
blurb = "Grey robes, little baggage, and a firm belief that the gates will open."

[[passenger]]
id = "scholar"
name = "Guild scholar"
faction = "guild"
count = [1, 2]
blurb = "Carries more instruments than clothes, and corrects the charts aloud."

[[passenger]]
id = "fugitive"
name = "Fugitive"
faction = "free"
count = [1, 2]
blurb = "Pays in advance, sits facing the door, and does not give a name."

[[passenger]]
id = "deserter"
name = "Navy deserter"
faction = "free"
count = [1, 1]
blurb = "Still in the boots. Flinches at the sound of a docking clamp."

[[passenger]]
id = "miner_family"
name = "Miners' families"
faction = "miners"
count = [2, 4]
blurb = "Moving claim to claim with everything they own in three crates."

[[passenger]]
id = "officer"
name = "League officer"
faction = "league"
count = [1, 2]
blurb = "Polite, observant, and writing in a small book you cannot read."

[[passenger]]
id = "refugee"
name = "Refugees"
faction = "league"
count = [2, 5]
blurb = "From a station that lost its air plant. They do not want to talk about it."

