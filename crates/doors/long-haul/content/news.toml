# News events. An event starts at one station, changes the target stock of the listed goods
# (`target_pm` is per-mille of the usual target: low means a shortage and a dear price, high
# means a glut and a cheap one), reaches `radius` hops with a falling effect, and lasts
# `duration` nights. News travels one hop a night, so a captain far away learns of it late.
# `origin` limits where it can start; `only` limits which stations an effect touches.

[[event]]
id = "plague"
kind = "Plague"
headline = "Fever ward overflowing at {station}; medicine is running out."
origin = []
radius = 2
duration = 6
weight = 3
inspection_pm = 0
effects = [
  { good = "medicine", target_pm = 250, only = [] },
  { good = "antitoxin", target_pm = 300, only = [] },
]

