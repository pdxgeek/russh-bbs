[[event]]
id = "gravity_wake_b"
family = "hazard"
title = "The wake of something huge"
text = "The ship starts to lean. Nothing is there, but the scope shows a long smear of disturbed dust: the wake of a very large hull that passed an hour ago and is not on any chart."
weight = 4

[[event.options]]
label = "Surf the wake"
req = [{ kind = "role", role = "pilot", min = 2 }]
needs = "a pilot of skill 2 or better"
[[event.options.outcomes]]
weight = 70
text = "Your pilot rides the wake like a tide and the ship gets a free push down the lane. The fuel gauge is smug about it."
effects = [{ kind = "fuel", amount = 7 }, { kind = "xp", skill = "pilot", amount = 6 }]
[[event.options.outcomes]]
weight = 30
text = "The wake turns on you and shakes the ship hard."
effects = [{ kind = "hull", amount = -7 }, { kind = "wear", amount = 40 }]

[[event.options]]
label = "Take readings of the wake"
req = [{ kind = "role", role = "scientist", min = 2 }]
needs = "a scientist of skill 2 or better"
[[event.options.outcomes]]
weight = 100
text = "Your scientist logs the dust pattern and works back to a mass. Nobody will believe the number, but the Guild will pay for it."
effects = [{ kind = "survey", value = 320 }, { kind = "xp", skill = "survey", amount = 5 }]

[[event.options]]
label = "Brace and hold course"
[[event.options.outcomes]]
weight = 100
text = "The ship groans and holds. The wake drops away behind you."
effects = [{ kind = "wear", amount = 30 }]

# ----

[[event]]
id = "fouled_coolant_b"
family = "hazard"
title = "Fouled coolant"
text = "The coolant loop starts to smell like warm pennies. Somewhere in the lines, a seal has gone and the ship is sweating a thin green film across the engine deck."
weight = 6
mods = [{ req = { kind = "hazard", hazard = "radiation" }, pm = 1500 }]

[[event.options]]
label = "Trace the leak and re-seal it"
req = [{ kind = "role", role = "engineer", min = 2 }]
needs = "an engineer of skill 2 or better"
[[event.options.outcomes]]
weight = 85
text = "Your engineer finds the seal in twenty minutes and rebuilds it with a gasket from a spare boot. Hot, filthy, finished."
effects = [{ kind = "wear", amount = 10 }, { kind = "xp", skill = "engineer", amount = 5 }]
[[event.options.outcomes]]
weight = 15
text = "The seal is not the only thing that has gone."
effects = [{ kind = "wear", amount = 60 }, { kind = "days", amount = 1 }]

[[event.options]]
label = "Have the medic tend the fumes"
req = [{ kind = "role", role = "medic", min = 1 }]
needs = "a medic aboard"
[[event.options.outcomes]]
weight = 100
text = "Your medic hands out masks and watches faces. Nobody is sick; the crew is grateful, and the seal gets fixed by morning."
effects = [{ kind = "wear", amount = 40 }, { kind = "treat", amount = 1 }]

[[event.options]]
label = "Top up and push on"
[[event.options.outcomes]]
weight = 55
text = "You top up the loop and push on. It holds."
effects = [{ kind = "fuel", amount = -2 }, { kind = "wear", amount = 50 }]
[[event.options.outcomes]]
weight = 45
text = "It does not hold. A long wait while the drive cools."
effects = [{ kind = "days", amount = 2 }, { kind = "wear", amount = 90 }, { kind = "hurt", who = "random", days = 2 }]

# ----

[[event]]
id = "gate_scar_b"
family = "hazard"
title = "A gate scar"
text = "The lane bends round a ring of black glass, the burnt ghost of a gate that failed in the old days. The instruments report that space here is not quite the shape it should be."
weight = 4
mods = [{ req = { kind = "hazard", hazard = "radiation" }, pm = 1800 }]

[[event.options]]
label = "Sing the gate song across it"
req = [{ kind = "flag", name = "gate_song" }]
needs = "the gate song, learned from pilgrims"
[[event.options.outcomes]]
weight = 100
text = "The song carries on a carrier wave and the scar goes quiet, like a dog that knows you. Pilgrims would call it grace; the scope calls it a clean, calm lane."
effects = [{ kind = "flag", name = "wardens_truce" }, { kind = "standing", faction = "church", amount = 3 }, { kind = "xp", skill = "survey", amount = 6 }]

[[event.options]]
label = "Survey the ring"
req = [{ kind = "role", role = "scientist", min = 2 }]
needs = "a scientist of skill 2 or better"
[[event.options.outcomes]]
weight = 75
text = "Your scientist samples the glass and the shear in it. Valuable data, for those who dare read it."
effects = [{ kind = "survey", value = 400 }, { kind = "xp", skill = "survey", amount = 6 }]
[[event.options.outcomes]]
weight = 25
text = "The ring shivers and the instruments scramble. Half your data is noise."
effects = [{ kind = "survey", value = 120 }, { kind = "wear", amount = 50 }]

[[event.options]]
label = "Go wide around it"
[[event.options.outcomes]]
weight = 100
text = "A long, nervous detour round the scar. Nobody speaks until it is behind."
effects = [{ kind = "fuel", amount = -5 }, { kind = "days", amount = 1 }, { kind = "scare", amount = 1 }]

# ----

[[event]]
id = "sleeper_comet_b"
family = "hazard"
title = "A sleeper comet"
text = "A comet the size of a hab block lies ahead of the lane, tail asleep, ice glittering. Too big to ignore, too slow to avoid, and carrying more water than your whole tank."
weight = 5
mods = [{ req = { kind = "hazard", hazard = "debris" }, pm = 1600 }]

[[event.options]]
label = "Shave ice with the engineer's rig"
req = [{ kind = "role", role = "engineer", min = 2 }]
needs = "an engineer of skill 2 or better"
[[event.options.outcomes]]
weight = 80
text = "Your engineer rigs a cutter off the hull and shaves a few tons of clean ice. The ship smells like a cold lake for a day."
effects = [{ kind = "cargo", good = "water", tons = 5 }, { kind = "xp", skill = "engineer", amount = 5 }]
[[event.options.outcomes]]
weight = 20
text = "The ice cracks and a shard comes back at the hull."
effects = [{ kind = "cargo", good = "water", tons = 2 }, { kind = "hull", amount = -6 }]

[[event.options]]
label = "Skim it at speed"
[[event.options.outcomes]]
weight = 60
text = "A fast pass with the scoop out. A little water, a lot of rattling."
effects = [{ kind = "cargo", good = "water", tons = 2 }, { kind = "wear", amount = 30 }]
[[event.options.outcomes]]
weight = 40
text = "The tail wakes as you pass. Shards on the plates."
effects = [{ kind = "hull", amount = -8 }, { kind = "wear", amount = 40 }]

[[event.options]]
label = "Steer wide"
[[event.options.outcomes]]
weight = 100
text = "A long, clean arc round the comet. Fuel burnt, hull whole."
effects = [{ kind = "fuel", amount = -4 }]

# ----

[[event]]
id = "refugee_rations_b"
family = "passenger"
title = "The refugees are hungry"
text = "Your refugees have been quiet for days. Then the youngest asks the cook, politely, whether it is true that crew eat first. The galley goes silent."
weight = 12
when = [{ kind = "passenger", pax = "refugee" }]

[[event.options]]
label = "Cut the crew's own share"
[[event.options.outcomes]]
weight = 100
text = "You eat thin for three days. The crew grumbles, and the refugees do not forget it."
effects = [{ kind = "content", amount = 3 }, { kind = "treat", amount = -1 }]

[[event.options]]
label = "Let the quartermaster rework the stores"
req = [{ kind = "role", role = "quartermaster", min = 2 }]
needs = "a quartermaster of skill 2 or better"
[[event.options.outcomes]]
weight = 90
text = "Your quartermaster finds the slack in the manifest: a few tins nobody had counted and a sack of grain behind a panel. Everyone eats."
effects = [{ kind = "content", amount = 3 }, { kind = "treat", amount = 1 }, { kind = "xp", skill = "stealth", amount = 4 }]
[[event.options.outcomes]]
weight = 10
text = "The stores turn out thinner than the logs. A lean week."
effects = [{ kind = "content", amount = 1 }]

[[event.options]]
label = "Buy them a proper meal (120 cr)"
req = [{ kind = "cash", min = 120 }]
needs = "120 cr in the purse"
[[event.options.outcomes]]
weight = 100
text = "A good stew from the next dock's last stock. Nobody asks where the money came from."
effects = [{ kind = "credits", amount = -120 }, { kind = "content", amount = 4 }]

[[event.options]]
label = "Tell them to wait"
[[event.options.outcomes]]
weight = 100
text = "They wait. They keep a careful eye on the galley door."
effects = [{ kind = "content", amount = -3 }]

# ----

[[event]]
id = "officer_requisition_b"
family = "passenger"
title = "The officer pulls rank"
text = "Your League officer has decided that your ship would be better employed on the navy's business. They have not said so; they have put a hand on the bulkhead and looked thoughtful."
weight = 12
when = [{ kind = "passenger", pax = "officer" }]

[[event.options]]
label = "Say yes, and expect a favour"
[[event.options.outcomes]]
weight = 100
text = "A day of ferrying signals for the navy. The officer signs a chit and gives you a name to remember."
effects = [{ kind = "days", amount = 1 }, { kind = "standing", faction = "league", amount = 4 }, { kind = "flag", name = "navy_favor" }, { kind = "content", amount = 1 }]

[[event.options]]
label = "Talk them out of it"
req = [{ kind = "role", role = "face", min = 2 }]
needs = "a face of skill 2 or better"
[[event.options.outcomes]]
weight = 85
text = "Your face has the officer laughing about the cargo contract in less than a minute. The matter is not raised again."
effects = [{ kind = "content", amount = 1 }, { kind = "xp", skill = "trade", amount = 4 }]
[[event.options.outcomes]]
weight = 15
text = "The officer notices the polish in your voice and mentions it to a friend."
effects = [{ kind = "standing", faction = "league", amount = -2 }]

[[event.options]]
label = "Refuse flatly"
[[event.options.outcomes]]
weight = 100
text = "The officer's smile is a thin line. You have made a note in someone's ledger, and it is yours."
effects = [{ kind = "content", amount = -3 }, { kind = "standing", faction = "league", amount = -3 }, { kind = "flag", name = "league_snub" }]

# ----

[[event]]
id = "miner_child_fever_b"
family = "passenger"
title = "A child with a fever"
text = "The miner family's youngest is burning up, and the parents are trying hard not to ask you for anything. Ship's air, ship's food and a fever that is not on any manifest."
weight = 12
when = [{ kind = "passenger", pax = "miner_family" }]

[[event.options]]
label = "Put the medic on it"
req = [{ kind = "role", role = "medic", min = 2 }]
needs = "a medic of skill 2 or better"
[[event.options.outcomes]]
weight = 90
text = "Your medic sits up two nights and brings the fever down. The parents write your hull number on the inside of their lunch box."
effects = [{ kind = "content", amount = 4 }, { kind = "standing", faction = "miners", amount = 3 }, { kind = "xp", skill = "engineer", amount = 1 }]
[[event.options.outcomes]]
weight = 10
text = "A rough two nights, and a touch-and-go dawn. The child pulls through."
effects = [{ kind = "content", amount = 2 }, { kind = "standing", faction = "miners", amount = 2 }]

[[event.options]]
label = "Spend antitoxin on it"
req = [{ kind = "good", good = "antitoxin", tons = 1 }]
needs = "antitoxin in the hold"
[[event.options.outcomes]]
weight = 100
text = "The antitoxin does what it does. The fever breaks by morning."
effects = [{ kind = "cargo", good = "antitoxin", tons = -1 }, { kind = "content", amount = 3 }, { kind = "standing", faction = "miners", amount = 2 }]

[[event.options]]
label = "Keep the child away from the crew"
[[event.options.outcomes]]
weight = 60
text = "A quiet cabin, a lot of cold cloth. It breaks on its own, and the parents are only grateful that you did not shout."
effects = [{ kind = "content", amount = 1 }]
[[event.options.outcomes]]
weight = 40
text = "It does not break for days. The parents are sure you did all you could, and also sure it was not enough."
effects = [{ kind = "content", amount = -2 }, { kind = "standing", faction = "miners", amount = -2 }]

# ----

[[event]]
id = "deserter_picket_b"
family = "passenger"
title = "A picket asks for a man"
text = "A League picket slides alongside and hails you politely. They are looking for a deserter who answers, in all particulars, to the description of the man asleep in your spare berth."
weight = 10
when = [{ kind = "passenger", pax = "deserter" }]

[[event.options]]
label = "Hand him over"
[[event.options.outcomes]]
weight = 100
text = "He goes across without a word, and the picket pays a bounty that nobody mentions. Your crew will remember how you did it."
effects = [{ kind = "credits", amount = 300 }, { kind = "standing", faction = "league", amount = 5 }, { kind = "content", amount = -5 }, { kind = "treat", amount = -1 }]

[[event.options]]
label = "Bluff them"
req = [{ kind = "role", role = "face", min = 2 }]
needs = "a face of skill 2 or better"
[[event.options.outcomes]]
weight = 80
text = "Your face has the picket's officer explaining their own rank back to them. The picket wishes you good hunting, and moves on."
effects = [{ kind = "content", amount = 2 }, { kind = "standing", faction = "league", amount = -1 }, { kind = "xp", skill = "trade", amount = 5 }]
[[event.options.outcomes]]
weight = 20
text = "The officer sees through it and does not say so. You will hear about this at the next League dock."
effects = [{ kind = "standing", faction = "league", amount = -4 }]

[[event.options]]
label = "Fight your way off"
req = [{ kind = "role", role = "gunner", min = 2 }]
needs = "a gunner of skill 2 or better"
[[event.options.outcomes]]
weight = 100
text = "You cut the line and open fire. The picket answers."
effects = [{ kind = "combat", enemy = "picket" }, { kind = "content", amount = 2 }, { kind = "standing", faction = "league", amount = -5 }]

# ----

[[event]]
id = "fugitive_truth_b"
family = "passenger"
title = "The fugitive tells the truth"
text = "Your fugitive has been telling a story for days, and it has changed three times. Tonight, in the dark of the galley, they ask whether you would like to hear what is actually true."
weight = 10
when = [{ kind = "passenger", pax = "fugitive" }, { kind = "no_flag", name = "fugitive_pact" }]

[[event.options]]
label = "Hear them out"
[[event.options.outcomes]]
weight = 70
text = "It is a bad story and a human one. They owe a Free Captain a great deal, and cannot pay it. You say you will not hand them over, and mean it."
effects = [{ kind = "flag", name = "fugitive_pact" }, { kind = "content", amount = 4 }, { kind = "standing", faction = "free", amount = 3 }]
[[event.options.outcomes]]
weight = 30
text = "It is worse than you thought. You say nothing, and sleep badly."
effects = [{ kind = "flag", name = "fugitive_pact" }, { kind = "content", amount = 2 }, { kind = "scare", amount = 1 }]

[[event.options]]
label = "Have the face read the lies"
req = [{ kind = "role", role = "face", min = 2 }]
needs = "a face of skill 2 or better"
[[event.options.outcomes]]
weight = 100
text = "Your face lets the fugitive talk until they run out of lies. What is left is sad and plain, and gives you something to trade on later."
effects = [{ kind = "flag", name = "fugitive_pact" }, { kind = "content", amount = 3 }, { kind = "xp", skill = "trade", amount = 5 }, { kind = "standing", faction = "free", amount = 2 }]

[[event.options]]
label = "Do not listen"
[[event.options.outcomes]]
weight = 100
text = "You decline the truth. They look relieved, then ashamed."
effects = [{ kind = "content", amount = -1 }]

# ----

[[event]]
id = "scholar_archive_b"
family = "passenger"
title = "The scholar finds an archive"
text = "Your scholar hands you a plot and a trembling finger. A Guild archive hulk, they say, lost in the old gate wars with its stacks intact. If the plot is right, it is a day off the lane."
weight = 10
when = [{ kind = "passenger", pax = "scholar" }]

[[event.options]]
label = "Check the plot with the scientist"
req = [{ kind = "role", role = "scientist", min = 2 }]
needs = "a scientist of skill 2 or better"
[[event.options.outcomes]]
weight = 90
text = "The plot holds up. Your scientist and the scholar argue happily for an hour, and the archive's key frequency drops into your log."
effects = [{ kind = "flag", name = "archive_key" }, { kind = "content", amount = 3 }, { kind = "xp", skill = "survey", amount = 6 }, { kind = "survey", value = 180 }]
[[event.options.outcomes]]
weight = 10
text = "The plot is a day off, and the archive is a rumour. The scholar is crushed."
effects = [{ kind = "content", amount = -2 }, { kind = "days", amount = 1 }]

[[event.options]]
label = "Board the archive hulk"
[[event.options.outcomes]]
weight = 100
text = "A day's detour to a drifting stack-hulk. The scholar will not shut up, and the hulk is not empty."
effects = [{ kind = "days", amount = 1 }, { kind = "board", derelict = "guild_archive" }, { kind = "content", amount = 2 }]

[[event.options]]
label = "Decline politely"
[[event.options.outcomes]]
weight = 100
text = "The scholar nods. They put the plot away carefully, like a thing they will find again."
effects = [{ kind = "content", amount = -1 }]

# ----

[[event]]
id = "ghost_liner_b"
family = "derelict"
title = "A liner with every light on"
text = "A passenger liner drifts without engines, her windows burning in rows. Every deck is lit and not one hail is answered. The lights are the first thing wrong, and not the last."
weight = 4
mods = [{ req = { kind = "standing", faction = "church", min = 5 }, pm = 1400 }]

[[event.options]]
label = "Board the liner"
[[event.options.outcomes]]
weight = 100
text = "You dock at the lower hatch. The air is warm and the corridors are clean, which is worse than any wreck."
effects = [{ kind = "board", derelict = "ghost_liner" }, { kind = "scare", amount = 1 }]

[[event.options]]
label = "Scan the decks from range"
req = [{ kind = "scanner", min = 1 }]
needs = "a working scanner"
[[event.options.outcomes]]
weight = 100
text = "The scanner finds no heat, no air loss and no crew. It gets a clean read of a deck plan nobody has charted."
effects = [{ kind = "survey", value = 300 }, { kind = "xp", skill = "survey", amount = 5 }]

[[event.options]]
label = "Leave her lit"
[[event.options.outcomes]]
weight = 100
text = "You leave her lit. In the galley, the crew finds a lot to say about it."
effects = [{ kind = "scare", amount = 1 }]

# ----

[[event]]
id = "cargo_ghost_b"
family = "derelict"
title = "A hauler with a full hold"
text = "A bulk hauler sits dead in the lane, hatches shut and seals green. Her manifest is still broadcasting: sealed, insured and nobody's. Somebody ran from this ship, and left the goods."
weight = 6

[[event.options]]
label = "Board and strip her hold"
[[event.options.outcomes]]
weight = 100
text = "Her airlocks open on a hold of crated goods and one very angry loader bot."
effects = [{ kind = "board", derelict = "cargo_ghost" }]

[[event.options]]
label = "Read the manifest first"
req = [{ kind = "role", role = "quartermaster", min = 2 }]
needs = "a quartermaster of skill 2 or better"
[[event.options.outcomes]]
weight = 85
text = "Your quartermaster finds the hold's good crates in a minute, and the bad ones in two. You take only the clean tons without opening a seal."
effects = [{ kind = "cargo", good = "tools", tons = 3 }, { kind = "cargo", good = "textiles", tons = 3 }, { kind = "xp", skill = "stealth", amount = 5 }]
[[event.options.outcomes]]
weight = 15
text = "A false manifest. The crates are filled with ballast."
effects = [{ kind = "days", amount = 1 }]

[[event.options]]
label = "Leave her"
[[event.options.outcomes]]
weight = 100
text = "A full hold is a trap more often than a gift. You leave her to her broadcast."
effects = []

# ----

[[event]]
id = "medical_frigate_b"
family = "derelict"
title = "A hospital frigate, silent"
text = "A hospital frigate, her red cross faded to rust, tumbles end over end. The crew's last log reads 'we did all we could.' The ward bays may still hold stock."
weight = 5

[[event.options]]
label = "Send the medic across first"
req = [{ kind = "role", role = "medic", min = 2 }]
needs = "a medic of skill 2 or better"
[[event.options.outcomes]]
weight = 85
text = "Your medic goes through the wards one by one and comes back with a crate of medicine and a very quiet face."
effects = [{ kind = "cargo", good = "medicine", tons = 4 }, { kind = "cargo", good = "biogel", tons = 2 }, { kind = "standing", faction = "church", amount = 2 }]
[[event.options.outcomes]]
weight = 15
text = "Something in the wards was still working. Your medic is hurt coming back."
effects = [{ kind = "cargo", good = "medicine", tons = 2 }, { kind = "hurt", who = "medic", days = 3 }]

[[event.options]]
label = "Board her"
[[event.options.outcomes]]
weight = 100
text = "You cut the lock on the aft ward. The frigate's defences have not forgotten what they were for."
effects = [{ kind = "board", derelict = "medical_frigate" }]

[[event.options]]
label = "Send a prayer and move on"
[[event.options.outcomes]]
weight = 100
text = "A short, awkward silence, then the lane again."
effects = [{ kind = "treat", amount = 1 }]

# ----

[[event]]
id = "quarantine_cutter_b"
family = "derelict"
title = "A cutter flying the plague flag"
text = "A small cutter drifts with the yellow plague flag at her mast, the old kind, stitched by hand. Her beacon says the sickness is over. Her beacon is eighty years old."
weight = 4

[[event.options]]
label = "Go in with antitoxin"
req = [{ kind = "good", good = "antitoxin", tons = 1 }]
needs = "antitoxin in the hold"
[[event.options.outcomes]]
weight = 100
text = "You dose the boarding party and go in. The air is stale and old, and the ship's lockers are not empty."
effects = [{ kind = "cargo", good = "antitoxin", tons = -1 }, { kind = "board", derelict = "quarantine_cutter" }]

[[event.options]]
label = "Burn out the beacon"
req = [{ kind = "role", role = "gunner", min = 1 }]
needs = "a gunner aboard"
[[event.options.outcomes]]
weight = 100
text = "A single shot silences the old flag. The League's clerks hear of it, and approve."
effects = [{ kind = "standing", faction = "league", amount = 3 }, { kind = "standing", faction = "church", amount = -1 }]

[[event.options]]
label = "Keep your distance"
[[event.options.outcomes]]
weight = 100
text = "You keep your distance and log the position for the dock. Some plagues are better left to the old flag."
effects = [{ kind = "standing", faction = "league", amount = 1 }]

