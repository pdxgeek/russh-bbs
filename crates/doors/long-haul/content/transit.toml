[[event]]
id = "reliquary_b"
family = "derelict"
title = "A reliquary ship"
text = "A Church reliquary ship, her sail-arms folded, floats where no Church route runs. The gate sigil on her prow is clean. Whatever she carries, the Quiet Church would like it back."
weight = 4
when = [{ kind = "no_flag", name = "reliquary_vow" }]

[[event.options]]
label = "Ask leave of the Church and board"
