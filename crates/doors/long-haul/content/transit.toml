effects = [{ kind = "combat", enemy = "marauder" }, { kind = "standing", faction = "free", amount = -4 }]
[[event.options.outcomes]]
weight = 40
text = "A long standoff, and then a laugh. They mark you down as a captain who does not pay and leave you alone, this once."
effects = [{ kind = "standing", faction = "free", amount = -2 }, { kind = "scare", amount = 1 }]
bonus = [{ req = { kind = "role", role = "gunner", min = 2 }, add = 25 }]

