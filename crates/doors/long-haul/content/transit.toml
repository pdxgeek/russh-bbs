family = "derelict"
title = "A barge with no one at the helm"
text = "An ore barge, running lights on, no response on any band. Cargo doors closed. It has the look of a ship that did not stop so much as stop being flown."
weight = 6
mods = [{ req = { kind = "economy", economy = "mining" }, pm = 1800 }]

[[event.options]]
label = "Board it"
[[event.options.outcomes]]
weight = 100
text = "You match velocities and cut the lock. The air inside is old."
effects = [{ kind = "board", derelict = "ore_barge" }]

[[event.options]]
label = "Hail it and wait"
[[event.options.outcomes]]
weight = 100
text = "You hail it for an hour. Nobody answers. You go on."
effects = [{ kind = "days", amount = 1 }]

[[event.options]]
label = "Log it for the Union"
[[event.options.outcomes]]
weight = 100
text = "You log its position and go. The Union will send somebody."
effects = [{ kind = "standing", faction = "miners", amount = 1 }]

# ----

[[event]]
id = "quarantine_ship"
family = "derelict"
title = "A quarantine ship"
text = "A hospital ship under quarantine seals, all signals dead. The League's yellow tape is on the hull, and somebody has cut it."
weight = 5

[[event.options]]
label = "Board with your medic"
req = [{ kind = "role", role = "medic", min = 2 }]
needs = "a medic of skill 2 or better"
[[event.options.outcomes]]
weight = 100
text = "Your medic leads the way through the sealed airlock, gloves up. The ship is not as empty as the log said."
effects = [{ kind = "board", derelict = "plague_ship" }, { kind = "flag", name = "plague_cured" }]

[[event.options]]
label = "Board without protection"
[[event.options.outcomes]]
weight = 70
text = "You cut the lock and go in, breathing carefully. The air is old but clean."
effects = [{ kind = "board", derelict = "plague_ship" }]
[[event.options.outcomes]]
weight = 30
text = "Somebody on your boarding party coughs. Then somebody else."
effects = [{ kind = "hurt", who = "random", days = 4 }, { kind = "board", derelict = "plague_ship" }]

[[event.options]]
label = "Leave it sealed"
[[event.options.outcomes]]
weight = 100
text = "You note the position and go. The tape stays cut."
effects = []

# ----

[[event]]
id = "navy_hulk"
family = "derelict"
title = "A dark navy picket"
text = "A League picket, hull intact, lamps dead. The tags on the aft hatch say it was written off six years ago and never salvaged."
weight = 4
mods = [{ req = { kind = "standing", faction = "league", max = 0 }, pm = 1500 }]

[[event.options]]
label = "Board it"
[[event.options.outcomes]]
weight = 100
text = "You cut the lock. The defence bots, from the sound of it, have not been told the war is over."
effects = [{ kind = "board", derelict = "navy_hulk" }, { kind = "standing", faction = "league", amount = -2 }]

[[event.options]]
label = "Report it to the navy"
req = [{ kind = "standing", faction = "league", min = 5 }]
needs = "standing 5+ with the League"
[[event.options.outcomes]]
weight = 100
text = "You file the position. A clerk thanks you, a lieutenant pays a finder's fee."
effects = [{ kind = "credits", amount = 220 }, { kind = "standing", faction = "league", amount = 3 }]

[[event.options]]
label = "Leave it for the navy"
[[event.options.outcomes]]
weight = 100
text = "You leave it. The navy knows where it is, or does not care."
effects = []

# ---------------------------------------------------------------- crew

[[event]]
id = "galley_brawl"
family = "crew"
title = "A brawl in the galley"
text = "Two of your crew are on the galley floor, trading words, then plates, then punches. The rest of the crew has formed a ring and started to take bets."
weight = 10
when = [{ kind = "crew", min = 2 }]

[[event.options]]
label = "Break it up with a firm word"
req = [{ kind = "role", role = "face", min = 1 }]
needs = "a face aboard"
[[event.options.outcomes]]
weight = 90
text = "Your face has the brawl over before it started. Both of them apologise. The galley is cleaned. Nobody gets docked."
effects = [{ kind = "treat", amount = 1 }]
[[event.options.outcomes]]
weight = 10
text = "Your face breaks it up, but takes a plate to the eye."
effects = [{ kind = "hurt", who = "face", days = 2 }]

[[event.options]]
label = "Let them settle it"
[[event.options.outcomes]]
weight = 60
text = "A short, nasty fight, then a longer silence. Both of them are bruised; one of them has a new scar."
effects = [{ kind = "hurt", who = "random", days = 3 }]
[[event.options.outcomes]]
weight = 40
text = "They tire themselves out, shake hands and share a drink. The ship is tighter for it."
effects = [{ kind = "treat", amount = 1 }]

[[event.options]]
label = "Dock both of them a week's pay"
req = [{ kind = "crew", min = 2 }]
needs = "at least two crew"
[[event.options.outcomes]]
weight = 100
text = "You fine them a week's pay each, which saves you the wages and costs you their goodwill."
effects = [{ kind = "credits", amount = 120 }, { kind = "treat", amount = -2 }]

# ----

[[event]]
id = "stowaway_found"
family = "crew"
title = "A stowaway in the hold"
text = "The quartermaster has found a stowaway behind the cargo, thin and unashamed, with a bag of tools and a story about a ship that left without them."
weight = 6

[[event.options]]
label = "Sign them on"
[[event.options.outcomes]]
weight = 40
text = "They say they can fly. They can, after a fashion."
effects = [{ kind = "stowaway", role = "pilot" }, { kind = "flag", name = "stowaway_taken" }]
[[event.options.outcomes]]
weight = 35
text = "They say they can fix anything. They can fix nearly anything."
effects = [{ kind = "stowaway", role = "engineer" }, { kind = "flag", name = "stowaway_taken" }]
[[event.options.outcomes]]
weight = 25
text = "They say they can cook. They can, which is a mercy."
effects = [{ kind = "stowaway", role = "quartermaster" }, { kind = "flag", name = "stowaway_taken" }]

[[event.options]]
label = "Put them off at the next dock"
[[event.options.outcomes]]
weight = 100
text = "You hold them in the galley until the next dock and then walk them out. They do not argue."
effects = [{ kind = "standing", faction = "league", amount = 1 }]

[[event.options]]
label = "Airlock them"
[[event.options.outcomes]]
weight = 100
text = "You do it. It takes two minutes. The crew does not look at you for the rest of the shift."
effects = [{ kind = "treat", amount = -4 }, { kind = "scare", amount = 2 }]

# ----

[[event]]
id = "homesick"
family = "crew"
title = "One of the crew is homesick"
text = "One of your hands has been quiet for days, writing letters nobody will send. Another asked if they can sleep in the cargo bay, away from the engine."
weight = 8
when = [{ kind = "crew", min = 1 }]

[[event.options]]
label = "Give them a day of leave"
[[event.options.outcomes]]
weight = 100
text = "A day of quiet. They come back steadier, and the others notice that you gave it."
effects = [{ kind = "days", amount = 1 }, { kind = "treat", amount = 2 }]

[[event.options]]
label = "Have the medic sit with them"
req = [{ kind = "role", role = "medic", min = 1 }]
needs = "a medic aboard"
[[event.options.outcomes]]
weight = 100
text = "Your medic sits with them for a night and says nothing useful, which is exactly right. They recover."
effects = [{ kind = "treat", amount = 2 }, { kind = "scare", amount = -1 }]

[[event.options]]
label = "Tell them to pull themselves together"
[[event.options.outcomes]]
weight = 100
text = "They pull themselves together. It looks like it hurts."
effects = [{ kind = "treat", amount = -2 }]

# ---------------------------------------------------------------- trade

[[event]]
id = "drifting_pods"
family = "trade"
title = "Drifting cargo pods"
text = "A line of cargo pods, unmarked and unlit, drifts in the lane. Somebody dumped them in a hurry, and somebody else is going to want them back."
weight = 7

[[event.options]]
label = "Scoop the pods"
[[event.options.outcomes]]
weight = 60
text = "Machine parts and coils, mostly in good shape."
effects = [{ kind = "cargo", good = "parts", tons = 4 }, { kind = "cargo", good = "coils", tons = 2 }]
[[event.options.outcomes]]
weight = 25
text = "Medicine and antitoxin. Someone is going to be annoyed."
effects = [{ kind = "cargo", good = "medicine", tons = 3 }, { kind = "cargo", good = "antitoxin", tons = 2 }]
[[event.options.outcomes]]
weight = 15
text = "Ghostwire. Someone is going to be extremely annoyed."
effects = [{ kind = "cargo", good = "ghostwire", tons = 3 }]

[[event.options]]
label = "Scan them first"
req = [{ kind = "scanner", min = 1 }]
needs = "a working scanner"
[[event.options.outcomes]]
weight = 80
text = "The scan marks the dud pods. You scoop only the good ones."
effects = [{ kind = "cargo", good = "medicine", tons = 4 }, { kind = "cargo", good = "parts", tons = 3 }]
[[event.options.outcomes]]
weight = 20
text = "A pod is wired. The scan sees it. You tow the rest and drop the bomb."
effects = [{ kind = "cargo", good = "coils", tons = 3 }, { kind = "xp", skill = "stealth", amount = 4 }]

[[event.options]]
label = "Leave them"
[[event.options.outcomes]]
weight = 100
text = "Somebody else will pick them up, and maybe be sorry."
effects = []

# ----

[[event]]
id = "roving_trader"
family = "trade"
title = "A roving trader"
text = "A peddler's hull, lit like a bazaar, hails you with a bright voice. They buy, they sell, they ask no questions, they say. They ask a few."
weight = 8

[[event.options]]
label = "Haggle for their stock"
req = [{ kind = "role", role = "face", min = 1 }]
needs = "a face aboard"
[[event.options.outcomes]]
weight = 85
text = "Your face has them laughing and cutting the price. A crate of salt spice, a case of glass wine, all at a hand-shaking price."
effects = [{ kind = "cargo", good = "salt_spice", tons = 4 }, { kind = "cargo", good = "glass_wine", tons = 2 }]
[[event.options.outcomes]]
weight = 15
text = "Your face is out-talked by a professional."
effects = [{ kind = "credits", amount = -150 }]

[[event.options]]
label = "Buy a small lot (180 cr)"
req = [{ kind = "cash", min = 180 }]
needs = "180 cr in the purse"
[[event.options.outcomes]]
weight = 100
text = "You pay what they ask and take what they hand over: a case of curios, mostly cracked."
effects = [{ kind = "credits", amount = -180 }, { kind = "cargo", good = "curios", tons = 2 }]

[[event.options]]
label = "Sell them a ton of anything"
req = [{ kind = "good", good = "ore", tons = 1 }]
needs = "ore aboard"
[[event.options.outcomes]]
weight = 100
text = "They pay well for ore. They always do."
effects = [{ kind = "cargo", good = "ore", tons = -1 }, { kind = "credits", amount = 210 }]

[[event.options]]
label = "Wave them off"
[[event.options.outcomes]]
weight = 100
text = "They wave back, bright as ever, and burn on."
effects = []

# ----

[[event]]
id = "guild_buyer"
family = "trade"
title = "A Guild buyer on the lane"
text = "A Guild cutter pings you on a private band: they are buying survey data on the spot, no questions about where it came from, at a rate that does not insult anyone."
weight = 4
when = [{ kind = "standing", faction = "guild", min = -20 }]

[[event.options]]
label = "Sell what you have"
[[event.options.outcomes]]
weight = 100
text = "A fair price. The clerk logs it and thanks you."
effects = [{ kind = "credits", amount = 220 }, { kind = "standing", faction = "guild", amount = 2 }]

[[event.options]]
label = "Let the scientist trade notes"
req = [{ kind = "role", role = "scientist", min = 2 }]
needs = "a scientist of skill 2 or better"
[[event.options.outcomes]]
weight = 100
text = "Your scientist and the Guild's clerk spend an hour trading notes. You come away richer in the ways that count."
effects = [{ kind = "credits", amount = 340 }, { kind = "standing", faction = "guild", amount = 3 }, { kind = "xp", skill = "survey", amount = 6 }]

[[event.options]]
label = "Decline"
[[event.options.outcomes]]
weight = 100
text = "The cutter fades. The clerk will not remember."
effects = []

# ---------------------------------------------------------------- omens

[[event]]
id = "black_ship"
family = "omen"
title = "A ship with no lights"
text = "Something is running parallel to you at the edge of the scope. A big hull, no lights, no wake. It does not answer a hail. After an hour it turns and is gone."
weight = 3
once = "ghost_ship_seen"

[[event.options]]
label = "Turn a camera on it"
req = [{ kind = "scanner", min = 1 }]
needs = "a working scanner"
[[event.options.outcomes]]
weight = 100
text = "The scanner catches a shadow with a gate sigil on its flank. A Church ship, the pilgrims would say. A ghost, the crew would say. Either way, someone will pay for the image."
effects = [{ kind = "survey", value = 280 }, { kind = "xp", skill = "survey", amount = 6 }]

[[event.options]]
label = "Log it and say nothing"
[[event.options.outcomes]]
weight = 100
text = "You write it in the log and leave it there. In the galley, the crew has plenty to say."
effects = [{ kind = "scare", amount = 1 }]

# ----

[[event]]
id = "navigators_rhyme"
family = "omen"
title = "An old navigator's rhyme"
text = "One of the crew mutters a rhyme from the old gate days, a navigator's trick for the long dark. It sounds like nonsense. It also sounds like it has been right before."
weight = 4
when = [{ kind = "crew", min = 1 }]

[[event.options]]
label = "Fly by the rhyme"
[[event.options.outcomes]]
weight = 60
text = "You fly by it, because why not. It saves you a little fuel and a lot of doubt."
effects = [{ kind = "fuel", amount = 4 }, { kind = "xp", skill = "pilot", amount = 4 }]
[[event.options.outcomes]]
weight = 40
text = "It is a rhyme. It does nothing. The crew laughs about it for a week."
effects = [{ kind = "treat", amount = 1 }]

[[event.options]]
label = "Write it down for the Guild"
req = [{ kind = "role", role = "scientist", min = 1 }]
needs = "a scientist aboard"
[[event.options.outcomes]]
weight = 100
text = "Your scientist writes it down and hums it back. The Guild's folklorists will want it."
effects = [{ kind = "survey", value = 150 }]

[[event.options]]
label = "Tell them to hush"
[[event.options.outcomes]]
weight = 100
text = "They hush. The rhyme gets quieter, and does not stop."
effects = []
