[[event]]
id = "union_toll_b"
family = "trade"
title = "A Union toll gate"
text = "A Miners' Union tug has strung a cable across the lane and put up a sign. A toll on all traffic, it says, to pay for the lane's lamps. The lamps are dim, but the cable is thick."
weight = 6
mods = [{ req = { kind = "standing", faction = "miners", max = -1 }, pm = 1800 }]

[[event.options]]
label = "Pay the toll (80 cr)"
req = [{ kind = "cash", min = 80 }]
needs = "80 cr in the purse"
[[event.options.outcomes]]
weight = 100
text = "You pay, and the cable drops. The tug's clerk gives you a receipt and a small, tired smile."
effects = [{ kind = "credits", amount = -80 }, { kind = "standing", faction = "miners", amount = 2 }]

[[event.options]]
label = "Show your debt chit"
req = [{ kind = "flag", name = "union_debt" }]
needs = "a debt to the Union, on record"
[[event.options.outcomes]]
weight = 100
text = "You show the chit the Union gave you when you owed it. The marshal tears it in half and lifts the cable. Your debt is clear."
effects = [{ kind = "standing", faction = "miners", amount = 3 }]

[[event.options]]
label = "Talk the marshal down"
req = [{ kind = "role", role = "face", min = 2 }]
needs = "a face of skill 2 or better"
[[event.options.outcomes]]
weight = 65
text = "Your face remembers the marshal's name from a dock and a drink. The cable drops with a nod."
effects = [{ kind = "xp", skill = "trade", amount = 5 }, { kind = "standing", faction = "miners", amount = 1 }]
[[event.options.outcomes]]
weight = 35
text = "The marshal remembers you as well. The fight is short and on his terms."
effects = [{ kind = "combat", enemy = "union_marshal" }, { kind = "standing", faction = "miners", amount = -3 }]

[[event.options]]
label = "Run the cable"
[[event.options.outcomes]]
weight = 100
text = "You hit the throttle and cut the cable. The tug gives chase for an hour and gives up."
effects = [{ kind = "hull", amount = -6 }, { kind = "standing", faction = "miners", amount = -6 }, { kind = "scare", amount = 1 }]

# ----

[[event]]
id = "customs_hawk_b"
family = "trade"
title = "A customs hawk"
text = "A fast League customs hawk comes in on an intercept, lamp bright and turrets cold. A voice requests a manifest, a signature and a look in the hold. It is polite, and it is not a request."
weight = 6
mods = [{ req = { kind = "contraband", tons = 1 }, pm = 2500 }]

[[event.options]]
label = "Let them look"
[[event.options.outcomes]]
weight = 100
text = "The hawk's officer is thorough and cheerful. Nothing is wrong, and he leaves a receipt for it."
effects = [{ kind = "days", amount = 1 }, { kind = "standing", faction = "league", amount = 1 }]

[[event.options]]
label = "Hide the contraband"
req = [{ kind = "role", role = "quartermaster", min = 2 }, { kind = "contraband", tons = 1 }]
needs = "a quartermaster of skill 2 and contraband aboard"
[[event.options.outcomes]]
weight = 75
text = "Your quartermaster has the hold looking like a church bake sale. The officer leaves with a handshake."
effects = [{ kind = "xp", skill = "stealth", amount = 6 }]
[[event.options.outcomes]]
weight = 25
text = "The hawk's scanner is better than your shield. Contraband gone, a fine paid."
effects = [{ kind = "lose_contraband", pct = 100 }, { kind = "credits", amount = -200 }, { kind = "standing", faction = "league", amount = -3 }]

[[event.options]]
label = "Run for it"
[[event.options.outcomes]]
weight = 100
text = "The hawk's lamp goes red."
effects = [{ kind = "combat", enemy = "customs_hawk" }, { kind = "standing", faction = "league", amount = -4 }]

# ----

[[event]]
id = "water_cartel_b"
family = "trade"
title = "A water cartel's offer"
text = "A Free Captains' fixer hails you on a quiet band. They have a buyer for water at a ridiculous price, on a rock that cannot be named, and they are short a hold."
weight = 5

[[event.options]]
label = "Sell four tons of water"
req = [{ kind = "good", good = "water", tons = 4 }]
needs = "four tons of water"
[[event.options.outcomes]]
weight = 100
text = "A tidy handoff in the dark. The fixer pays in clean credits and remembers your name, which is not always a good thing."
effects = [{ kind = "cargo", good = "water", tons = -4 }, { kind = "credits", amount = 520 }, { kind = "standing", faction = "free", amount = 2 }, { kind = "flag", name = "cartel_contact" }]

[[event.options]]
label = "Use your cartel contact"
req = [{ kind = "flag", name = "cartel_contact" }, { kind = "good", good = "water", tons = 4 }]
needs = "a cartel contact and four tons of water"
[[event.options.outcomes]]
weight = 100
text = "Your cartel contact vouches for you. The fixer doubles the price and thanks you for your patience."
effects = [{ kind = "cargo", good = "water", tons = -4 }, { kind = "credits", amount = 820 }, { kind = "standing", faction = "free", amount = 2 }]

[[event.options]]
label = "Decline"
[[event.options.outcomes]]
weight = 100
text = "The fixer sighs, the band goes quiet, and you wonder what you missed."
effects = []

# ----

[[event]]
id = "pilgrim_barge_b"
family = "omen"
title = "A barge of singing pilgrims"
text = "A tired old barge drifts in the lane, crammed with pilgrims who have run out of fuel and nothing else. They sing on, in thin unison. A Church banner flaps on a long pole at the stern."
weight = 4

[[event.options]]
label = "Give them fuel (10 units)"
[[event.options.outcomes]]
weight = 100
text = "They weep, and sing louder. A Church elder blesses your ship by name, and the bridge is quiet for a minute."
effects = [{ kind = "fuel", amount = -10 }, { kind = "standing", faction = "church", amount = 5 }, { kind = "treat", amount = 1 }]

[[event.options]]
label = "Board and see what the barge carries"
[[event.options.outcomes]]
weight = 100
text = "The pilgrims let you in. What they carry is not what they say."
effects = [{ kind = "board", derelict = "pilgrim_barge" }, { kind = "standing", faction = "church", amount = -2 }]

[[event.options]]
label = "Sing along for a verse"
req = [{ kind = "no_flag", name = "gate_song" }]
needs = "the song, not yet learned"
[[event.options.outcomes]]
weight = 100
text = "A verse, then another. The song settles in your head and does not leave."
effects = [{ kind = "flag", name = "gate_song" }, { kind = "standing", faction = "church", amount = 1 }]

[[event.options]]
label = "Wave them off"
[[event.options.outcomes]]
weight = 100
text = "They keep singing as the barge falls behind."
effects = []

# ----

[[event]]
id = "warden_lights_b"
family = "omen"
title = "The warden lights"
text = "Three white lights hang in the lane, spaced like the stations of an old gate. Your scope calls them a hazard. The pilgrims in the crew call them wardens. Whatever they are, they are watching."
weight = 3

[[event.options]]
label = "Pass beneath them under truce"
req = [{ kind = "flag", name = "wardens_truce" }]
needs = "a truce with the wardens"
[[event.options.outcomes]]
weight = 100
text = "The lights tilt to follow you, then bow and go dark. The way is open."
effects = [{ kind = "standing", faction = "church", amount = 3 }, { kind = "xp", skill = "pilot", amount = 5 }]

[[event.options]]
label = "Hum the gate song"
req = [{ kind = "flag", name = "gate_song" }, { kind = "no_flag", name = "wardens_truce" }]
needs = "the gate song, learned from pilgrims"
[[event.options.outcomes]]
weight = 100
text = "The lights hold, then tilt. They fall into step beside you for an hour, and then wink out. Something is settled between you."
effects = [{ kind = "flag", name = "wardens_truce" }, { kind = "standing", faction = "church", amount = 3 }]

[[event.options]]
label = "Approach and hail"
[[event.options.outcomes]]
weight = 55
text = "The lights hold still. Your hail goes unanswered, and the lights fade like breath."
effects = [{ kind = "scare", amount = 1 }]
[[event.options.outcomes]]
weight = 45
text = "The lights stir. Something comes up out of the dark, and it is not friendly."
effects = [{ kind = "combat", enemy = "gate_warden" }, { kind = "scare", amount = 2 }]

[[event.options]]
label = "Turn back"
[[event.options.outcomes]]
weight = 100
text = "You turn back. The lights do not follow, and the long way round costs you a day."
effects = [{ kind = "days", amount = 1 }, { kind = "fuel", amount = -3 }]

# ----

[[event]]
id = "dead_reckoning_b"
family = "omen"
title = "The stars go out for a minute"
text = "At the shift change every star in the forward scope goes dark for sixty seconds. Then they come back, slightly out of place. The pilot says nothing. The navigator's rhyme is on everyone's mind."
weight = 4

[[event.options]]
label = "Check the new stars against an archive table"
req = [{ kind = "flag", name = "archive_key" }]
needs = "the archive's key frequency"
[[event.options.outcomes]]
weight = 100
text = "The archive's star table matches what you see, offset by exactly the amount the stars moved. You fly straight to the shortcut it implies."
effects = [{ kind = "fuel", amount = 8 }, { kind = "xp", skill = "pilot", amount = 6 }, { kind = "survey", value = 220 }]

[[event.options]]
label = "Have the scientist log the shift"
req = [{ kind = "role", role = "scientist", min = 2 }]
needs = "a scientist of skill 2 or better"
[[event.options.outcomes]]
weight = 100
text = "Your scientist logs a plausible explanation and an implausible one. The Guild will take both."
effects = [{ kind = "survey", value = 260 }, { kind = "xp", skill = "survey", amount = 5 }]

[[event.options]]
label = "Re-fix the nav and move on"
[[event.options.outcomes]]
weight = 70
text = "A long half-hour of re-fixing. The stars are where they were. Probably."
effects = [{ kind = "days", amount = 1 }]
[[event.options.outcomes]]
weight = 30
text = "The re-fix is a few degrees off. You spend a day finding out."
effects = [{ kind = "days", amount = 2 }, { kind = "fuel", amount = -4 }]
