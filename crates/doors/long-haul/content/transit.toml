[[event]]
id = "pressed_hands_a"
family = "pirate"
title = "A press gang on the lane"
text = "A ragged corvette hails you, short of hands. Their captain does not ask nicely: she wants a body or two from your crew, and she wants them to come willingly. She has left a pistol on her console where you can see it."
weight = 5
when = [{ kind = "crew", min = 2 }]

[[event.options]]
label = "Show them your guns"
req = [{ kind = "weapons", min = 4 }]
needs = "weapons of power 4 or better"
[[event.options.outcomes]]
weight = 75
