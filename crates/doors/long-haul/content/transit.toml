# ---------------------------------------------------------------- batch A: pirate

[[event]]
id = "marauder_ledger_a"
family = "pirate"
title = "A marauder reads you the ledger"
text = "A heavy marauder takes position off your bow, running lights doused. A voice reads aloud from a ledger: your hull number, your cargo, the figure that would let you keep both. It is a very good ledger."
weight = 8
