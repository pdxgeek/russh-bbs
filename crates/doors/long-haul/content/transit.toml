[[event]]
id = "pilgrim_air"
family = "distress"
title = "A pilgrim ship low on air"
text = "A bent little ship painted with the gate sigil, its scrubbers failing. A woman in grey on the comm asks for water, nothing more, and makes it sound like a blessing."
weight = 5
mods = [{ req = { kind = "standing", faction = "church", min = 10 }, pm = 1800 }]

[[event.options]]
label = "Send them water (4 t)"
req = [{ kind = "good", good = "water", tons = 4 }]
needs = "4 t of water aboard"
[[event.options.outcomes]]
weight = 100
text = "Four tons and a clean handoff. The woman in grey touches her brow, then her breast, then yours. The Quiet Church remembers who answered."
effects = [{ kind = "cargo", good = "water", tons = -4 }, { kind = "flag", name = "helped_pilgrims" }, { kind = "standing", faction = "church", amount = 6 }]

[[event.options]]
label = "Sell them water if you can"
req = [{ kind = "good", good = "water", tons = 2 }]
needs = "water aboard"
[[event.options.outcomes]]
weight = 100
text = "You sell two tons at three times the going rate. They pay in old coin and do not argue."
effects = [{ kind = "cargo", good = "water", tons = -2 }, { kind = "credits", amount = 220 }, { kind = "standing", faction = "church", amount = -2 }]

[[event.options]]
label = "Offer your prayers and move on"
[[event.options.outcomes]]
weight = 100
text = "You wish them well and mean it, and they take it kindly. It is not water."
effects = [{ kind = "standing", faction = "church", amount = 1 }]

