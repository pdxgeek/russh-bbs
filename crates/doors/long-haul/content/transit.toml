[[event.options]]
label = "Read the glyphs"
req = [{ kind = "role", role = "scientist", min = 2 }]
needs = "a scientist of skill 2 or better"
[[event.options.outcomes]]
weight = 100
text = "Your scientist copies the lock's glyphs and writes a long note for the Guild. The door stays shut, and the note pays."
