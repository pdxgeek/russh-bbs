[[event]]
id = "tomb_barge_b"
family = "derelict"
title = "A barge with a sealed door"
text = "A long barge in old gate livery, doors sealed with a lock that wants a song. The hull is pitted from a hundred years of drift. The lock's glyphs glow faintly when your scanner touches them."
