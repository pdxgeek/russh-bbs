[[event]]
id = "dry_tug"
family = "distress"
title = "A tug with an empty tank"
text = "An ore tug has burned its last spare unit on the long haul from the claims. Its pilot is polite about it, which means they are afraid."
weight = 7
mods = [{ req = { kind = "economy", economy = "mining" }, pm = 2000 }]

[[event.options]]
label = "Give them fuel (8 units)"
[[event.options.outcomes]]
weight = 100
text = "You pump eight units across. The pilot sends a Union steward's thanks, and a Union steward's thanks is worth something at the next claim."
effects = [{ kind = "fuel", amount = -8 }, { kind = "standing", faction = "miners", amount = 5 }]

[[event.options]]
label = "Sell them fuel at a premium"
[[event.options.outcomes]]
weight = 70
text = "You sell eight units at three times the dock rate. The pilot pays, and writes the number down."
effects = [{ kind = "fuel", amount = -8 }, { kind = "credits", amount = 340 }, { kind = "standing", faction = "miners", amount = -2 }]
[[event.options.outcomes]]
weight = 30
text = "They pay you in ore they cannot afford to give. Your quartermaster does not like the look of it."
effects = [{ kind = "fuel", amount = -8 }, { kind = "cargo", good = "ore", tons = 6 }]

[[event.options]]
label = "Wish them luck"
[[event.options.outcomes]]
weight = 100
text = "You wish them luck on an open channel. Neither of you is convinced."
effects = [{ kind = "standing", faction = "miners", amount = -1 }]

