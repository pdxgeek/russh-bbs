[[event.options]]
label = "Break the door"
[[event.options.outcomes]]
weight = 100
text = "A long grind with a cutter. The door gives, and the barge was ready."
effects = [{ kind = "days", amount = 1 }, { kind = "board", derelict = "tomb_barge" }, { kind = "standing", faction = "church", amount = -3 }]

[[event.options]]
label = "Leave the dead"
[[event.options.outcomes]]
weight = 100
text = "You let the barge keep her door."
effects = []

# ----

[[event]]
id = "prison_hulk_b"
family = "derelict"
title = "A prison hulk"
text = "An old League prison hulk, her cell ring dark. The tags say it was emptied years ago. The comm panel on her hull says otherwise, in a voice that wants to talk."
weight = 4

[[event.options]]
label = "Talk to the voice"
req = [{ kind = "role", role = "face", min = 2 }]
needs = "a face of skill 2 or better"
[[event.options.outcomes]]
weight = 70
text = "Your face keeps the voice talking for an hour. In the end it asks to come aboard, and you find a berth for a quiet fixer who knows a lot about locks."
effects = [{ kind = "stowaway", role = "engineer" }, { kind = "standing", faction = "free", amount = 2 }, { kind = "treat", amount = 1 }]
[[event.options.outcomes]]
weight = 30
text = "The voice is a loop, an old recording of a warden."
effects = [{ kind = "xp", skill = "trade", amount = 3 }]

[[event.options]]
label = "Board the hulk"
[[event.options.outcomes]]
weight = 100
text = "You go in through the guard lock. The cell ring is not as dead as it looked."
effects = [{ kind = "board", derelict = "prison_hulk" }, { kind = "standing", faction = "league", amount = -2 }]

[[event.options]]
label = "Leave it sealed"
[[event.options.outcomes]]
weight = 100
text = "A prison is a bad thing to open. You leave the voice to its loop."
effects = []

# ----

[[event]]
id = "race_yacht_b"
family = "derelict"
title = "A racing yacht, adrift"
text = "A racing yacht, all gleaming lines and thin fuel tanks, drifts with her sails furled. A little brass plate on the hull says the owner is not to be disturbed. The ship, on the other hand, is a prize."
weight = 5

[[event.options]]
label = "Tow her to a dock"
req = [{ kind = "role", role = "pilot", min = 3 }]
needs = "a pilot of skill 3 or better"
[[event.options.outcomes]]
weight = 80
text = "Your pilot ties on and tows the yacht in. Her owner, a Free Captain with a taste for gold, pays handsomely at the next dock."
effects = [{ kind = "credits", amount = 520 }, { kind = "standing", faction = "free", amount = 3 }, { kind = "xp", skill = "pilot", amount = 6 }]
[[event.options.outcomes]]
weight = 20
text = "The tow fouls halfway and the yacht tears a plate off your hull."
effects = [{ kind = "credits", amount = 180 }, { kind = "hull", amount = -6 }, { kind = "days", amount = 1 }]

[[event.options]]
label = "Board her"
[[event.options.outcomes]]
weight = 100
text = "A small airlock, a very expensive cabin, and an automated guard."
effects = [{ kind = "board", derelict = "racing_yacht" }, { kind = "standing", faction = "free", amount = -2 }]

[[event.options]]
label = "Hail the owner"
[[event.options.outcomes]]
weight = 100
text = "No answer, then a long, sulky 'who is this' from a very small bunk. They pay for the hail in credits and in silence."
effects = [{ kind = "credits", amount = 60 }, { kind = "standing", faction = "free", amount = 1 }]

# ----

[[event]]
id = "drone_nest_b"
family = "derelict"
title = "A drone nest"
text = "A rock in the lane has been hollowed into a foundry and left to run. The scan shows a ring of small, patient machines that move when you move. Whoever built the nest is gone."
weight = 4

[[event.options]]
label = "Pick the nest apart from range"
req = [{ kind = "role", role = "gunner", min = 2 }]
needs = "a gunner of skill 2 or better"
[[event.options.outcomes]]
weight = 80
text = "Your gunner takes the drones in ones and twos at long range. The foundry is yours, and so is the stock in its racks."
effects = [{ kind = "cargo", good = "coils", tons = 4 }, { kind = "cargo", good = "parts", tons = 3 }, { kind = "xp", skill = "engineer", amount = 4 }]
[[event.options.outcomes]]
weight = 20
text = "The drones flank you on the last pass and chew a plate."
effects = [{ kind = "cargo", good = "coils", tons = 2 }, { kind = "hull", amount = -8 }]

[[event.options]]
label = "Board the foundry"
[[event.options.outcomes]]
weight = 100
text = "A tight, hot, lit-up shaft, and a hundred red eyes in the dark."
effects = [{ kind = "board", derelict = "drone_nest" }]

[[event.options]]
label = "Turn away"
[[event.options.outcomes]]
weight = 100
text = "You turn away and let the machines keep their rock."
effects = []

# ----

[[event]]
id = "old_claim_b"
family = "crew"
title = "A crewmate's old claim"
text = "One of your crew has gone quiet on the bridge. Eventually they point at the scope: a dead mining platform off the lane. Their family worked it once, they say. They would like a look."
weight = 8
when = [{ kind = "crew", min = 1 }]

[[event.options]]
label = "Let your sworn engineer lead the way"
req = [{ kind = "sworn", role = "engineer" }]
needs = "a sworn engineer aboard"
[[event.options.outcomes]]
weight = 100
text = "Your sworn engineer knows the old platform's bones. They find the crew's old locker and get you all through the defences in one piece. The crew is moved."
effects = [{ kind = "board", derelict = "mining_platform" }, { kind = "treat", amount = 2 }]

[[event.options]]
label = "Board it, everyone together"
req = [{ kind = "crew", min = 2 }]
needs = "at least two crew"
[[event.options.outcomes]]
weight = 100
text = "The crew goes in as a body, nervous and quiet."
effects = [{ kind = "board", derelict = "mining_platform" }, { kind = "treat", amount = 1 }]

[[event.options]]
label = "Say no, and be kind about it"
[[event.options.outcomes]]
weight = 100
text = "You say no and mean it kindly. The crew member nods, and says nothing for a day."
effects = [{ kind = "treat", amount = -1 }]

# ----

[[event]]
id = "watch_rota_b"
family = "crew"
title = "A quarrel over the watch rota"
text = "The watch rota has been wrong for a week and everybody has a view. Tonight it reaches the galley table. Three people are talking at once, and the rest are being very careful with their forks."
weight = 9
when = [{ kind = "crew", min = 3 }]

[[event.options]]
label = "Let the quartermaster redraw it"
req = [{ kind = "role", role = "quartermaster", min = 2 }]
needs = "a quartermaster of skill 2 or better"
[[event.options.outcomes]]
weight = 90
text = "Your quartermaster redraws the rota on one sheet. It is fair, bleak and followed. The galley goes back to eating."
effects = [{ kind = "treat", amount = 2 }, { kind = "xp", skill = "stealth", amount = 3 }]
[[event.options.outcomes]]
weight = 10
text = "The new rota is fairer and nobody likes it."
effects = [{ kind = "treat", amount = -1 }]

[[event.options]]
label = "Settle it with a firm voice"
req = [{ kind = "role", role = "face", min = 2 }]
needs = "a face of skill 2 or better"
[[event.options.outcomes]]
weight = 75
text = "Your face lets everyone talk, then names a fix. It sticks."
effects = [{ kind = "treat", amount = 1 }]
[[event.options.outcomes]]
weight = 25
text = "It does not stick. By morning the rota has been rewritten twice."
effects = [{ kind = "treat", amount = -1 }]

[[event.options]]
label = "Rule by the captain's word"
[[event.options.outcomes]]
weight = 55
text = "You rule by your word and nobody argues. It also stops anyone liking you for a week."
effects = [{ kind = "treat", amount = -1 }]
[[event.options.outcomes]]
weight = 45
text = "You pick well. The rota holds, and so does the peace."
effects = [{ kind = "treat", amount = 1 }]

# ----

[[event]]
id = "night_terrors_b"
family = "crew"
title = "The crew cannot sleep"
text = "Nobody has slept properly since the last bad run. The crew is quiet in the way of people counting things: hull plates, days, the number of friends who were here last month."
weight = 9
when = [{ kind = "crew", min = 2 }]

[[event.options]]
label = "Have the medic run a sleep ward"
req = [{ kind = "role", role = "medic", min = 2 }]
needs = "a medic of skill 2 or better"
[[event.options.outcomes]]
weight = 100
text = "Your medic sets quiet hours, a warm drink and a dim lamp. By the third night, the crew is sleeping, and the galley is almost cheerful."
effects = [{ kind = "treat", amount = 2 }, { kind = "scare", amount = -2 }]

[[event.options]]
label = "Stand a watch yourself"
[[event.options.outcomes]]
weight = 100
text = "You sit in the dark, listening to the ship breathe, so that nobody else has to. They notice."
effects = [{ kind = "treat", amount = 1 }, { kind = "scare", amount = -1 }, { kind = "days", amount = 1 }]

[[event.options]]
label = "Break out the glass wine"
req = [{ kind = "good", good = "glass_wine", tons = 1 }]
needs = "glass wine in the hold"
[[event.options.outcomes]]
weight = 100
text = "A bottle goes round. It does what it does."
effects = [{ kind = "cargo", good = "glass_wine", tons = -1 }, { kind = "treat", amount = 2 }, { kind = "scare", amount = -2 }]

[[event.options]]
label = "Tell them to toughen up"
[[event.options.outcomes]]
weight = 100
text = "Nobody speaks of it again, and nobody forgets it."
effects = [{ kind = "treat", amount = -2 }, { kind = "scare", amount = 1 }]

# ----

[[event]]
id = "wage_petition_b"
family = "crew"
title = "A petition for better pay"
text = "A neat paper note is left on the bridge hatch. It lists, in careful hands, every extra duty the crew has done this season and what the pay for each ought to be. It is signed by everybody."
weight = 8
when = [{ kind = "crew", min = 2 }]

[[event.options]]
label = "Pay a bonus (200 cr)"
req = [{ kind = "cash", min = 200 }]
needs = "200 cr in the purse"
[[event.options.outcomes]]
weight = 100
text = "You pay out a bonus, small and sincere. The crew take it as a promise."
effects = [{ kind = "credits", amount = -200 }, { kind = "treat", amount = 3 }]

[[event.options]]
label = "Argue the terms down"
req = [{ kind = "role", role = "face", min = 2 }]
needs = "a face of skill 2 or better"
[[event.options.outcomes]]
weight = 75
text = "Your face makes a case no one can answer: the ship is poor, the loan is real, and the bonus will come later. They accept a small gesture and a date."
effects = [{ kind = "credits", amount = -60 }, { kind = "treat", amount = 1 }]
[[event.options.outcomes]]
weight = 25
text = "They see through it. The mood sours."
effects = [{ kind = "treat", amount = -2 }]

[[event.options]]
label = "Promise it after the next sale"
[[event.options.outcomes]]
weight = 100
text = "The crew accepts the promise, once. They will want it kept."
effects = []

[[event.options]]
label = "Tear it up"
[[event.options.outcomes]]
weight = 100
text = "You tear up the note. Everyone sees you do it."
effects = [{ kind = "treat", amount = -3 }]

# ----

[[event]]
id = "stash_buoy_b"
family = "trade"
title = "A smuggler's stash buoy"
text = "A beacon blinks a coded signal you half remember from a Free Captains' bar. A smuggler's stash buoy, tethered to a rock. Inside there may be a lot, or there may be a trap."
weight = 5

[[event.options]]
label = "Open it"
[[event.options.outcomes]]
weight = 100
text = "The latch gives, and the buoy's guard wakes up."
effects = [{ kind = "board", derelict = "smuggler_stash" }, { kind = "standing", faction = "free", amount = -1 }]

[[event.options]]
label = "Pick the lock quietly"
req = [{ kind = "role", role = "quartermaster", min = 2 }]
needs = "a quartermaster of skill 2 or better"
[[event.options.outcomes]]
weight = 85
text = "Your quartermaster takes the lock without waking the guard. Inside, a crate of ghostwire and a purse, and a note in a fist that reads 'if found, forget'."
effects = [{ kind = "cargo", good = "ghostwire", tons = 3 }, { kind = "credits", amount = 240 }, { kind = "xp", skill = "stealth", amount = 6 }]
[[event.options.outcomes]]
weight = 15
text = "The lock was wired. The guard wakes anyway."
effects = [{ kind = "board", derelict = "smuggler_stash" }]

[[event.options]]
label = "Leave a coin and the codes"
req = [{ kind = "cash", min = 40 }]
needs = "40 cr in the purse"
[[event.options.outcomes]]
weight = 100
text = "You leave a coin and the code to your own ship. The Free Captains, you hope, will understand."
effects = [{ kind = "credits", amount = -40 }, { kind = "standing", faction = "free", amount = 3 }]

[[event.options]]
label = "Ignore it"
[[event.options.outcomes]]
weight = 100
text = "Not your buoy, not your trouble."
effects = []

