[[event.options]]
label = "Offer them spare fuel (6 units)"
[[event.options.outcomes]]
weight = 100
text = "The picket takes six units without a word and sends a signal in return: two clipped lines of thanks."
effects = [{ kind = "fuel", amount = -6 }, { kind = "standing", faction = "league", amount = 3 }]

[[event.options]]
label = "Wish them luck"
[[event.options.outcomes]]
weight = 100
text = "You decline, politely. The silence on the comm is a form of reply."
effects = [{ kind = "standing", faction = "league", amount = -2 }]

