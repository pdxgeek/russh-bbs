[[event]]
id = "pilgrim_chant_a"
family = "signal"
title = "A chant on the ship's speakers"
text = "A call-and-response chant on a lane band, a hundred voices singing in the tongue of the Quiet Church. Behind them there is a deep, broad rhythm like the beating of a hull. The words are old and the voices are not."
weight = 5
mods = [{ req = { kind = "standing", faction = "church", min = 5 }, pm = 1600 }, { req = { kind = "passenger" }, pm = 800 }]

[[event.options]]
label = "Sing along"
req = [{ kind = "role", role = "face", min = 1 }]
needs = "a face aboard"
[[event.options.outcomes]]
weight = 80
text = "Your face has the knack of joining a song. A hundred voices turn to welcome you, and the Church sends a blessing."
effects = [{ kind = "standing", faction = "church", amount = 5 }, { kind = "treat", amount = 1 }]
[[event.options.outcomes]]
weight = 20
text = "You get the response wrong. A moment of silence follows, and then a gentle, patient correction."
effects = [{ kind = "standing", faction = "church", amount = 1 }]

[[event.options]]
label = "Record the rhythm"
[[event.options.outcomes]]
weight = 70
text = "A fine recording. The beat under the voices is no instrument you know, and a Guild acoustician pays handsomely for it."
effects = [{ kind = "survey", value = 280 }, { kind = "xp", skill = "survey", amount = 6 }]
[[event.options.outcomes]]
weight = 30
text = "The rhythm gets into the recording, and then into the room. It takes an hour and a bottle to settle your crew."
effects = [{ kind = "survey", value = 280 }, { kind = "scare", amount = 1 }]

[[event.options]]
label = "Mute the band"
[[event.options.outcomes]]
weight = 100
text = "The chant ends. Behind it, the quiet is exactly as loud as before."

