[[event]]
id = "relay_tap_a"
family = "signal"
title = "A Guild relay left unlocked"
text = "A Cartographers' Guild relay buoy answers your ping with its whole archive, unencrypted. Whoever set it up forgot the lock. It is full of charts and handwritten notes and some very rude marginalia."
weight = 6
once = "relay_tap"
mods = [{ req = { kind = "role", role = "scientist", min = 2 }, pm = 1600 }]

[[event.options]]
label = "Have your scientist copy the charts"
