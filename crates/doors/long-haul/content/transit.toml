effects = [{ kind = "cargo", good = "grain", tons = 6 }, { kind = "cargo", good = "parts", tons = 3 }, { kind = "days", amount = 1 }, { kind = "xp", skill = "stealth", amount = 6 }]
[[event.options.outcomes]]
weight = 30
