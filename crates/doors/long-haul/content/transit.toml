[[event.options]]
label = "Outrun them"
req = [{ kind = "role", role = "pilot", min = 3 }]
needs = "a pilot of skill 3 or better"
[[event.options.outcomes]]
weight = 85
text = "Your pilot takes you across the lane edge and into the debris of a dead barge, and the corvette stays behind. The crew cheers."
effects = [{ kind = "fuel", amount = -6 }, { kind = "treat", amount = 1 }, { kind = "xp", skill = "pilot", amount = 8 }]
[[event.options.outcomes]]
weight = 15
