req = [{ kind = "cash", min = 350 }]
needs = "350 cr in the purse"
[[event.options.outcomes]]
weight = 100
text = "They take the money and wave you through, ledger closed. You have the sense of having been stamped."
effects = [{ kind = "credits", amount = -350 }, { kind = "standing", faction = "free", amount = 2 }]

[[event.options]]
label = "Refuse and bring the guns up"
[[event.options.outcomes]]
weight = 60
