effects = [{ kind = "hull", amount = -7 }, { kind = "standing", faction = "free", amount = -3 }]

[[event.options]]
label = "Offer a berth to a volunteer"
[[event.options.outcomes]]
weight = 70
text = "One of your crew steps forward, grim, and is gone before the end of the shift. The rest see it and say nothing."
effects = [{ kind = "kill", who = "random" }, { kind = "standing", faction = "free", amount = 3 }, { kind = "treat", amount = -3 }, { kind = "scare", amount = 1 }]
[[event.options.outcomes]]
