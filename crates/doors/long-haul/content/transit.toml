[[event.options]]
label = "Cut your way in"
[[event.options.outcomes]]
weight = 100
text = "You cut in without asking. The Church will not forget the cut."
effects = [{ kind = "standing", faction = "church", amount = -8 }, { kind = "board", derelict = "church_reliquary" }]

[[event.options]]
label = "Light a candle and go"
[[event.options.outcomes]]
weight = 100
text = "A small candle in the cockpit, and a quiet lane."
effects = [{ kind = "standing", faction = "church", amount = 1 }]

