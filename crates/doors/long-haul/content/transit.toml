[[event]]
id = "crate_collectors_a"
family = "pirate"
title = "Free Captains looking for a crate"
text = "A Free Captains skiff matches your course and asks, very politely, whether you have taken anything lately that belongs to a friend. The skiff's gunner has not once taken their eyes off your hold."
