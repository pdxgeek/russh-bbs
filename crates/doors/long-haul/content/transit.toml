[[event]]
id = "trapped_miners"
family = "distress"
title = "Miners trapped in a dead station"
text = "A dead claim station, power gone, with a handful of voices on the emergency band. A cutting torch could open the outer ring in minutes; someone has to go in."
weight = 4
mods = [{ req = { kind = "economy", economy = "mining" }, pm = 1800 }]

[[event.options]]
label = "Lead a party aboard"
[[event.options.outcomes]]
weight = 100
text = "You go through the ring and into the dark. The station is not empty."
effects = [{ kind = "board", derelict = "claim_station" }, { kind = "standing", faction = "miners", amount = 2 }]

[[event.options]]
label = "Talk them out through the lock"
req = [{ kind = "role", role = "face", min = 2 }]
needs = "a face of skill 2 or better"
[[event.options.outcomes]]
weight = 90
text = "Your face coaxes them out one by one over the open channel. They come out blinking, and grateful in the practical way of people who owe you a favour."
effects = [{ kind = "standing", faction = "miners", amount = 5 }, { kind = "flag", name = "union_debt" }]
[[event.options.outcomes]]
weight = 10
text = "One of the trapped miners panics at the airlock and a pipe bursts. A bad hour, but they all come out."
effects = [{ kind = "hurt", who = "face", days = 2 }, { kind = "standing", faction = "miners", amount = 3 }]

[[event.options]]
label = "Relay the call and go on"
[[event.options.outcomes]]
weight = 100
text = "You relay their call to the nearest claim and leave the rest to the Union."
effects = [{ kind = "standing", faction = "miners", amount = 1 }]

# ---------------------------------------------------------------- pirates

[[event]]
id = "skiff_toll"
family = "pirate"
title = "A skiff wants a toll"
text = "A skiff closes from the dark side of the lane and puts a polite, practised voice on the comm. They name a toll. It is not large. They do not say what happens if you refuse."
weight = 12
mods = [{ req = { kind = "contraband", tons = 1 }, pm = 1600 }, { req = { kind = "weapons", min = 4 }, pm = 600 }, { req = { kind = "standing", faction = "free", min = 15 }, pm = 300 }]

[[event.options]]
label = "Pay the toll (200 cr)"
req = [{ kind = "cash", min = 200 }]
needs = "200 cr in the purse"
[[event.options.outcomes]]
weight = 100
text = "You pay in coin. The skiff peels off with a mock salute. Cheap, in its way."
effects = [{ kind = "credits", amount = -200 }, { kind = "scare", amount = -1 }]

[[event.options]]
label = "Talk them down"
req = [{ kind = "role", role = "face", min = 2 }]
needs = "a face of skill 2 or better"
[[event.options.outcomes]]
weight = 75
text = "Your face has them laughing in a minute and haggling in two. The toll falls to a token, and a name goes on a list of people worth leaving alone."
effects = [{ kind = "credits", amount = -50 }, { kind = "standing", faction = "free", amount = 2 }]
[[event.options.outcomes]]
weight = 25
text = "They are not in the mood for charm."
effects = [{ kind = "combat", enemy = "skiff" }]

[[event.options]]
label = "Fight"
req = [{ kind = "weapons", min = 4 }]
needs = "weapons aboard"
[[event.options.outcomes]]
weight = 100
text = "You trip the lance's capacitors and turn to face them. The skiff, to its credit, does not flinch."
effects = [{ kind = "combat", enemy = "skiff" }]

[[event.options]]
label = "Run"
[[event.options.outcomes]]
weight = 40
text = "You shove the drive hard and leave them in your wake. They fire once, for form."
effects = [{ kind = "fuel", amount = -5 }, { kind = "xp", skill = "pilot", amount = 4 }]
bonus = [{ req = { kind = "role", role = "pilot", min = 3 }, add = 40 }]
[[event.options.outcomes]]
weight = 60
text = "They are faster than they look. The first shot is a warning. The second is not."
effects = [{ kind = "combat", enemy = "skiff" }]

