[[event]]
id = "station_breach"
family = "distress"
title = "A breached habitat"
text = "A small habitat on a rock, one wall peeled open like a ration tin. A handful of people on a patched lock, arguing about who goes first."
weight = 5
when = [{ kind = "hazard", hazard = "debris" }]

[[event.options]]
label = "Send your engineer to weld the seam"
req = [{ kind = "role", role = "engineer", min = 3 }]
needs = "an engineer of skill 3 or better"
[[event.options.outcomes]]
weight = 90
text = "Four hours, a lot of welding rod and a very polite apology to the rock. The habitat reseals and sends you a crate of preserved fruit."
effects = [{ kind = "cargo", good = "vat_protein", tons = 4 }, { kind = "standing", faction = "miners", amount = 3 }, { kind = "xp", skill = "engineer", amount = 8 }]
[[event.options.outcomes]]
weight = 10
text = "The seam holds, but the rock shifts. You lose a day pulling your engineer clear."
effects = [{ kind = "days", amount = 1 }, { kind = "hurt", who = "engineer", days = 3 }]

[[event.options]]
label = "Donate hull plate (8 hull points)"
[[event.options.outcomes]]
weight = 100
text = "You cut plating from your own hull. The habitat survives, and your ship feels it."
effects = [{ kind = "hull", amount = -8 }, { kind = "standing", faction = "miners", amount = 4 }]

[[event.options]]
label = "Steer on"
[[event.options.outcomes]]
weight = 100
text = "You steer on. In the rear scope, the peeled wall flashes once and goes quiet."
effects = [{ kind = "scare", amount = -1 }]

