effects = [{ kind = "fuel", amount = -6 }, { kind = "hull", amount = -6 }, { kind = "xp", skill = "pilot", amount = 8 }]

[[event.options]]
label = "Pay them off (400 cr)"
req = [{ kind = "cash", min = 400 }]
needs = "400 cr in the purse"
[[event.options.outcomes]]
weight = 100
text = "She counts it twice, and then goes looking for easier prey. Your crew will remember who paid."
effects = [{ kind = "credits", amount = -400 }, { kind = "treat", amount = 2 }]

