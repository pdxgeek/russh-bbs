[[event]]
id = "medical_beacon"
family = "distress"
title = "A medical beacon"
text = "A hospital freighter's beacon, thin and stuttering. The message is on a loop: fever aboard, stores spent, any physician welcome."
weight = 6
once = "plague_cured"

[[event.options]]
label = "Send your medic across"
req = [{ kind = "role", role = "medic", min = 2 }]
needs = "a medic of skill 2 or better"
[[event.options.outcomes]]
weight = 80
text = "Two days of triage across the airlock. Your medic comes back hollow-eyed and proud, with a ward-sister's blessing and a lot of bad stories."
effects = [{ kind = "flag", name = "plague_cured" }, { kind = "credits", amount = 350 }, { kind = "standing", faction = "church", amount = 4 }, { kind = "treat", amount = 2 }, { kind = "days", amount = 1 }]
[[event.options.outcomes]]
weight = 20
text = "The fever takes your medic's hands too, for a week. The ward lives; your medic mends."
effects = [{ kind = "flag", name = "plague_cured" }, { kind = "hurt", who = "medic", days = 5 }, { kind = "standing", faction = "church", amount = 3 }]

[[event.options]]
label = "Leave a case of medicine on the airlock"
req = [{ kind = "good", good = "medicine", tons = 3 }]
needs = "3 t of medicine aboard"
[[event.options.outcomes]]
weight = 100
text = "You tip three tons into the lock and burn away before the fever knows your name. The ward thanks you across a dead comm."
effects = [{ kind = "cargo", good = "medicine", tons = -3 }, { kind = "standing", faction = "church", amount = 3 }, { kind = "standing", faction = "league", amount = 2 }]

[[event.options]]
label = "Keep your distance"
[[event.options.outcomes]]
weight = 100
text = "The beacon fades behind you. Nobody on the bridge says anything for a while."
effects = [{ kind = "scare", amount = -1 }]

