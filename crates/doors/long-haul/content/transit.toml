[[event]]
id = "false_distress"
family = "distress"
title = "A distress call that is too tidy"
text = "The call is clean, polite and perfectly framed. A real emergency does not know how to stand in the light that well."
weight = 8
mods = [{ req = { kind = "contraband", tons = 1 }, pm = 1400 }]

[[event.options]]
label = "Answer it and go in"
[[event.options.outcomes]]
weight = 100
text = "A raider drops out of the debris. The call was bait, and you took it."
effects = [{ kind = "combat", enemy = "raider" }]

[[event.options]]
label = "Run a scan first"
req = [{ kind = "scanner", min = 1 }]
needs = "a working scanner"
[[event.options.outcomes]]
weight = 85
text = "Two hulls, one cold, one warm, and a lane of mines in between. You swing wide and let the bait sit."
effects = [{ kind = "xp", skill = "pilot", amount = 5 }]
[[event.options.outcomes]]
weight = 15
text = "The scan pings back and the raider hears it. A short, hard chase, with the first shot yours."
effects = [{ kind = "combat", enemy = "skiff" }]

[[event.options]]
label = "Show your guns and hold course"
req = [{ kind = "weapons", min = 4 }]
needs = "weapons aboard"
[[event.options.outcomes]]
weight = 70
text = "You run the lance out, hold your lane and say nothing. The trap, reading your armed silhouette, finds somewhere else to be."
effects = [{ kind = "standing", faction = "free", amount = 1 }]
[[event.options.outcomes]]
weight = 30
text = "They like their odds. The first shot is theirs."
effects = [{ kind = "combat", enemy = "skiff" }]

[[event.options]]
label = "Ignore the call"
[[event.options.outcomes]]
weight = 100
text = "You change course. If it was real, you will carry it. If it was not, you will not."
effects = []

