[[event]]
id = "warden_challenge_a"
family = "signal"
title = "A gate warden asks for a name"
text = "A challenge comes in on the old gate frequency, in a voice made of three voices. It asks for your name, your cargo and your purpose. The ring of a dead gate hangs ahead of you, and it does not look dead enough to ignore."
weight = 4
mods = [{ req = { kind = "flag", name = "tithe_forgiven" }, pm = 2500 }, { req = { kind = "standing", faction = "church", min = 10 }, pm = 1500 }]

[[event.options]]
label = "Answer with the Church's response"
req = [{ kind = "flag", name = "tithe_forgiven" }]
needs = "a toll forgiven at a Church gate"
[[event.options.outcomes]]
weight = 100
text = "The voices pause and one of them says a name that is not yours but is meant for you. The ring parts, a little. You pass through a silence that feels like permission."
effects = [{ kind = "standing", faction = "church", amount = 6 }, { kind = "fuel", amount = 8 }, { kind = "xp", skill = "survey", amount = 10 }]

[[event.options]]
label = "Answer in the old tongue"
req = [{ kind = "skill", skill = "survey", min = 3 }]
needs = "Survey 3 or better (yours, not the crew's)"
[[event.options.outcomes]]
weight = 70
text = "You say the phrase you picked up from a dead Guild chart. The three voices become one, and say, politely, that you may pass."
effects = [{ kind = "standing", faction = "church", amount = 4 }, { kind = "xp", skill = "survey", amount = 10 }]
[[event.options.outcomes]]
weight = 30
text = "A mispronunciation. The three voices argue about it for a while and then let you go, annoyed."
effects = [{ kind = "days", amount = 1 }, { kind = "standing", faction = "church", amount = 1 }]

[[event.options]]
label = "Give a false name and a plain answer"
[[event.options.outcomes]]
weight = 60
text = "The voices consider it, and the answer is acceptable. They are always polite, up to a point."
effects = [{ kind = "days", amount = 1 }]
[[event.options.outcomes]]
weight = 40
text = "The ring knows. It says nothing, and it says it very loudly. Your instruments go out for an hour."
effects = [{ kind = "wear", amount = 70 }, { kind = "days", amount = 1 }, { kind = "scare", amount = 1 }, { kind = "standing", faction = "church", amount = -4 }]

