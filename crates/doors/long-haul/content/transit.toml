weight = 5
mods = [{ req = { kind = "role", role = "quartermaster", min = 2 }, pm = 1500 }, { req = { kind = "scanner", min = 1 }, pm = 1200 }]

[[event.options]]
label = "Have your quartermaster match the hold"
req = [{ kind = "role", role = "quartermaster", min = 2 }]
needs = "a quartermaster of skill 2 or better"
[[event.options.outcomes]]
weight = 70
