# Transit events: what happens between one system and the next. Each is a scene with options;
# an option with `req` is closed to a captain who does not meet it, and says why (`needs`).
# `when` filters where an event can happen; `mods` scale its weight in per-mille (3000 triples
# it) by the system, the cargo, the standing and the crew; `once` names a flag that makes it
# happen at most once. An outcome's `bonus` adds weight when a crew mix or skill tilts the draw.
# Every event keeps at least one option with no requirement, so none is a dead end.

flags = [
  "heard_signal", "gate_song", "helped_pilgrims", "betrayed_pirates", "owes_haven",
  "navy_favor", "league_snub", "ark_map", "union_debt", "church_mark", "ghost_log",
  "cartel_contact", "stowaway_taken", "wreck_salvaged", "plague_cured", "guild_pass",
  "ghost_ship_seen", "drive_whisper", "beacon_fixed", "hunted_fugitive",
  "black_crate", "tithe_forgiven", "lantern_pact", "drive_scar", "relay_tap", "salvage_rights",
  "marshal_grudge", "fugitive_pact", "reliquary_vow", "archive_key", "wardens_truce",
]

# ---------------------------------------------------------------- distress

[[event]]
id = "dead_freighter"
family = "distress"
title = "A freighter with a dead drive"
text = "A mid-size hauler drifts across the lane, running lights blinking the distress code. Her master is on the comm, calm in the way of someone who has been calm for hours."
weight = 8
mods = [{ req = { kind = "role", role = "engineer", min = 2 }, pm = 1800 }]

[[event.options]]
label = "Help them fix the drive"
req = [{ kind = "role", role = "engineer", min = 2 }]
needs = "an engineer of skill 2 or better"
[[event.options.outcomes]]
weight = 85
text = "Your engineer is across in an hour, elbow-deep in their coolant loop. The master pays what the ship can spare and tells every dock in the sector."
effects = [{ kind = "credits", amount = 420 }, { kind = "standing", faction = "miners", amount = 3 }]
[[event.options.outcomes]]
weight = 15
text = "The fix holds just long enough for the master to curse you and thank you in one breath. A small purse, a cold coffee."
effects = [{ kind = "credits", amount = 120 }]

[[event.options]]
label = "Offer a tow to the next dock"
[[event.options.outcomes]]
weight = 60
text = "A long slow tow, a lot of fuel, and a very grateful master at the other end."
effects = [{ kind = "fuel", amount = -7 }, { kind = "days", amount = 1 }, { kind = "credits", amount = 300 }, { kind = "standing", faction = "league", amount = 2 }]
[[event.options.outcomes]]
weight = 40
text = "The tow cable parts halfway and you both lose a day. They thank you anyway."
effects = [{ kind = "fuel", amount = -5 }, { kind = "days", amount = 2 }]

[[event.options]]
label = "Strip her hold while she waits"
[[event.options.outcomes]]
weight = 55
text = "Quick hands and a closed comm. You take what the cargo bay will give, and the master watches you do it."
effects = [{ kind = "cargo", good = "parts", tons = 5 }, { kind = "standing", faction = "miners", amount = -6 }, { kind = "standing", faction = "league", amount = -3 }]
[[event.options.outcomes]]
weight = 45
text = "Her master was not as helpless as advertised. A burst across your bow and a promise to remember your hull number."
effects = [{ kind = "hull", amount = -6 }, { kind = "standing", faction = "miners", amount = -4 }]

[[event.options]]
label = "Note it on the log and move on"
[[event.options.outcomes]]
weight = 100
text = "You log the position for the patrol and burn on. Someone else will answer."
effects = []

