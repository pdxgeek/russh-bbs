effects = [{ kind = "hull", amount = -8 }, { kind = "wear", amount = 90 }, { kind = "flag", name = "drive_scar" }, { kind = "scare", amount = 1 }]

# ----

[[event]]
id = "coil_chorus_a"
family = "drive"
title = "The coils begin to sing"
text = "Every coil on the ship hums the same note, rising slowly. Pens skitter on the chart table. If it climbs much further something will shatter, and it will not be the coils."
weight = 7
mods = [{ req = { kind = "role", role = "scientist", min = 2 }, pm = 1500 }, { req = { kind = "flag", name = "drive_whisper" }, pm = 2000 }]

[[event.options]]
label = "Retune the coils with a scientist"
req = [{ kind = "role", role = "scientist", min = 2 }]
needs = "a scientist of skill 2 or better"
[[event.options.outcomes]]
weight = 80
text = "Your scientist listens, then flips three breakers in an order that seems to make no sense. The chorus drops to a hum, then to silence. A good night's work."
effects = [{ kind = "xp", skill = "engineer", amount = 8 }, { kind = "xp", skill = "survey", amount = 6 }, { kind = "treat", amount = 1 }]
[[event.options.outcomes]]
weight = 20
text = "The retune works, though a coil cracks at the last moment. The note has gone, and the spare coil with it."
effects = [{ kind = "cargo", good = "coils", tons = -1 }, { kind = "xp", skill = "engineer", amount = 8 }]

[[event.options]]
label = "Fly through it at an angle"
req = [{ kind = "role", role = "pilot", min = 3 }]
needs = "a pilot of skill 3 or better"
[[event.options.outcomes]]
weight = 90
text = "Your pilot yaws the ship across the lane, and the resonance slides out of tune. The crew stare at the viewport and clap."
effects = [{ kind = "fuel", amount = -4 }, { kind = "xp", skill = "pilot", amount = 8 }, { kind = "treat", amount = 1 }]
[[event.options.outcomes]]
weight = 10
text = "It slips, then catches. A bad minute with the hull ringing like a bell."
effects = [{ kind = "hull", amount = -6 }, { kind = "xp", skill = "pilot", amount = 8 }]

[[event.options]]
label = "Cut the drive and drift"
[[event.options.outcomes]]
weight = 100
text = "You cut power and wait out the song. A day lost, but nothing breaks."
effects = [{ kind = "days", amount = 1 }, { kind = "fuel", amount = -2 }]

# ----

[[event]]
id = "ghost_thrust_a"
family = "drive"
title = "A thrust that is not yours"
text = "The ship accelerates, gently, without a command from the drive. The log shows nothing. The log has no entry for it, and the log is the only thing aboard that looks calm."
weight = 4
when = [{ kind = "flag", name = "drive_whisper" }]

[[event.options]]
label = "Have your scientist chase the signal"
req = [{ kind = "role", role = "scientist", min = 3 }]
needs = "a scientist of skill 3 or better"
[[event.options.outcomes]]
weight = 70
text = "Your scientist traces the push to a bearing in the old gate ring. A message in the push, if you know how to read one. They write it down and do not say what it says."
effects = [{ kind = "survey", value = 420 }, { kind = "xp", skill = "survey", amount = 12 }, { kind = "scare", amount = 1 }]
[[event.options.outcomes]]
weight = 30
text = "Nothing is found, and the push stops as if it were listening. The crew do not sleep."
effects = [{ kind = "scare", amount = 2 }]

[[event.options]]
label = "Lean into it and ride the push"
[[event.options.outcomes]]
weight = 60
text = "You ride the push for six hours. When it fades, you have gained more than you burned."
effects = [{ kind = "fuel", amount = 6 }, { kind = "days", amount = 1 }]
[[event.options.outcomes]]
weight = 40
text = "It turns, swings you a quarter-circle off your course, and releases you at a dead star. A day lost, and a scare."
effects = [{ kind = "days", amount = 2 }, { kind = "scare", amount = 1 }]

[[event.options]]
label = "Shut the drive down and wait"
[[event.options.outcomes]]
weight = 100
text = "You shut down and wait. The push goes on a while and then stops, as if it had been patient and was no longer."
effects = [{ kind = "days", amount = 1 }, { kind = "treat", amount = -1 }]

# ----

[[event]]
id = "dirty_injectors_a"
family = "drive"
title = "Dirty injectors, thin fuel"
text = "The last fuel you took was cut with something. The injectors are clogging, the drive coughs and the thrust sags. You can limp, clean the lines, or burn the cheap stuff hot and hope."
weight = 8
mods = [{ req = { kind = "thirsty", below = 30 }, pm = 1800 }, { req = { kind = "flag", name = "drive_scar" }, pm = 1800 }]

[[event.options]]
label = "Strip and clean the injectors"
req = [{ kind = "role", role = "engineer", min = 1 }]
needs = "an engineer aboard"
[[event.options.outcomes]]
weight = 85
text = "A grubby day with a toothbrush and solvent. The injectors run clean, and your engineer is smug."
effects = [{ kind = "days", amount = 1 }, { kind = "xp", skill = "engineer", amount = 6 }]
[[event.options.outcomes]]
weight = 15
text = "A seal fails during the strip, spraying the engine room. The injectors are clean, and so is the engineer's temper."
effects = [{ kind = "days", amount = 1 }, { kind = "hurt", who = "engineer", days = 2 }]

[[event.options]]
label = "Burn it hot and hope"
[[event.options.outcomes]]
weight = 55
text = "The injectors clear themselves in a brief belch of black smoke. You lose a bit of everything and nothing important."
effects = [{ kind = "wear", amount = 50 }, { kind = "fuel", amount = -3 }]
[[event.options.outcomes]]
weight = 45
text = "The cheap fuel burns hotter than expected, and the nozzle blisters."
effects = [{ kind = "wear", amount = 120 }, { kind = "hull", amount = -6 }, { kind = "flag", name = "drive_scar" }]

[[event.options]]
label = "Limp to the next dock on a fraction"
[[event.options.outcomes]]
weight = 100
text = "Slow, cautious flight. You make the dock, and everybody on board is a little poorer for it."
effects = [{ kind = "days", amount = 2 }, { kind = "fuel", amount = -4 }]

# ----

[[event]]
id = "rod_fever_a"
family = "drive"
title = "A restless reactor"
text = "The reactor's temperature graph has started to wander. Not up, not down, but sideways, in a slow figure-eight. Your engineer says it is nothing. Your engineer is looking at it a great deal for nothing."
weight = 6
mods = [{ req = { kind = "good", good = "reactor_rods", tons = 1 }, pm = 1700 }, { req = { kind = "role", role = "engineer", min = 3 }, pm = 1200 }]

[[event.options]]
label = "Swap a rod from the cargo"
req = [{ kind = "good", good = "reactor_rods", tons = 1 }]
needs = "a ton of reactor rods"
[[event.options.outcomes]]
weight = 90
text = "A new rod seated, the old one dumped into a cold pod. The figure-eight flattens and the whole ship breathes."
effects = [{ kind = "cargo", good = "reactor_rods", tons = -1 }, { kind = "treat", amount = 1 }, { kind = "xp", skill = "engineer", amount = 6 }]
[[event.options.outcomes]]
weight = 10
text = "The new rod is a dud. You have bought nothing but a short, frightening evening."
effects = [{ kind = "cargo", good = "reactor_rods", tons = -1 }, { kind = "scare", amount = 1 }, { kind = "wear", amount = 40 }]

[[event.options]]
label = "Let your engineer talk it down"
req = [{ kind = "role", role = "engineer", min = 3 }]
needs = "an engineer of skill 3 or better"
[[event.options.outcomes]]
weight = 85
text = "Your engineer coaxes the reactor back into line over nine hours, and refuses breakfast. When it settles they are almost fond of it."
effects = [{ kind = "days", amount = 1 }, { kind = "xp", skill = "engineer", amount = 12 }, { kind = "treat", amount = 1 }]
[[event.options.outcomes]]
weight = 15
text = "It settles, then spikes. Your engineer takes a flash burn on the hand and holds the line."
effects = [{ kind = "days", amount = 1 }, { kind = "hurt", who = "engineer", days = 3 }, { kind = "xp", skill = "engineer", amount = 12 }]

[[event.options]]
label = "Run on half power until it quiets"
[[event.options.outcomes]]
weight = 100
text = "You run slow, two extra days, listening to the engineers listening to the reactor. It quiets by itself, which is no comfort."
effects = [{ kind = "days", amount = 2 }, { kind = "fuel", amount = -3 }, { kind = "scare", amount = 1 }]

