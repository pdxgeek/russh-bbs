[[event]]
id = "lifepod"
family = "distress"
title = "A lifepod, ticking"
text = "A scorched lifepod tumbles past, its homing light the colour of a dying ember. Someone inside is knocking on the hull, slowly."
weight = 7

[[event.options]]
label = "Take the survivor aboard"
[[event.options.outcomes]]
weight = 50
text = "A half-starved deckhand with a pilot's hands and nowhere to be. They ask, very quietly, if they can stay."
effects = [{ kind = "stowaway", role = "pilot" }, { kind = "flag", name = "stowaway_taken" }]
[[event.options.outcomes]]
weight = 30
text = "A ship's engineer, burned across one arm. They ask for work before they ask for water."
effects = [{ kind = "stowaway", role = "engineer" }, { kind = "flag", name = "stowaway_taken" }]
[[event.options.outcomes]]
weight = 20
text = "The pod is empty but for a strongbox bolted under the couch. Whoever knocked took the key."
effects = [{ kind = "credits", amount = 260 }]

[[event.options]]
label = "Scan the pod before you open it"
req = [{ kind = "scanner", min = 1 }]
needs = "a working scanner"
[[event.options.outcomes]]
weight = 70
text = "Clean. You bring it in knowing what is inside: a survivor, a locked box, and a rescuer's thanks."
effects = [{ kind = "stowaway", role = "medic" }, { kind = "credits", amount = 120 }]
[[event.options.outcomes]]
weight = 30
text = "The scan finds a charge under the couch. You push the pod off with a boom and keep the shielding."
effects = [{ kind = "xp", skill = "stealth", amount = 6 }]

[[event.options]]
label = "Log it and keep going"
[[event.options.outcomes]]
weight = 100
text = "The knocking fades from the audio feed. You turn the feed off."
effects = [{ kind = "scare", amount = -1 }]

