# Boarding layouts: derelicts found in transit and the wrecks of boardable enemies. Room 0 is
# the airlock (open, empty). `lock` is the engineering level needed to cut a door open from the
# adjoining room (the captain's Engineering plus the best engineer's help). A `cache` is a
# data store only a scientist, or a captain with Surveying 3, can read.

