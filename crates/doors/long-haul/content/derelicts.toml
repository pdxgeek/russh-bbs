# Boarding layouts: derelicts found in transit and the wrecks of boardable enemies. Room 0 is
# the airlock (open, empty). `lock` is the engineering level needed to cut a door open from the
# adjoining room (the captain's Engineering plus the best engineer's help). A `cache` is a
# data store only a scientist, or a captain with Surveying 3, can read.

[[derelict]]
id = "pirate_wreck"
name = "Pirate wreck"
blurb = "A dead raider, venting slowly."
foe_name = "Survivors"
foe_hp = 8
foe_dmg = 3
rooms = [
  { name = "Airlock", text = "The outer door hangs open and the lights flicker.", exits = [1] },
  { name = "Gun deck", text = "Two gunners are still at their stations, armed and angry.", foes = 2, credits = [20, 60], exits = [0, 2, 3] },
  { name = "Bunk row", text = "Hammocks and a locker somebody forgot to lock.", credits = [40, 120], parts = 6, exits = [1] },
  { name = "Strongroom", text = "A welded door; behind it the crew's shares.", lock = 3, credits = [180, 420], exits = [1] },
]

