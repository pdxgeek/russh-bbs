title = "Absolution"
text = "The chapel keeps its secrets and its doors. Quill's last years are quiet, and the rumours stop. People take you for a quiet kind of saint, which you are not."

[[ending]]
num = 5
arc = 1
title = "The open book"
text = "Everything is told. Some marriages end, some debts are forgiven, and a fixer disappears. The city is crueller and cleaner for a season."

[[ending]]
num = 6
arc = 1
title = "A quiet sale"
text = "Ninefold gets the flock, and the flock gets nothing. You get the money, and the memory of a woman who trusted you with it."

[[ending]]
num = 7
arc = 2
title = "Partner"
text = "Dovetail goes into the dark with a new number and you go with him. He pays in parts and in trust, which is the better currency, and the harder to counterfeit."

[[ending]]
