# Fixer arcs (M4-N4): five hand-written arcs, one per fixer, seven steps each; a step is a job and its choices.
# A choice moves the character to a later step (`next`) or to an ending (`ending`). `gate` is a condition
# (see `cond.rs`): the choice is shown shut, with its reason, when the character does not meet it. `open` on a step
# gates the step itself. Flags are named once here; the order is the bit in the save: never reorder.

