# Node types (M4-N1). `role`: entry, mid or objective. `lock_pct` is the chance a node of the type is
# locked; `bias` weights the lock family as [crack, spoof, overflow]. `sec` is the type's base security.
# `watches`: a live camera feed that adds trace to every move until it is cut. `code` shows in the
# node name (for example FW-2). Objective types name the contract targets that use them.

