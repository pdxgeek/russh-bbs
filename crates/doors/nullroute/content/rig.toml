# Rig parts and the hideout (M4-N1). Each part has three upgrade levels (the cost to reach each).
# cpu: +4 cycles a day per level. memory: +4 deck memory and +1 slot per level (base 8 and 4).
# cooling: a burned run fries a part with chance 80 - 20 * level percent. iface: +5 percent success
# per level, and level 2 makes a 2-cycle script cost 1. shield: trace gains are 6 percent lower
# per level.

