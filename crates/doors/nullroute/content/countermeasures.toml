# Countermeasures (M4-N2). `num` is stable: add rows, never renumber. 20 patrols (sentries, tracers, black
# walls) and 3 wardens. `pattern` is the cycle of intents the countermeasure repeats; the first beat of a
# fight is chosen by the node, the rest are always in this order, so a pattern can be learned. Intents:
# probe (a light touch), strike (the real hit), charge (the next strike is doubled), guard (armor +3 for
# your move), seal (the family you used last cannot be used next beat), trace (starts a tracer and adds
# trace), mend (heals), counter (a break script you play is echoed back as trace). `weak` is the lock
# family whose break scripts hurt it +2. `tags` match a corporation's `cm_bias`. `drop` is the percent
# chance a defeated countermeasure leaves a fragment. A warden is hardened: only a script tuned to wardens
# hurts it (see fragments.toml, `target = "warden"`).

[[cm]]
num = 1
name = "Watchman"
kind = "sentry"
tier_min = 1
tier_max = 2
integrity = 7
armor = 0
strike = 4
weak = "crack"
pattern = ["probe", "strike", "probe", "strike"]
weight = 10
tags = []
mend = 0
drop = 30
blurb = "Walks a fixed beat. Strikes on every second step."

