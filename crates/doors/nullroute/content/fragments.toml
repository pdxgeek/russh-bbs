# Fragments (M4-N2): bits of code found on runs and combined at the workbench into scripts. `num` is stable.
# Every fragment adds to the build's power, memory and noise (negative values subtract). An `effect`
# fragment gives the script's effect; a `target` fragment tunes it to a kind of countermeasure (+3 power
# against that kind, and the only way to hurt a warden); a `modifier` changes the numbers. `rank` (1 to 3)
# is the lowest tier of network it can be found in. `weight` is the drop weight.

