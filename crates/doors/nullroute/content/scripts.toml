# Scripts (M4-N1). `num` is stable (saves store it). Families: probe, break, hide, fight, utility.
# Effects: scan map | crack spoof overflow | mask decoy reroute | jam fork purge |
#          copy plant shred cutfeed wipelogs.
# `memory` is deck memory; `noise` is the trace the script adds (before multipliers); `cycles` is its
# cost in cycles; `charges` is uses per run (0 = unlimited); `price` 0 means not for sale (starter
# scripts are owned from the first visit). `min_rep` gates the shop; `min_skill` is the skill level in
# the script's family needed to load it into the deck.

