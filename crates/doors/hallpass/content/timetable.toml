# Slots in a school day, in order. A day lists one activity per slot:
#   class:<subject>, chapel, lunch, free, after, evening, night
[[period]]
id = "first"
name = "First period"
[[period]]
id = "second"
name = "Second period"
[[period]]
id = "lunch"
name = "Lunch"
[[period]]
id = "third"
name = "Third period"
[[period]]
id = "fourth"
name = "Fourth period"
[[period]]
id = "free"
name = "Free period"
[[period]]
id = "after"
name = "After school"
[[period]]
id = "evening"
