# Storylines: multi-day arcs under the timetable. A story starts by itself when its `start`
# conditions hold. Conversations tagged with the story's id and a step move it on (`arc:ID:STEP`) or
# end it (`arc_end:ID:ENDING`); a choice that moves it to one step shuts the conversations of the
# other. An ending's own effects follow when it comes about; `world:` changes the school for everyone.

# ---------------------------------------------------------------- the prefects' ledger

[[arc]]
id = "ledger"
name = "The prefects' ledger"
blurb = "Tilly saw a prefect hide a ledger in the quad."
start = ["day>=4"]
first = "found"
[[arc.step]]
id = "found"
text = "Tilly saw Tobias Bramley hide a book. Ask her what she saw."
[[arc.step]]
id = "confront"
text = "You are going to ask Bramley about the ledger. Give it a day."
[[arc.step]]
id = "paper"
text = "You told Wren. She wants a day to check the story."
[[arc.step]]
id = "owes"
text = "Bramley is thinking about your price. Give him two days."
[[arc.step]]
id = "expose"
text = "You hold proof. Cordelia Wick is the one to bring it to."
[[arc.ending]]
id = "shrugged"
name = "Let it lie"
text = "You let it go. The ledger stays in its hiding place, and nobody is any wiser."
[[arc.ending]]
id = "returned"
name = "Put it all back"
text = "Bramley puts the confiscated things back where they came from, and you have a prefect who owes you a quiet word."
effects = ["bond:bramley:+6", "stand:lamplighters:+5", "stat:legend:+2"]
[[arc.ending]]
id = "owed"
name = "A favour owed"
text = "Bramley keeps his hiding place and you keep your silence. Neither of you will mention it again."
effects = ["know:bramley_owes", "stat:cash:+8", "bond:bramley:-3"]
[[arc.ending]]
id = "purged"
name = "The prefects stood down"
text = "Cordelia Wick takes the ledger to the headmistress herself. The Lamplighters are stood down for the term, and the corridors are quieter for it."
effects = ["world:prefects_stood_down", "stand:lamplighters:-6", "stand:the_bench:+6", "stat:legend:+10", "bond:wick:+4"]
[[arc.ending]]
id = "headline"
name = "Front page"
text = "The Ink Society prints the story under a headline in letters an inch high. For a day, everyone is reading it."
effects = ["world:paper_hijack", "stand:ink_society:+8", "stand:lamplighters:-8", "stat:legend:+6", "bond:wren:+5", "bond:bramley:-14"]

# ---------------------------------------------------------------- the light in the east wing

[[arc]]
id = "east_light"
name = "The light in the East Wing"
blurb = "Mr. Fenn says a light shows in the closed wing at night."
start = ["day>=8"]
first = "rumour"
[[arc.step]]
id = "rumour"
text = "Mr. Fenn has seen a light in the closed East Wing. Ask him about it."
[[arc.step]]
id = "watch"
text = "You offered to watch with Fenn. He wants to talk tomorrow."
[[arc.step]]
id = "told"
text = "You told Mr. Marsh about the light. He will want to talk."
[[arc.step]]
id = "seen"
text = "You saw the lantern. Fenn has something to show you."
[[arc.step]]
id = "soames"
text = "You have an old diary page. Reverend Soames might read it."
[[arc.ending]]
id = "ignored"
name = "Not your business"
text = "The light goes out, or you stop looking. Either way the East Wing keeps its secret a while longer."
effects = ["know:east_light_ignored"]
[[arc.ending]]
id = "quiet"
name = "Say nothing"
text = "You say you saw nothing, and so did Mr. Fenn. The East Wing stays closed."
effects = ["bond:fenn:+2", "know:east_light_quiet"]
[[arc.ending]]
id = "informer"
name = "The informer"
text = "Mr. Marsh posts a watch on the Old Wing and thanks you for your public spirit. The Bench hears who told."
effects = ["bond:marsh:+6", "wary:marsh:-1", "stand:lamplighters:+6", "stand:the_bench:-10"]
[[arc.ending]]
id = "secret"
name = "A secret kept"
text = "The diary page is yours alone, folded small in a pocket you do not mention."
effects = ["know:diary_page", "stat:legend:+4"]
[[arc.ending]]
id = "shared"
name = "Shared with the chaplain"
text = "Reverend Soames reads the page twice and says he will think about the East Wing, and that you did right to bring it to him."
effects = ["know:soames_trust", "know:diary_page", "bond:soames:+8", "stat:legend:+6"]

# ---------------------------------------------------------------- what happened in the east wing (H4)
# The mystery: four acts over weeks. The clues are in content/mystery.toml (found by searching
# places); the choices at the end are conversations at the step `choice`. Each ending but
# `walk_away` casts a verdict, and on the finale day the school's verdicts decide what happens
# to the East Wing for everyone.

[[arc]]
id = "the_wing"
name = "What happened in the East Wing"
blurb = "A page is missing from the register, and chalk arrows point under the school."
start = ["day>=6"]
first = "whispers"
[[arc.step]]
id = "whispers"
text = "The East Wing closed years ago and nobody will say why. Look for the torn page, and the places where the story is still told."
[[arc.step]]
id = "chalk"
text = "Somebody has been chalking arrows in the Old Wing. They all point down."
[[arc.step]]
id = "loft"
text = "A key behind the organ pipes opened the loft, and the loft gave you the tunnel map. The tunnels pass right under the East Wing."
[[arc.step]]
id = "key"
text = "You need a way into the wing from above: its key. The caretaker, the chaplain and the shed's nail all know something about it."
[[arc.step]]
id = "wing"
text = "You hold the key. The East Wing opens only after lights-out."
[[arc.step]]
id = "truth"
text = "A diary, a door bolted on the outside, and a pair of initials. Somebody signed for what happened."
[[arc.step]]
id = "choice"
text = "You know what happened to Ines Harrow. Now somebody must be trusted with it, and the whole school will live with what is decided."
[[arc.ending]]
id = "fenn"
name = "Told to the caretaker"
text = "Mr. Fenn sits on an upturned bucket for a long time. Then he says his name was Harrow once, and that he took the job to find out. He will tell the school himself."
effects = ["verdict:fenn", "bond:fenn:+10", "stat:legend:+8", "stand:strays:+4"]
[[arc.ending]]
id = "soames"
name = "Told to the chaplain"
text = "Reverend Soames takes his glasses off. 'I locked that door. I was told it was a punishment, and I have been a coward for as long as it has taken to be old.' He asks to hold a vigil."
effects = ["verdict:soames", "bond:soames:+10", "stat:legend:+6", "know:soames_forgiven"]
[[arc.ending]]
id = "vane"
name = "Told to the headmistress"
text = "Dame Vane listens without moving. She promises to see that nothing like it can happen again, and that the wing be sealed so nobody is hurt looking. You choose to believe her."
effects = ["verdict:vane", "bond:vane:+8", "wary:vane:-2", "stat:legend:+3", "stand:lamplighters:+6"]
[[arc.ending]]
id = "paper"
name = "Given to the paper"
text = "Wren reads the diary twice and says nothing for a minute. Then: 'Front page. The whole thing. Under her name.'"
effects = ["verdict:wren", "bond:wren:+8", "stand:ink_society:+8", "stat:legend:+10", "stand:lamplighters:-6"]
[[arc.ending]]
id = "bonfire"
name = "Burnt"
text = "Sol has matches and does not ask. The diary goes into the quad bonfire with a stack of old registers, and the smoke goes up straight."
effects = ["verdict:bonfire", "bond:sol:+8", "stand:the_bench:+8", "stat:legend:+4", "stat:notoriety:+8"]
[[arc.ending]]
id = "walk_away"
name = "Some things stay buried"
text = "You put the key in your pocket and the diary in a drawer, and you go and sit with Tilly in the quad. Nobody on the board will hear your voice in the matter."
effects = ["bond:tilly:+4", "stat:cool:+2"]
