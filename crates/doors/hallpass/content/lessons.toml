# Class minigames. Each subject uses one kind of puzzle (sequence, balance, vocab, timeline,
# pattern, relay) for a few rounds; the banks below feed the kinds that need words and dates.
# The made-up language and history are the school's own.

[[lesson]]
subject = "maths"
kind = "sequence"
skill = "tinker"
intro = "Mr. Pell chalks a row of numbers on the board and says one of them is missing. Continue each row."

[[lesson]]
subject = "sciences"
kind = "balance"
skill = "tinker"
intro = "Ms. Orrin sets out flasks on the bench scale. Find the pair that makes the reading."

[[lesson]]
subject = "languages"
kind = "vocab"
skill = "bluff"
intro = "Madame Thorne reads out Greywater Latin, the old school tongue, and expects you to keep up."

[[lesson]]
subject = "history"
kind = "timeline"
skill = "bluff"
intro = "Mr. Alder asks which of three events came first or last, and wants no fidgeting."

[[lesson]]
subject = "art"
kind = "pattern"
skill = "sneak"
intro = "Ms. Ruddock pins up a border design with the last tile missing. Finish the pattern."

[[lesson]]
subject = "games"
kind = "relay"
skill = "fleet"
intro = "Mr. Gale reads out three runners' times and asks who wins the relay before the whistle."

