# ---- what scouting teaches ----
# Scouting a scheme from its place or any place next to it raises its scouting level (0 to 3).
# Reaching `level` at `place` ("*" = anywhere) teaches `know`, which some locks and getaways ask for.
[[grant]]
place = "staffroom"
level = 2
know = "staff_rota"
[[grant]]
place = "organ_loft"
level = 2
know = "organ_key_spot"
[[grant]]
place = "*"
level = 2
know = "back_stairs"
