# Schemes are built from combinable parts: a TARGET, a METHOD, up to two TWISTS and a GETAWAY.
# Mischief against authority and rivals only: no target is a Stray, and nobody types a target.
# Template text may use {target} and {player}.
#
# Method fields:
#   place        where the deed happens (a target's own `place` overrides it)
#   kinds        which kinds of target it can be pointed at (staff, prefect, clique, school)
#   only         optional: restrict to these target ids
#   present      "absent" (target must be elsewhere), "present" (target must be there) or "any"
#   needs        item ids used up by the deed
#   roles        ally roles that must be recruited before it is ready
#   requires     conditions for the option to exist for this player at all
#   scout        scouting level needed before it is ready (0 to 3)
#   difficulty / legend / heat / severity   the numbers
#   big          true: a big scheme that changes the school for everyone (needs `effect`)
#   skills       [sneak phase, act phase, escape phase]

