# Clubs. Rank is the lever: any condition can ask for `rank:CLUB>=N`, so a club opens places,
# shop items, methods, twists, getaways and conversation choices, and rival clubs shut each other out.
# `ranks` is a list of [name, merit needed]; rank 1 starts at 0 merit. `event_legend` is paid per
# rank above the first when the term ends.

[[club]]
id = "chess"
name = "The Chess Circle"
blurb = "Quiet, ruthless, and housed among the library's green lamps."
place = "library"
kind = "after"
days = [1, 3]
advisor = "alder"
members = ["mags", "bramley"]
join = ["grade:maths>=60"]
rivals = ["drama"]
skill = "bluff"
ranks = [["Pawn", 0], ["Knight", 4], ["Bishop", 10], ["Rook", 18]]
event = "The Circle's term-end match is played in the library at dusk, and nobody coughs."
event_legend = 3

