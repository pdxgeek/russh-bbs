# Conversations. A talk is with one character, open when they are where you are and its `when`
# holds. Each node has choices; a choice is shut (and says what it wants) unless its `needs` hold.
# Every node keeps at least one way out that asks for nothing. Effects are the strings in
# src/effect.rs. A talk with `arc` and `step` is part of a storyline and is open only while that
# story is at that step (and `wait` days have passed since it got there).

# ---------------------------------------------------------------- staff

[[talk]]
id = "pell_tutoring"
npc = "pell"
title = "Mr. Pell offers extra tuition"
when = ["grade:maths<=68"]
first = "open"
[[talk.node]]
id = "open"
text = "Mr. Pell looks over his glasses. 'Your sums are wandering. I keep a quiet hour for such cases.'"
[[talk.node.choice]]
label = "Accept the tuition"
say = "An hour of long division later, you understand it, and he understands you better too."
effects = ["grade:maths:+6", "bond:pell:+4", "xp:tinker:1"]
[[talk.node.choice]]
label = "Ask whether the answer sheet is in the desk"
needs = ["skill:bluff>=1"]
say = "He blinks, then laughs once. 'Nice try, and clever enough that I will pretend I did not hear it.'"
effects = ["bond:pell:+1", "stat:cool:+2", "xp:bluff:1"]
[[talk.node.choice]]
label = "Say you will manage"
say = "'Do,' says Mr. Pell, and goes back to his marking."

[[talk]]
id = "orrin_gerald"
npc = "orrin"
title = "Ms. Orrin and the lab clock"
when = ["day>=2"]
first = "open"
[[talk.node]]
id = "open"
text = "Ms. Orrin is glaring at the lab clock, which has been four minutes slow since October. Gerald the skeleton seems to agree."
[[talk.node.choice]]
label = "Offer to fix it as a Robotics project"
needs = ["rank:robotics>=1"]
say = "You have it running by the end of the hour. Ms. Orrin tells the Club to use the lab whenever it likes."
effects = ["merit:robotics:+3", "bond:orrin:+4", "stat:legend:+1"]
[[talk.node.choice]]
label = "Offer to fix it, with a screwdriver you happen to carry"
needs = ["skill:tinker>=1"]
say = "The clock keeps time. Ms. Orrin does not ask where you learned that."
effects = ["bond:orrin:+3", "xp:tinker:2"]
[[talk.node.choice]]
label = "Agree that it is a disgrace"
say = "'Quite,' says Ms. Orrin, and tells you which beaker to leave alone."
effects = ["bond:orrin:+1"]

[[talk]]
id = "thorne_phrase"
npc = "thorne"
title = "Madame Thorne's favourite phrase"
when = ["grade:languages>=66"]
first = "open"
[[talk.node]]
id = "open"
text = "Madame Thorne teaches you the Greywater Latin for 'with the best will in the world', and it is lovely and deadly."
[[talk.node.choice]]
label = "Practise it until it is perfect"
say = "By the end of the period you can say a terrible thing and make it sound like a blessing."
effects = ["xp:bluff:3", "bond:thorne:+3"]
[[talk.node.choice]]
label = "Ask what it means when she says it"
say = "'It means,' says Madame Thorne, 'that I have given up.' You find you like her."
effects = ["bond:thorne:+4", "stat:cool:+1"]
[[talk.node.choice]]
label = "Nod and move on"
say = "She sighs the sigh of a woman with a hundred such pupils."

[[talk]]
id = "alder_east_wing"
npc = "alder"
title = "Mr. Alder on the closed wing"
when = ["grade:history>=60"]
first = "open"
[[talk.node]]
id = "open"
text = "Mr. Alder, lost in 1911 again, murmurs that the East Wing was closed that autumn, 'and the registers for that year are in the restricted stacks, which I did not tell you.'"
[[talk.node.choice]]
label = "Ask which register"
needs = ["bond:alder>=4"]
say = "'The brown one. Ask nicely, and perhaps a key will turn up.'"
effects = ["know:east_wing_register", "bond:alder:+2"]
[[talk.node.choice]]
label = "Say you would never go snooping"
say = "'Of course not,' says Mr. Alder, with a smile that has seen a great many pupils say it."
effects = ["bond:alder:+1"]
[[talk.node.choice]]
label = "Change the subject"
say = "He drifts back to 1066 with visible relief."

[[talk]]
id = "ruddock_mural"
npc = "ruddock"
title = "A mural for the corridor"
when = ["day>=4"]
first = "open"
[[talk.node]]
id = "open"
text = "Ms. Ruddock has a blank wall and a budget of nothing. 'Someone ought to paint it. Nothing political, nothing rude.'"
[[talk.node.choice]]
label = "Propose a tasteful mural of the lake"
say = "She weeps a little, quietly. The wall is yours."
effects = ["bond:ruddock:+4", "stat:cool:+3", "xp:sneak:1"]
[[talk.node.choice]]
label = "Propose one with a small, hidden owl in it"
needs = ["trait:known_troublemaker"]
say = "'I will not look for it,' says Ms. Ruddock, 'and I will not look for it very carefully.'"
effects = ["bond:ruddock:+2", "stand:the_bench:+3", "stat:legend:+2"]
[[talk.node.choice]]
label = "Say you cannot paint"
say = "'Nobody can,' says Ms. Ruddock. 'That is the whole joke of art.'"

[[talk]]
id = "gale_laps"
npc = "gale"
title = "Mr. Gale wants laps"
when = ["day>=1"]
once = false
cooldown = 4
first = "open"
[[talk.node]]
id = "open"
text = "Mr. Gale blows the whistle at a seagull, then at you. 'Extra laps build character. Ten minutes. Spend the nerve.'"
[[talk.node.choice]]
label = "Run the laps"
needs = ["nerve>=2"]
say = "Your lungs burn and your legs forgive you by lunch. Mr. Gale writes something down, approvingly."
effects = ["stat:nerve:-2", "xp:fleet:2", "bond:gale:+2"]
[[talk.node.choice]]
label = "Join the Rowing Club's dry-land training instead"
needs = ["rank:rowing>=1"]
say = "The Club runs the lakeside path. The Captain nods, and the Eight wins you a little respect."
effects = ["merit:rowing:+2", "xp:fleet:1", "bond:gale:+2"]
[[talk.node.choice]]
label = "Plead a sprained ankle"
say = "'Hm,' says Mr. Gale, who has met a great many ankles."

[[talk]]
id = "tarn_tab"
npc = "tarn"
title = "Mrs. Tarn and the tab"
when = ["day>=3"]
first = "open"
[[talk.node]]
id = "open"
text = "Mrs. Tarn wipes the tuck shop counter in slow circles. 'I let some children run a tab, if they have shown a bit of sense.'"
[[talk.node.choice]]
label = "Ask for a tab"
needs = ["bond:tarn>=5"]
say = "She counts out coins from the tin into your hand, 'against future good behaviour', and does not smile."
effects = ["stat:cash:+8", "bond:tarn:+1"]
[[talk.node.choice]]
label = "Help her carry the flour sacks"
say = "Your arms ache, and Mrs. Tarn gives you a bun as warm as a handshake."
effects = ["bond:tarn:+3", "stat:cash:+1"]
[[talk.node.choice]]
label = "Buy a biscuit and go"
say = "'Mind how you go,' says Mrs. Tarn."

[[talk]]
id = "soames_hymn"
npc = "soames"
title = "The missing hymn number"
when = ["day>=2"]
once = false
cooldown = 5
first = "open"
[[talk.node]]
id = "open"
text = "Reverend Soames peers at the hymn board, which is missing a number again. 'Seventy-three. It is always seventy-three.'"
[[talk.node.choice]]
label = "Find seventy-three and put it back"
say = "It was behind the radiator. Reverend Soames thanks you with great solemnity."
effects = ["bond:soames:+3", "stat:cool:+1", "stand:lamplighters:+1"]
[[talk.node.choice]]
label = "Suggest the school has been without it for a reason"
needs = ["skill:bluff>=1"]
say = "He considers this, then chuckles. 'Perhaps so.' It buys you a quiet sort of friendship."
effects = ["bond:soames:+2", "xp:bluff:1"]
[[talk.node.choice]]
label = "Leave him to it"
say = "He goes on frowning at the board."

[[talk]]
id = "vane_question"
npc = "vane"
title = "The headmistress asks a question"
when = ["file>=3", "caught>=1"]
first = "open"
[[talk.node]]
id = "open"
text = "Dame Vane looks at you for a long time. 'Somebody helped you. I would very much like to know who. I would remember it, in your favour.'"
[[talk.node.choice]]
label = "Say nothing at all"
say = "'Loyalty,' says Dame Vane. 'It is rarely rewarded, but I notice it.'"
effects = ["bond:vane:+1", "stat:cool:+2"]
next = "doubt"
[[talk.node.choice]]
label = "Name the helper from your last scheme"
say = "Dame Vane writes a name, briefly warm. The heat falls off you at once, and something else falls away with it."
effects = ["betray:last_ally", "stat:heat:-15", "stat:notoriety:-4", "bond:vane:+4", "file:named_names:1"]
[[talk.node.choice]]
label = "Say you acted alone"
say = "'Of course you did,' says Dame Vane, in the voice of someone who has heard it before."
effects = ["stat:cool:+1"]
[[talk.node]]
id = "doubt"
text = "Dame Vane folds her hands on the file. 'Then perhaps you will tell me what a pupil who says nothing was doing in the Old Wing at that hour.'"
[[talk.node.choice]]
label = "Say you were lost, charmingly"
needs = ["tag:charm"]
say = "She almost smiles. 'Lost. In a building you have been in for a fortnight.' She lets it go, at a price."
effects = ["stat:cool:+2", "bond:vane:+1", "stat:heat:-5"]
[[talk.node.choice]]
label = "Say nothing again"
say = "The silence goes on until it becomes the answer. 'You may go,' says Dame Vane, 'and so may your conscience.'"
effects = ["bond:vane:+2"]

[[talk]]
id = "marsh_clipboard"
npc = "marsh"
title = "Mr. Marsh has noticed you"
when = ["wary:marsh>=2"]
once = false
cooldown = 6
first = "open"
[[talk.node]]
id = "open"
text = "Mr. Marsh taps the clipboard against his leg. 'Your name appears more often than I would like.'"
[[talk.node.choice]]
label = "Apologise, smoothly"
needs = ["tag:charm"]
say = "You say the right words in the right order. Mr. Marsh looks faintly cheated of an argument."
effects = ["wary:marsh:-1", "stat:cool:+1"]
[[talk.node.choice]]
label = "Remind him of your fine grades"
needs = ["grades>=70"]
say = "He checks the clipboard, finds you are right, and says nothing, which is as close to an apology as he gets."
effects = ["wary:marsh:-1", "bond:marsh:+2"]
[[talk.node.choice]]
label = "Stare at the floor"
say = "He waits, then lets you go. The clipboard remembers."

# ---------------------------------------------------------------- prefects and students

[[talk]]
id = "wick_rounds"
npc = "wick"
title = "Cordelia Wick on the prefects' rounds"
when = ["standing:lamplighters>=8"]
first = "open"
[[talk.node]]
id = "open"
text = "Cordelia Wick, head prefect, has noticed you are not a nuisance. 'We could use someone who knows the corridors. Informally.'"
[[talk.node.choice]]
label = "Agree to walk the rounds with her"
needs = ["not:trait:known_troublemaker"]
say = "You walk the rounds. She teaches you which doors squeak and which prefects look the other way."
effects = ["bond:wick:+5", "stand:lamplighters:+3", "stand:the_bench:-3", "know:prefect_rounds"]
next = "notes"
[[talk.node.choice]]
label = "Keep her talking while you count the patrols"
needs = ["skill:sneak>=1"]
say = "She tells you more than she means to. You come away knowing the Lamplighters' timetable by heart."
effects = ["know:prefect_rounds", "bond:wick:+1", "xp:sneak:2"]
[[talk.node.choice]]
label = "Politely decline"
say = "'Pity,' says Wick. 'The offer will not stay open for ever.'"
[[talk.node]]
id = "notes"
text = "At the library door Wick lowers her voice. 'Somebody on the Bench keeps leaving notes about the prefects in the returns box. I would like a name. Not a punishment, I promise. A name.'"
[[talk.node.choice]]
label = "Give her Sol Marchetti's name"
say = "She writes it down very small. You feel it as soon as you have said it."
effects = ["bond:wick:+4", "stand:lamplighters:+3", "betray:sol", "stand:the_bench:-4"]
[[talk.node.choice]]
label = "Say you did not see who it was"
say = "'Hm,' says Wick. 'A friend of the Bench, then. Or a very careful liar. I will think better of one of those.'"
effects = ["bond:wick:+1"]

[[talk]]
id = "hollis_race"
npc = "hollis"
title = "Rafe Hollis wants a race"
when = ["day>=3", "bond:hollis>=-11"]
first = "open"
[[talk.node]]
id = "open"
text = "Rafe Hollis is stretching on the grass. 'Fifty yards, you and me. Loser carries the winner's books for a week.'"
[[talk.node.choice]]
label = "Race him"
needs = ["skill:fleet>=1"]
say = "You win by a stride and he is a good sport about it, mostly. Word gets round."
effects = ["bond:hollis:+6", "stand:rowing_eight:+4", "stat:cool:+3"]
next = "stakes"
[[talk.node.choice]]
label = "Race him and lose, on purpose, with style"
needs = ["tag:charm"]
say = "He wins and is insufferable, and you have a friend for life."
effects = ["bond:hollis:+5", "stand:rowing_eight:+2"]
[[talk.node.choice]]
label = "Tell him you have better things to do"
say = "'Chicken,' says Rafe, without malice, and not without a little."
effects = ["bond:hollis:-8"]
[[talk.node]]
id = "stakes"
text = "Rafe, hands on his knees, grins up at you. 'Same time next week. Winner picks the stakes. Unless you are scared.'"
[[talk.node.choice]]
label = "Raise the stakes: five coins on it"
needs = ["cash>=5"]
say = "He whistles. The Eight will be there to watch, and so will half the lower school."
effects = ["stat:cash:-5", "bond:hollis:+3", "stand:rowing_eight:+2"]
[[talk.node.choice]]
label = "Shake hands and leave it there"
say = "'Fair play,' says Rafe, and means it."
effects = ["bond:hollis:+2"]

[[talk]]
id = "hollis_amends"
npc = "hollis"
title = "Make peace with Rafe"
when = ["bond:hollis<=-12"]
once = false
cooldown = 3
first = "open"
[[talk.node]]
id = "open"
text = "Rafe Hollis will not meet your eye. 'What?' he says. 'If it is an apology, it had better be a good one.'"
[[talk.node.choice]]
label = "Buy him a biscuit and apologise properly"
needs = ["cash>=4"]
say = "He takes the biscuit. He takes the apology. He takes some time over both."
effects = ["stat:cash:-4", "bond:hollis:+10"]
[[talk.node.choice]]
label = "Walk away"
say = "He watches you go with a look you will remember."

[[talk]]
id = "crouch_stand"
npc = "crouch"
title = "Barnaby Crouch is picking on someone"
when = ["day>=2", "nerve>=3"]
first = "open"
[[talk.node]]
id = "open"
text = "Barnaby Crouch has a lower-fourth Stray by the collar in the corner of the gym. They have gone very still."
[[talk.node.choice]]
label = "Step in and tell him to put them down"
needs = ["nerve>=3"]
say = "He drops the Stray and sneers, but he does not follow you. The Strays do not forget it."
effects = ["stat:nerve:-3", "stand:strays:+8", "bond:crouch:-4", "stat:cool:+3", "know:stood_up_to_crouch"]
next = "face"
[[talk.node.choice]]
label = "Create a distraction and get the Stray away"
needs = ["skill:sneak>=1"]
say = "A dropped tray in the corridor does the trick. The Stray is gone, and so are you."
effects = ["stand:strays:+5", "xp:sneak:2", "know:stood_up_to_crouch"]
[[talk.node.choice]]
label = "Fetch a teacher"
say = "Mr. Gale arrives in under a minute, blowing the whistle. Crouch scowls at you from across the gym."
effects = ["bond:gale:+2", "stand:strays:+3", "bond:crouch:-2"]
[[talk.node]]
id = "face"
text = "Crouch lets go and squares up to you instead. 'Or what?' he says, much too loudly. Half the gym is looking."
[[talk.node.choice]]
label = "Stare him down"
needs = ["nerve>=2"]
say = "You do not blink. After a long moment he finds something very interesting on the ceiling. The whole gym saw."
effects = ["stat:nerve:-2", "stat:cool:+4", "stand:strays:+4", "bond:crouch:-2"]
[[talk.node.choice]]
label = "Walk the Stray out and say nothing"
say = "You take their arm and go. The quiet behind you is Crouch's, and for once it is not a happy one."
effects = ["stand:strays:+3"]

[[talk]]
id = "wren_column"
npc = "wren"
title = "Wren offers a column"
when = ["standing:ink_society>=6"]
first = "open"
[[talk.node]]
id = "open"
text = "Wren Okonjo needs eight hundred words by Thursday and a fresh set of eyes. 'You write, or you proofread, or you are no help at all.'"
[[talk.node.choice]]
label = "Write the column"
needs = ["skill:bluff>=1"]
say = "It runs under your initials. A teacher stops you in the corridor to say it was funny, and does not look sure it was meant to be."
effects = ["merit:paper:+3", "bond:wren:+4", "stand:ink_society:+3", "xp:bluff:2"]
[[talk.node.choice]]
label = "Proofread it"
say = "You catch four errors and a libel. Wren is quietly grateful."
effects = ["merit:paper:+1", "bond:wren:+2", "stand:ink_society:+1"]
[[talk.node.choice]]
label = "Say you are busy"
say = "'Everybody is,' says Wren."

[[talk]]
id = "sol_candle"
npc = "sol"
title = "Sol Marchetti hums a tune"
when = ["standing:the_bench>=8"]
once = false
cooldown = 3
first = "open"
[[talk.node]]
id = "open"
text = "Sol Marchetti, back row, is humming something with a rhythm like a knock. 'You know what a candle in a cellar means?' they ask, and watch your face."
[[talk.node.choice]]
label = "Say you would love to know"
needs = ["bond:sol>=4"]
say = "'Then listen,' Sol says, and taps out three slow beats and two quick on the desk."
effects = ["bond:sol:+3"]
next = "sign"
[[talk.node.choice]]
label = "Play dumb"
say = "'Suit yourself,' says Sol. The tune carries on, a little louder."
effects = ["bond:sol:+1"]
[[talk.node.choice]]
label = "Ask what it will cost"
say = "'Everything worth having does,' says Sol, and winks."
[[talk.node]]
id = "sign"
text = "'That is the sign,' says Sol. 'Knock it in the cellars and they will let you in. But once you are in, you owe the Society. Still want it?'"
[[talk.node.choice]]
label = "Learn the knock"
say = "You tap it back until Sol nods. Three slow, two quick. You will not forget it."
effects = ["know:candle_sign"]
[[talk.node.choice]]
label = "Think it over"
say = "'Take your time,' says Sol. 'Ask me again when you are ready.'"

[[talk]]
id = "sol_amends"
npc = "sol"
title = "Make it up to Sol"
when = ["bond:sol<=-30"]
once = false
cooldown = 3
first = "open"
[[talk.node]]
id = "open"
text = "Sol Marchetti sits with their back to you. 'I heard who gave me up.'"
[[talk.node.choice]]
label = "Own up and give them the last of your cash"
needs = ["cash>=10"]
say = "Sol takes the money, and says nothing, and the not-saying-anything is something."
effects = ["stat:cash:-10", "bond:sol:+16"]
[[talk.node.choice]]
label = "Leave them be"
say = "You leave. The door closes with great care."

[[talk]]
id = "pip_circuit"
npc = "pip"
title = "Pip Aldous and the half-built clock"
when = ["day>=2"]
first = "open"
[[talk.node]]
id = "open"
text = "Pip Aldous has a clock in pieces on the bench and a face that says it will not be a clock again without help."
[[talk.node.choice]]
label = "Help rebuild it"
needs = ["skill:tinker>=1"]
say = "An hour later it ticks, and so does Pip's grin."
effects = ["bond:pip:+5", "stand:workshop:+3", "xp:tinker:2", "merit:robotics:+2"]
[[talk.node.choice]]
label = "Hold the tiny screws"
say = "You hold them. They stay held. Pip is suitably grateful."
effects = ["bond:pip:+2", "stand:workshop:+1"]
[[talk.node.choice]]
label = "Admire it from a distance"
say = "'It does look better in pieces,' says Pip."

[[talk]]
id = "mags_notes"
npc = "mags"
title = "Marguerite Lund notices everything"
when = ["day>=2"]
once = false
cooldown = 6
first = "open"
[[talk.node]]
id = "open"
text = "Marguerite Lund puts her pencil down. 'You were in three places on Tuesday. I counted. Do not worry; I am only curious.'"
[[talk.node.choice]]
label = "Trade a secret for one of hers"
needs = ["bond:mags>=4"]
say = "She tells you which prefect is afraid of the dark. You tell her something you will regret by supper."
effects = ["bond:mags:+3", "know:prefect_afraid"]
[[talk.node.choice]]
label = "Offer her a spare pencil"
say = "She takes it, delighted. 'Not many people notice I am out.'"
effects = ["bond:mags:+3", "stand:ink_society:+1"]
[[talk.node.choice]]
label = "Deny everything"
say = "'Interesting,' says Marguerite, and writes it down."

[[talk]]
id = "tilly_lost"
npc = "tilly"
title = "Tilly Brandt is lost on purpose"
when = ["day>=2"]
once = false
cooldown = 5
first = "open"
[[talk.node]]
id = "open"
text = "Tilly Brandt sits very still on the stairs. 'I am not lost,' she says. 'I am hiding from Crouch. It is a different thing.'"
[[talk.node.choice]]
label = "Sit with her until the coast is clear"
say = "You sit with her for a while. She tells you the best hiding places in the school, as a gift."
effects = ["bond:tilly:+4", "stand:strays:+3", "know:hiding_places"]
[[talk.node.choice]]
label = "Offer her a place at the Chess Circle"
needs = ["rank:chess>=1"]
say = "She looks startled, then thrilled, then terrified, in that order."
effects = ["bond:tilly:+3", "stand:strays:+2", "merit:chess:+1"]
[[talk.node.choice]]
label = "Tell her it will be fine"
say = "'You do not know that,' says Tilly, 'but thank you.'"
effects = ["bond:tilly:+1"]

[[talk]]
id = "fenn_key"
npc = "fenn"
title = "Mr. Fenn, in passing"
when = ["day>=5", "standing:the_bench>=6"]
first = "open"
[[talk.node]]
id = "open"
text = "Mr. Fenn does not look up from the lock he is oiling. 'People who go where they should not,' he says, 'had better know when I do my rounds.'"
[[talk.node.choice]]
label = "Ask when he does his rounds"
needs = ["bond:fenn>=3"]
say = "He tells you, slowly, as though reading it off the back of his eyelids."
effects = ["know:caretaker_rounds", "bond:fenn:+1"]
[[talk.node.choice]]
label = "Offer to hold the torch"
say = "'Good of you,' he says, and hands it over without looking."
effects = ["bond:fenn:+3"]
[[talk.node.choice]]
label = "Say nothing, and look innocent"
say = "'Mm,' says Mr. Fenn."

[[talk]]
id = "bramley_chess"
npc = "bramley"
title = "Tobias Bramley sets up the board"
when = ["rank:chess>=1"]
once = false
cooldown = 4
first = "open"
[[talk.node]]
id = "open"
text = "Tobias Bramley, prefect and Circle regular, has a board set up and the look of a man ready to be beaten politely."
[[talk.node.choice]]
label = "Play him"
say = "It is a long game and a good one. He loses, and says thank you in the voice of a person who will remember it."
effects = ["merit:chess:+2", "bond:bramley:+3", "xp:bluff:1"]
[[talk.node.choice]]
label = "Let him win"
needs = ["tag:charm"]
say = "He wins by a hair, and glows. A prefect in your debt is a handy thing."
effects = ["bond:bramley:+4", "stand:lamplighters:+2"]
[[talk.node.choice]]
label = "Decline"
say = "He packs the board away with neat, disappointed hands."

# ---------------------------------------------------------------- storyline: the prefects' ledger

[[talk]]
id = "ledger_tilly"
npc = "tilly"
title = "Tilly has something to tell you"
arc = "ledger"
step = "found"
first = "open"
[[talk.node]]
id = "open"
text = "Tilly Brandt tugs your sleeve. 'I was hiding behind the sundial, and Tobias Bramley hid a book under the third bench. A ledger. He wrote in it, then looked around like a thief.'"
[[talk.node.choice]]
label = "Ask Bramley about it, quietly"
say = "Tilly nods. 'Give him a day to be less nervous.'"
effects = ["arc:ledger:confront", "bond:tilly:+2"]
[[talk.node.choice]]
label = "Take it to Wren at the paper"
say = "Tilly beams. 'Wren will know what to do with it.'"
effects = ["arc:ledger:paper", "bond:tilly:+2"]
[[talk.node.choice]]
label = "Tell her to forget it"
say = "'If you say so,' says Tilly, doubtfully."
effects = ["arc_end:ledger:shrugged"]

[[talk]]
id = "ledger_bramley"
npc = "bramley"
title = "Ask Bramley about the ledger"
arc = "ledger"
step = "confront"
wait = 1
first = "open"
[[talk.node]]
id = "open"
text = "Tobias Bramley goes the colour of old paper. 'What ledger? That is not a ledger. It is a... record of lost property.'"
[[talk.node.choice]]
label = "Hint that you might want a cut to keep quiet"
needs = ["not:trait:teachers_pet"]
say = "Bramley swallows. 'Give me two days. I will see what I can do.'"
effects = ["arc:ledger:owes", "stat:heat:+2"]
[[talk.node.choice]]
label = "Tell him to put every last thing back"
say = "He nods, quickly, shamed and relieved. 'I will. I will do it tonight.'"
effects = ["arc_end:ledger:returned"]
[[talk.node.choice]]
label = "Say you were only curious"
say = "He laughs too loudly, and you leave it there."
effects = ["arc_end:ledger:shrugged"]

[[talk]]
id = "ledger_wren"
npc = "wren"
title = "Wren and the ledger"
arc = "ledger"
step = "paper"
wait = 1
first = "open"
[[talk.node]]
id = "open"
text = "Wren Okonjo has pinned three scraps of paper to the pasteboard. 'It checks out. I can run it, or you can take the proof to the head prefect first. Which is it?'"
[[talk.node.choice]]
label = "Run it as the front page"
needs = ["rank:paper>=1"]
say = "'Only a paper hand can authorise a front page,' Wren says, and starts setting type."
effects = ["arc_end:ledger:headline"]
[[talk.node.choice]]
label = "Take the proof to Cordelia Wick first"
say = "Wren hands over the scraps. 'Fair. Give her a day, then I print.'"
effects = ["arc:ledger:expose", "bond:wren:+1"]
[[talk.node.choice]]
label = "Say you were mistaken"
say = "'Pity,' says Wren, and unpins the scraps one by one."
effects = ["arc_end:ledger:shrugged", "bond:wren:-2"]

[[talk]]
id = "ledger_owes"
npc = "bramley"
title = "Bramley has your price"
arc = "ledger"
step = "owes"
wait = 2
first = "open"
[[talk.node]]
id = "open"
text = "Bramley slides an envelope across the table without looking at it. 'That is all I have. Do we have an understanding?'"
[[talk.node.choice]]
label = "Take the money and keep quiet"
say = "You pocket it. He breathes out like a deflating balloon."
effects = ["arc_end:ledger:owed"]
[[talk.node.choice]]
label = "Take the money, then take the ledger to Wick anyway"
say = "He sees it in your face a moment too late. 'You... you did not.'"
effects = ["stat:cash:+8", "betray:bramley", "arc:ledger:expose"]

[[talk]]
id = "ledger_wick"
npc = "wick"
title = "Take the ledger to Cordelia Wick"
arc = "ledger"
step = "expose"
wait = 1
first = "open"
[[talk.node]]
id = "open"
text = "Cordelia Wick reads the ledger from first page to last, jaw tightening. 'This is going to the headmistress. Tonight. Thank you for bringing it to me and not the paper.'"
[[talk.node.choice]]
label = "Let her take it"
say = "She takes it, and her hand is steady. 'You have done the school a service.'"
effects = ["arc_end:ledger:purged"]
[[talk.node.choice]]
label = "Take it back and walk away"
say = "'That is not up to you,' says Wick, but you are already gone."
effects = ["arc_end:ledger:shrugged", "bond:wick:-4"]

# ---------------------------------------------------------------- storyline: the light in the east wing

[[talk]]
id = "light_fenn"
npc = "fenn"
title = "Mr. Fenn has seen something"
arc = "east_light"
step = "rumour"
first = "open"
[[talk.node]]
id = "open"
text = "Mr. Fenn speaks without turning from his work. 'A light in the East Wing. Three nights running. Nobody has a key to that wing but me, and I did not.'"
[[talk.node.choice]]
label = "Offer to watch with him"
say = "'Hm,' says Mr. Fenn. 'Come and find me tomorrow.'"
effects = ["arc:east_light:watch", "bond:fenn:+3"]
[[talk.node.choice]]
label = "Tell Mr. Marsh about it"
say = "'You do that,' says Mr. Fenn, and does not say another word."
effects = ["arc:east_light:told", "bond:fenn:-3"]
[[talk.node.choice]]
label = "Leave it alone"
say = "'Wise,' says Mr. Fenn."
effects = ["arc_end:east_light:ignored"]

[[talk]]
id = "light_watch"
npc = "fenn"
title = "Fenn and the watch"
arc = "east_light"
step = "watch"
wait = 1
first = "open"
[[talk.node]]
id = "open"
text = "Mr. Fenn has a lantern, a flask and a plan. 'Tonight, after lights-out, the old wing passage. Do not be seen. Are you in?'"
[[talk.node.choice]]
label = "Go and look, with Fenn"
needs = ["nerve>=2"]
say = "You creep through the Old Wing at Fenn's elbow. At the far end of the passage a faint yellow light is moving."
effects = ["arc:east_light:seen", "stat:nerve:-2", "stat:notoriety:+1"]
[[talk.node.choice]]
label = "Say you saw nothing and go to bed"
say = "'No harm done,' says Mr. Fenn, and means it."
effects = ["arc_end:east_light:quiet"]

[[talk]]
id = "light_told"
npc = "marsh"
title = "Mr. Marsh listens to your report"
arc = "east_light"
step = "told"
wait = 1
first = "open"
[[talk.node]]
id = "open"
text = "Mr. Marsh writes all of it on the clipboard. 'A light. In a closed wing. At night. This will need watching.'"
[[talk.node.choice]]
label = "Offer to keep watch for him"
say = "'Public spirit,' says Mr. Marsh, and writes your name in the margin, in pen."
effects = ["arc_end:east_light:informer"]
[[talk.node.choice]]
label = "Say no more"
say = "He nods and lets you go. The clipboard keeps the rest."
effects = ["arc_end:east_light:ignored"]

[[talk]]
id = "light_seen"
npc = "fenn"
title = "Fenn has something to show you"
arc = "east_light"
step = "seen"
wait = 1
first = "open"
[[talk.node]]
id = "open"
text = "Mr. Fenn holds out a single brittle page. 'The light was a lantern on a hook. This was under it. A schoolgirl's diary, from the year the wing closed.'"
[[talk.node.choice]]
label = "Take the page to Reverend Soames"
say = "'He is the only one who might know what to do with it,' says Mr. Fenn."
effects = ["arc:east_light:soames", "bond:fenn:+2"]
[[talk.node.choice]]
label = "Keep the page to yourself"
say = "He hesitates, then hands it over. 'Mind it.'"
effects = ["arc_end:east_light:secret"]

[[talk]]
id = "light_soames"
npc = "soames"
title = "Reverend Soames reads the page"
arc = "east_light"
step = "soames"
wait = 1
first = "open"
[[talk.node]]
id = "open"
text = "Reverend Soames reads the page by the chapel window, then again. His voice is not quite steady. 'Where did you find this?'"
[[talk.node.choice]]
label = "Tell him the whole story"
say = "He listens without interrupting. At the end he folds the page with great care."
effects = ["arc_end:east_light:shared"]
[[talk.node.choice]]
label = "Say you found it in the chapel"
needs = ["skill:bluff>=1"]
say = "He looks at you for a long moment, then lets it pass."
effects = ["arc_end:east_light:quiet"]
[[talk.node.choice]]
label = "Take the page back and go"
say = "He lets you take it, and says nothing, which is its own sort of answer."
effects = ["arc_end:east_light:secret"]

# ---------------------------------------------------------------- after the stories (they read the school and your deeds)

[[talk]]
id = "wick_aftermath"
npc = "wick"
title = "Cordelia Wick, after the stand-down"
when = ["world:prefects_stood_down"]
first = "open"
[[talk.node]]
id = "open"
text = "Cordelia Wick looks tired and strangely lighter. The Lamplighters have been stood down for the term, and the corridors are full of people who are not sure how to behave."
[[talk.node.choice]]
label = "Tell her it took nerve to bring the ledger in"
needs = ["ended:ledger@purged"]
say = "She looks at you for a moment. 'You knew who to bring it to. I will not forget that.'"
effects = ["bond:wick:+4", "stat:cool:+2"]
[[talk.node.choice]]
label = "Offer to help the Lamplighters find their feet"
say = "'That is kind,' says Wick. 'Somebody ought to.'"
effects = ["stand:lamplighters:+2", "bond:wick:+2"]
[[talk.node.choice]]
label = "Keep out of it"
say = "She nods and goes back to nothing in particular."

[[talk]]
id = "wren_scoop"
npc = "wren"
title = "Wren and the issue that sold out"
when = ["ended:ledger@headline"]
first = "open"
[[talk.node]]
id = "open"
text = "Wren Okonjo is counting coins into an envelope. 'Every copy gone by lunch. The ledger issue. Half of that is yours.'"
[[talk.node.choice]]
label = "Take your share"
say = "It is not a fortune, but it is the first money you have earned by being right."
effects = ["stat:cash:+8", "bond:wren:+2"]
[[talk.node.choice]]
label = "Ask her to put it toward the next issue"
say = "She puts the envelope in the press drawer with a look you will treasure."
effects = ["bond:wren:+5", "stand:ink_society:+3", "merit:paper:+2"]
[[talk.node.choice]]
label = "Say it was her paper, not yours"
say = "'False modesty,' says Wren, 'but welcome.'"

# ---------------------------------------------------------------- on-ramps (H4 balance)
# H2's simulation showed nobody joining the paper or the Candle Society: nothing early raised the
# standing they asked for. These two are the first conversations that do.

[[talk]]
id = "wren_tryout"
npc = "wren"
title = "Wren needs a proofreader"
when = ["day>=2"]
first = "open"
[[talk.node]]
id = "open"
text = "Wren Okonjo is surrounded by galleys and ink. 'The paper is two proofreaders short and one deadline from disaster. Do you know which end of a comma goes up?'"
[[talk.node.choice]]
label = "Offer to proofread an issue"
say = "You find eleven mistakes and one libel. Wren puts your name in the small print."
effects = ["stand:ink_society:+3", "bond:wren:+3", "xp:bluff:1"]
[[talk.node.choice]]
label = "Offer a story tip instead"
needs = ["skill:bluff>=1"]
say = "She writes it on her cuff. 'If it is true, you are a reporter.' It is, so you are."
effects = ["stand:ink_society:+4", "bond:wren:+2"]
[[talk.node.choice]]
label = "Say you will think about it"
say = "'Think quickly,' says Wren."

[[talk]]
id = "sol_dare"
npc = "sol"
title = "Sol dares you to climb the bike shed"
when = ["day>=2"]
first = "open"
[[talk.node]]
id = "open"
text = "Sol Marchetti is lying on the roof of the bike shed with a view of everything. 'Up here,' they say, 'is where the school stops looking. Coming?'"
[[talk.node.choice]]
label = "Climb up and sit with them"
say = "The view is the best in the school and nobody in it is watching you. Sol says you will do."
effects = ["stand:the_bench:+5", "bond:sol:+4", "xp:sneak:1"]
[[talk.node.choice]]
label = "Hand them a message from a friend, from the ground"
say = "Sol takes it with a grin and does not ask whose it is."
effects = ["stand:the_bench:+3", "bond:sol:+2"]
[[talk.node.choice]]
label = "Stay where you are"
say = "'Another time,' says Sol, and does not seem to mind."

[[talk]]
id = "fenn_leaves"
npc = "fenn"
title = "Mr. Fenn and the leaves"
when = ["day>=3"]
once = false
cooldown = 4
first = "open"
[[talk.node]]
id = "open"
text = "Mr. Fenn is sweeping the same corner of the quad he swept yesterday. 'The lake sends the leaves in,' he says, 'and the school does not thank anyone for sending them out.'"
[[talk.node.choice]]
label = "Take a broom and help"
say = "An hour of sweeping, a tin mug of tea, and a story about the old boathouse that he plainly tells to very few."
effects = ["bond:fenn:+4", "stand:strays:+1"]
[[talk.node.choice]]
label = "Ask him what the school was like before"
say = "He looks at the lake for a while. 'Louder,' he says, and that is all."
effects = ["bond:fenn:+2"]
[[talk.node.choice]]
label = "Say good morning and move on"
say = "'Morning,' says Mr. Fenn, to the leaves."

[[talk]]
id = "soames_choir"
npc = "soames"
title = "Reverend Soames and the choir stalls"
when = ["day>=3"]
once = false
cooldown = 4
first = "open"
[[talk.node]]
id = "open"
text = "Reverend Soames is tuning the organ by ear, one note at a time. 'The trebles have gone to the match and taken their breath with them. Can you carry a tune?'"
[[talk.node.choice]]
label = "Sing the alto line for him"
say = "You are not good, and neither of you minds. He says it is the first time the chapel has sounded alive in a month."
effects = ["bond:soames:+4", "stat:cool:+1"]
[[talk.node.choice]]
label = "Offer to turn the pages"
say = "He lets you, and nods at the right moments, and does not say a word about the lamp in the loft."
effects = ["bond:soames:+2"]
[[talk.node.choice]]
label = "Say you cannot sing a note"
say = "'Nobody can,' says Reverend Soames, 'until the second verse.'"

# ---------------------------------------------------------------- the east wing (H4)
# Where the mystery's key comes from, and the end of it. The clues themselves are searches
# (content/mystery.toml); these are the people who matter to it.

[[talk]]
id = "wing_fenn_key"
npc = "fenn"
title = "Mr. Fenn and the key on the nail"
when = ["bond:fenn>=6"]
arc = "the_wing"
step = "key"
first = "open"
[[talk.node]]
id = "open"
text = "Mr. Fenn is oiling a hinge that does not need it. He has seen the trunk's dust on your sleeves. 'If a person were to ask me for the wing's key,' he says, 'I would want to know why.'"
[[talk.node.choice]]
label = "Tell him about the locket"
needs = ["know:ines_locket"]
say = "He takes the locket out of your hand as though it were hot. After a time he gives you the key without a word."
effects = ["item:east_wing_key", "arc:the_wing:wing", "bond:fenn:+4"]
[[talk.node.choice]]
label = "Say you only want to see the place"
say = "'Wanting to see is the start of it,' says Mr. Fenn. He hangs the key on your belt anyway."
effects = ["item:east_wing_key", "arc:the_wing:wing", "bond:fenn:+1"]
[[talk.node.choice]]
label = "Say it was nothing"
say = "He nods slowly and goes back to the hinge."

[[talk]]
id = "wing_soames_key"
npc = "soames"
title = "Reverend Soames and the old door"
when = ["bond:soames>=5"]
arc = "the_wing"
step = "key"
first = "open"
[[talk.node]]
id = "open"
text = "Reverend Soames closes the hymnal. 'You have been very quiet about the page I read for you, and very busy since. Tell me what you want, and I will not pretend not to know.'"
[[talk.node.choice]]
label = "Ask for the wing's key"
say = "He opens a drawer and takes out a key on a faded ribbon. 'It was never locked against you,' he says, which is a strange thing to say."
effects = ["item:east_wing_key", "arc:the_wing:wing", "bond:soames:+3"]
[[talk.node.choice]]
label = "Ask what happened in the wing"
say = "'Not yet,' he says. 'Find it, and then ask me.'"
effects = ["bond:soames:+1"]
[[talk.node.choice]]
label = "Say it was nothing"
say = "He looks at you kindly and says nothing either."

[[talk]]
id = "wing_soames_hint"
npc = "soames"
title = "Reverend Soames and the music desk"
when = ["know:soames_trust"]
arc = "the_wing"
step = "chalk"
first = "open"
[[talk.node]]
id = "open"
text = "Reverend Soames has been waiting for you to come back. 'You brought me a page once, and I said I would think about the East Wing. I have. If someone were looking for the loft key, I would look behind the organ pipes.'"
[[talk.node.choice]]
label = "Thank him and ask nothing more"
say = "He nods, relieved not to have been asked. 'Mind the third pipe,' he says. 'It sticks.'"
effects = ["know:organ_key_spot", "know:clue_c4_pipes", "bond:soames:+2"]
[[talk.node.choice]]
label = "Ask what he is afraid of"
say = "'Of being asked,' says Reverend Soames, and smiles, and tells you the same thing about the pipes."
effects = ["know:organ_key_spot", "know:clue_c4_pipes", "bond:soames:+1"]
[[talk.node.choice]]
label = "Say you will find it yourself"
say = "'Of course,' he says, and goes back to the hymnal."

[[talk]]
id = "wing_fenn_choice"
npc = "fenn"
title = "Tell Mr. Fenn what you found"
when = ["day>=27", "bond:fenn>=6"]
arc = "the_wing"
step = "choice"
first = "open"
[[talk.node]]
id = "open"
text = "Mr. Fenn looks up from a wheelbarrow. You have never seen him sit down, and now he does. 'Whatever it is,' he says, 'I would rather hear it from you.'"
[[talk.node.choice]]
label = "Show him the diary, the bolt and the report"
needs = ["know:diary_page", "know:fire_report"]
say = "He reads the last page of the diary standing up, and then he sits."
effects = ["arc_end:the_wing:fenn"]
[[talk.node.choice]]
label = "Tell him all of it from memory"
needs = ["know:bolt_outside"]
say = "He listens to every word and asks you to say the last part again."
effects = ["arc_end:the_wing:fenn"]
[[talk.node.choice]]
label = "Not yet"
say = "'Whenever you are ready,' says Mr. Fenn."

[[talk]]
id = "wing_soames_choice"
npc = "soames"
title = "Tell Reverend Soames what you found"
when = ["day>=27", "bond:soames>=6"]
arc = "the_wing"
step = "choice"
first = "open"
[[talk.node]]
id = "open"
text = "Reverend Soames is alone in the chapel with the lights off. 'I have been waiting for someone to bring me this,' he says, 'and hoping nobody would.'"
[[talk.node.choice]]
label = "Put the diary on the pew beside him"
needs = ["know:diary_page"]
say = "He does not touch it. He bows his head."
effects = ["arc_end:the_wing:soames"]
[[talk.node.choice]]
label = "Ask him about the initials on the bolt"
needs = ["know:bolt_outside"]
say = "'W.S.,' he says. 'Yes.' And nothing else for a long minute."
effects = ["arc_end:the_wing:soames"]
[[talk.node.choice]]
label = "Not yet"
say = "'I am not going anywhere,' says Reverend Soames."

[[talk]]
id = "wing_vane_choice"
npc = "vane"
title = "Take it to the headmistress"
when = ["day>=27", "file<=3", "not:trait:known_troublemaker"]
arc = "the_wing"
step = "choice"
first = "open"
[[talk.node]]
id = "open"
text = "Dame Vane has been told you are coming, and has the tea ready. It is a bad sign for anyone else, but you have a clean enough file that she smiles."
[[talk.node.choice]]
label = "Give her the diary and the fire report"
needs = ["know:diary_page", "know:fire_report"]
say = "She puts on her glasses to read her own signature."
effects = ["arc_end:the_wing:vane"]
[[talk.node.choice]]
label = "Ask her, plainly, about the bolt"
needs = ["know:bolt_outside"]
say = "'Sit down,' says Dame Vane. 'Let me tell you how these things look from here.'"
effects = ["arc_end:the_wing:vane"]
[[talk.node.choice]]
label = "Say you came about your reports"
say = "'Of course,' says Dame Vane, as though she had expected nothing else."

[[talk]]
id = "wing_wren_choice"
npc = "wren"
title = "Show Wren what you found"
when = ["day>=27", "know:diary_page", "standing:ink_society>=4"]
arc = "the_wing"
step = "choice"
first = "open"
[[talk.node]]
id = "open"
text = "Wren Okonjo has the press drawer open and a headline half-written. 'You have the look of someone with a front page in her pocket.'"
[[talk.node.choice]]
label = "Give her the diary"
say = "She reads it standing up, and then she reads it again."
effects = ["arc_end:the_wing:paper"]
[[talk.node.choice]]
label = "Say it can wait a day"
say = "'The best stories never wait,' says Wren, 'but they will, for you.'"

[[talk]]
id = "wing_sol_choice"
npc = "sol"
title = "Show Sol the diary"
when = ["day>=27", "know:diary_page"]
arc = "the_wing"
step = "choice"
first = "open"
[[talk.node]]
id = "open"
text = "Sol Marchetti is sitting on a wall with a box of matches, doing nothing with them. 'That is the thinking face,' he says. 'What are we burning?'"
[[talk.node.choice]]
label = "The diary, and every page that mentions the wing"
say = "He does not argue. He just looks at the matches for a moment and nods."
effects = ["arc_end:the_wing:bonfire"]
[[talk.node.choice]]
label = "Nothing. Forget I said anything"
say = "'Said what?' says Sol, which is the nicest thing he could have said."

[[talk]]
id = "wing_tilly_walk_away"
npc = "tilly"
title = "Sit with Tilly in the quad"
when = ["day>=27", "know:clue_c10_diary"]
arc = "the_wing"
step = "choice"
first = "open"
[[talk.node]]
id = "open"
text = "Tilly Brandt has found a spot in the sun and does not ask what is wrong. 'Some doors,' she says, 'are better as doors.'"
[[talk.node.choice]]
label = "Agree, and put the key away for good"
say = "You sit there until the bell, and neither of you says anything about the East Wing again."
effects = ["arc_end:the_wing:walk_away"]
[[talk.node.choice]]
label = "Say you are not ready to stop"
say = "'Then you are not,' says Tilly, and offers you half a sandwich."

# ---------------------------------------------------------------- the new students (content pass)

[[talk]]
id = "imogen_calls"
npc = "imogen"
title = "Imogen Hale practises her calls"
when = ["day>=3"]
first = "open"
[[talk.node]]
id = "open"
text = "Imogen Hale is standing on an upturned bucket and shouting at an empty boat. 'Stroke! Stroke! Nobody listens to a small person, so I make sure they do.'"
[[talk.node.choice]]
label = "Shout the count back at her"
needs = ["skill:fleet>=1"]
say = "Your count is out of time and far too loud, and she loves it. 'Again,' says Imogen, and you do it again."
effects = ["xp:fleet:1", "bond:imogen:+4", "stand:rowing_eight:+3"]
[[talk.node.choice]]
label = "Hold the stopwatch and call the splits"
say = "You call every split and she corrects you twice. By the end she says you will do."
effects = ["bond:imogen:+3", "stand:rowing_eight:+2"]
[[talk.node.choice]]
label = "Tell her the empty boat is listening"
say = "'It had better be,' says Imogen, with great dignity."
effects = ["bond:imogen:+1"]

[[talk]]
id = "imogen_fog"
npc = "imogen"
title = "Imogen and the fog"
when = ["bond:imogen>=3"]
first = "open"
[[talk.node]]
id = "open"
text = "Imogen lowers her voice. 'The Eight race in the fog next week. Hollis says it is perfectly safe. I think the fog is in on something.'"
[[talk.node.choice]]
label = "Offer to walk the towpath with a lantern"
needs = ["nerve>=2"]
say = "You swing the lantern along the bank until the boat's bow light answers out of the white. Imogen waves her whole arm."
effects = ["stat:nerve:-2", "bond:imogen:+3", "stand:rowing_eight:+3"]
[[talk.node.choice]]
label = "Promise to cheer from the bank"
say = "'Loudly,' says Imogen. 'It carries in fog.'"
effects = ["bond:imogen:+2"]
[[talk.node.choice]]
label = "Tell her fog is only weather"
say = "'Thank you,' says Imogen, 'that is exactly what I did not need.'"

[[talk]]
id = "jonty_cartoon"
npc = "jonty"
title = "Jonty Fairweather's heron"
when = ["day>=3"]
first = "open"
[[talk.node]]
id = "open"
text = "Jonty Fairweather has drawn the deputy head as a heron with a clipboard. 'It is too good to print and too good not to.'"
[[talk.node.choice]]
label = "Suggest a caption"
needs = ["skill:bluff>=1"]
say = "'Mr. Marsh Surveys His Pond.' Jonty writes it down with a flourish and a small sob of joy."
effects = ["xp:bluff:1", "stand:ink_society:+3", "bond:jonty:+4"]
[[talk.node.choice]]
label = "Offer to model for the next one"
say = "You hold a very serious pose for twenty minutes. The drawing is cruel and exact and you love it."
effects = ["bond:jonty:+3", "stat:cool:+1"]
[[talk.node.choice]]
label = "Tell him to burn it"
say = "'Never,' says Jonty. 'But thank you for caring.'"

[[talk]]
id = "jonty_censor"
npc = "jonty"
title = "Jonty and the censor"
when = ["standing:ink_society>=5"]
first = "open"
[[talk.node]]
id = "open"
text = "Jonty Fairweather has been told that the paper's cartoons must be 'tasteful from now on'. He looks as if somebody has asked him to draw with his elbow."
[[talk.node.choice]]
label = "Help him hide the joke in the background"
needs = ["skill:sneak>=1"]
say = "A tiny heron, in the corner of the lamp-post, holding a tiny clipboard. Nobody will find it for a week."
effects = ["xp:sneak:1", "stand:ink_society:+3", "bond:jonty:+3", "stat:legend:+1"]
[[talk.node.choice]]
label = "Draw a smaller, kinder version beside his"
say = "He looks at the two side by side and laughs for the first time that day."
effects = ["stand:ink_society:+1", "bond:jonty:+2"]
[[talk.node.choice]]
label = "Say that rules are rules"
say = "'So they are,' says Jonty, and begins to draw a very small rule with a very long face."

[[talk]]
id = "kit_notes"
npc = "kit"
title = "Kit Varga and the folded notes"
when = ["day>=3"]
first = "open"
[[talk.node]]
id = "open"
text = "Kit Varga has a sheaf of beautifully folded notes. 'Doctor, dentist, sudden aunt. I have a drawer full of aunts. Interested?'"
[[talk.node.choice]]
label = "Learn how to write a believable one"
needs = ["skill:bluff>=1"]
say = "'The trick,' says Kit, 'is one dull little detail. Nobody doubts a dull little detail.' You practise until it is boring."
effects = ["xp:bluff:2", "stand:the_bench:+3", "bond:kit:+3"]
[[talk.node.choice]]
label = "Trade a sudden aunt for a favour"
needs = ["not:trait:teachers_pet"]
say = "Kit nods gravely. 'She has a limp, and she lives in Hull.' It is the best aunt you have ever owned."
effects = ["stand:the_bench:+2", "bond:kit:+3"]
[[talk.node.choice]]
label = "Say you have never missed a lesson"
say = "'Remarkable,' says Kit. 'Disgusting. But remarkable.'"
effects = ["bond:kit:+1"]

[[talk]]
id = "kit_roof"
npc = "kit"
title = "Kit shows you the drainpipe"
when = ["standing:the_bench>=6"]
first = "open"
[[talk.node]]
id = "open"
text = "Kit leads you round the back of the gym to a drainpipe that goes up past a window nobody has locked since the war. 'Between us,' says Kit, 'this is the shortest way to the roof.'"
[[talk.node.choice]]
label = "Climb it and look"
needs = ["skill:sneak>=1"]
say = "You go up like smoke. From the top you can see the whole school, and every door that is not being watched."
effects = ["know:roof_route", "xp:sneak:2", "stand:the_bench:+2", "bond:kit:+2"]
[[talk.node.choice]]
label = "Keep watch at the bottom"
say = "You watch the corner for a whole quarter-hour. Nothing happens, which is the point."
effects = ["bond:kit:+3", "stand:the_bench:+1"]
[[talk.node.choice]]
label = "Admire the drainpipe and walk on"
say = "'It is a very good drainpipe,' says Kit, politely."

[[talk]]
id = "dot_market"
npc = "dot"
title = "Dot Mercer opens for business"
when = ["day>=4"]
first = "open"
[[talk.node]]
id = "open"
text = "Dot Mercer sits behind a tower of tin biscuit boxes. 'The school has rules about trade. I have a rule about rules. What are you buying, selling or ignoring?'"
[[talk.node.choice]]
label = "Haggle for a better price on a favour"
needs = ["cool>=45"]
say = "You keep your face perfectly still. Dot's eyebrows rise in respect. 'Three,' she says, and then, 'fine, four.'"
effects = ["stat:cash:+4", "bond:dot:+3"]
[[talk.node.choice]]
label = "Run a message to the dormitory for two biscuits"
say = "You run it. The biscuits are slightly stale and the thanks are real."
effects = ["stat:cash:+2", "bond:dot:+2", "stand:the_bench:+2"]
[[talk.node.choice]]
label = "Say you are only looking"
say = "'Everyone is only looking,' says Dot, 'until they are not.'"

[[talk]]
id = "priya_box"
npc = "priya"
title = "Priya Venkat and the lost property box"
when = ["day>=3"]
first = "open"
[[talk.node]]
id = "open"
text = "Priya Venkat is up to her elbows in the lost property box. 'Nine left gloves, not one right. I have begun to think the gloves are doing it on purpose.'"
[[talk.node.choice]]
label = "Help her match the gloves"
say = "You match four pairs and a sock, and Priya lets out a long, happy sigh. 'Thank you. Truly.'"
effects = ["stand:lamplighters:+3", "bond:priya:+3"]
[[talk.node.choice]]
label = "Talk a sheepish owner into claiming a scarf"
needs = ["skill:bluff>=1"]
say = "A scarf, an owner and a lot of blushing. Priya looks at you with something like awe."
effects = ["xp:bluff:1", "stand:lamplighters:+2", "bond:priya:+2"]
[[talk.node.choice]]
label = "Tell her gloves are always like that"
say = "'I am sure you are right,' says Priya, 'and I am sure it is awful.'"

[[talk]]
id = "priya_badge"
npc = "priya"
title = "Priya and the badge"
when = ["standing:lamplighters>=6"]
first = "open"
[[talk.node]]
id = "open"
text = "Priya Venkat has her new badge in her pocket and not on her blazer. 'Wick says a prefect never looks nervous. I feel nervous all the time.'"
[[talk.node.choice]]
label = "Tell her Wick looks nervous too, sometimes"
needs = ["bond:wick>=4"]
say = "Priya stares, then laughs very quietly. The badge goes on, a little crooked, which suits her."
effects = ["bond:priya:+4", "stand:lamplighters:+2"]
[[talk.node.choice]]
label = "Tell her the trick is to walk slower"
say = "She tries it down the corridor. It makes her look about three years older."
effects = ["bond:priya:+3", "stand:lamplighters:+1"]
[[talk.node.choice]]
label = "Say nothing and let her think"
say = "'Thank you for not saying it will be fine,' says Priya."

[[talk]]
id = "nell_solder"
npc = "nell"
title = "Nell Ashby's singing doorbell"
when = ["day>=3"]
first = "open"
[[talk.node]]
id = "open"
text = "Nell Ashby is soldering a doorbell that plays the school song, very badly. 'The wire has opinions. I am ninety per cent sure it is the wire.'"
[[talk.node.choice]]
label = "Help her rewire it"
needs = ["skill:tinker>=1"]
say = "Two wires swapped and the song comes out almost in tune. Nell salutes you with the iron, then checks it is off."
effects = ["xp:tinker:2", "stand:workshop:+3", "bond:nell:+4", "merit:robotics:+1"]
[[talk.node.choice]]
label = "Hold the torch while she works"
say = "You hold it very steady. She says it is the most useful thing anyone has done all week."
effects = ["bond:nell:+3", "stand:workshop:+1"]
[[talk.node.choice]]
label = "Ask her to stop it playing at all"
say = "'Philistine,' says Nell, fondly."

[[talk]]
id = "nell_prototype"
npc = "nell"
title = "Nell's box of springs"
when = ["standing:workshop>=6"]
first = "open"
[[talk.node]]
id = "open"
text = "Nell Ashby lifts a cardboard lid a quarter-inch. Inside is something spring-loaded and wired. 'Do not touch it. Admire it.'"
[[talk.node.choice]]
label = "Suggest it would fit under a teacher's chair"
needs = ["skill:tinker>=1"]
say = "Nell gazes at you for a long moment. 'That is,' she says, 'a terrible idea,' and writes it down."
effects = ["xp:tinker:1", "bond:nell:+3", "stat:legend:+1"]
[[talk.node.choice]]
label = "Admire it, loudly"
say = "You admire it so well that she lets you look at the spring."
effects = ["bond:nell:+2", "stand:workshop:+1"]
[[talk.node.choice]]
label = "Back away slowly"
say = "'Sensible,' says Nell, and closes the lid."

# ---------------------------------------------------------------- staff and prefects, again (content pass)

[[talk]]
id = "pell_puzzle"
npc = "pell"
title = "Mr. Pell and the puzzle on the board"
when = ["day>=5", "grade:maths>=60"]
first = "open"
[[talk.node]]
id = "open"
text = "Mr. Pell has chalked a puzzle on the board and is waiting for someone, anyone, to find a second answer. 'I maintain there is only one. I should like to be proved wrong.'"
[[talk.node.choice]]
label = "Find the second answer"
needs = ["skill:tinker>=1"]
say = "It was hiding in plain sight. Mr. Pell sits down heavily on a desk. 'Well,' he says. 'Well.'"
effects = ["bond:pell:+5", "xp:tinker:2", "grade:maths:+2", "stat:cool:+1"]
[[talk.node.choice]]
label = "Ask for a hint"
say = "He gives you the smallest hint in the history of hints. It is enough."
effects = ["bond:pell:+2", "grade:maths:+1"]
[[talk.node.choice]]
label = "Say there is only one answer"
say = "'Quite right,' says Mr. Pell, looking faintly disappointed."
effects = ["bond:pell:+1"]

[[talk]]
id = "pell_rota"
npc = "pell"
title = "Mr. Pell and the duty rota"
when = ["day>=6"]
once = false
cooldown = 8
first = "open"
[[talk.node]]
id = "open"
text = "Mr. Pell has pinned the duty rota to his door and is trying to work out who swapped the Tuesdays. 'Somebody has been busy with a pencil.'"
[[talk.node.choice]]
label = "Help him untangle it, and learn who is where"
needs = ["bond:pell>=2"]
say = "An hour with a ruler and the answer shows itself. As a bonus you now know exactly where every member of staff will be, and when."
effects = ["know:staff_rota", "bond:pell:+3"]
[[talk.node.choice]]
label = "Offer to copy it out fair"
say = "Your handwriting is a good deal neater than the original. Mr. Pell is quietly moved."
effects = ["bond:pell:+2"]
[[talk.node.choice]]
label = "Say you only came for a pencil"
say = "'Take two,' says Mr. Pell, without looking up."

[[talk]]
id = "orrin_goggles"
npc = "orrin"
title = "Ms. Orrin and the good goggles"
when = ["day>=6"]
first = "open"
[[talk.node]]
id = "open"
text = "Ms. Orrin is polishing a spare pair of lab goggles that she plainly does not mean to lend. 'The last pupil who borrowed these returned them with a burn mark and an opinion.'"
[[talk.node.choice]]
label = "Ask to borrow them for the Robotics bench"
needs = ["rank:robotics>=2"]
say = "She considers you for a full minute. 'Bring them back whole,' she says, and hands them over like a sacrament."
effects = ["merit:robotics:+3", "bond:orrin:+4", "xp:tinker:1"]
[[talk.node.choice]]
label = "Offer to clean the whole shelf of them"
say = "You polish thirty pairs of goggles. She says nothing, and puts the kettle on."
effects = ["bond:orrin:+3"]
[[talk.node.choice]]
label = "Admire the shine and leave"
say = "'They are very clean,' says Ms. Orrin, to nobody in particular."

[[talk]]
id = "thorne_rehearsal"
npc = "thorne"
title = "Madame Thorne hears the lines"
when = ["rank:drama>=1"]
first = "open"
[[talk.node]]
id = "open"
text = "Madame Thorne holds the script like a fan. 'I have been told that I may not shout at the Players. I have been told nothing about sighing.'"
[[talk.node.choice]]
label = "Cue her lines from the wings"
say = "You feed her every line a half-beat early. She taps the script. 'Better. Considerably better.'"
effects = ["merit:drama:+2", "bond:thorne:+3", "xp:bluff:1"]
[[talk.node.choice]]
label = "Offer to read the villain"
needs = ["tag:charm"]
say = "You read the villain's speech with all the warmth you can find. Madame Thorne puts a hand to her chest. 'Oh, you wicked child.'"
effects = ["bond:thorne:+4", "stat:cool:+2", "merit:drama:+1"]
[[talk.node.choice]]
label = "Admit you have no memory for lines"
say = "'Then you will make a very good critic,' says Madame Thorne."

[[talk]]
id = "alder_founder"
npc = "alder"
title = "Mr. Alder scolds a portrait"
when = ["day>=8", "grade:history>=55"]
first = "open"
[[talk.node]]
id = "open"
text = "Mr. Alder has a portrait propped against the library shelves and is explaining to it, at length, what the founder did wrong in 1881."
[[talk.node.choice]]
label = "Ask what the founder did wrong"
say = "It turns out to be a very good story, with a flood in it, and a goat. You come away rather impressed by the goat."
effects = ["bond:alder:+3", "know:founders_story", "grade:history:+2"]
[[talk.node.choice]]
label = "Suggest the portrait looks as though it agrees with you"
needs = ["skill:bluff>=1"]
say = "Mr. Alder studies the founder's painted face, and then, slowly, nods. 'It does, rather. How perceptive.'"
effects = ["bond:alder:+4", "xp:bluff:1"]
[[talk.node.choice]]
label = "Nod and edge away"
say = "He thanks you for listening, which is more than the founder ever did."

[[talk]]
id = "ruddock_sketch"
npc = "ruddock"
title = "Ms. Ruddock and the lake"
when = ["day>=5"]
first = "open"
[[talk.node]]
id = "open"
text = "Ms. Ruddock is sketching the lake from the art-room window and does not turn round. 'Come and look. Do not tell me it is good. Tell me what is wrong with it.'"
[[talk.node.choice]]
label = "Point out the gull she left out"
needs = ["skill:sneak>=1"]
say = "She laughs, adds the gull, and says you have a good eye for what is missing."
effects = ["bond:ruddock:+4", "xp:sneak:1", "stat:cool:+1"]
[[talk.node.choice]]
label = "Say the sky is too tidy"
say = "'Yes,' says Ms. Ruddock. 'Yes, it is.' She scribbles over half of it, delighted."
effects = ["bond:ruddock:+3", "stat:cool:+1"]
[[talk.node.choice]]
label = "Say it is beautiful anyway"
say = "'Everyone says that,' says Ms. Ruddock, but she keeps smiling."
effects = ["bond:ruddock:+1"]

[[talk]]
id = "ruddock_loan"
npc = "ruddock"
title = "Ms. Ruddock lends her old pens"
when = ["bond:ruddock>=4"]
first = "open"
[[talk.node]]
id = "open"
text = "Ms. Ruddock presses a battered tin into your hands. 'My old pens and inks. I do not use them as often as I should. Please do not do anything with them I would have to report.'"
[[talk.node.choice]]
label = "Offer to tidy the supply cupboard first"
say = "The cupboard takes an hour and a dustpan. She keeps her promise and does not watch you leave with the tin."
effects = ["item:forgery_kit", "bond:ruddock:+3"]
[[talk.node.choice]]
label = "Say you could not possibly"
say = "'Then I like you more,' says Ms. Ruddock, 'and I shall ask again.'"
effects = ["bond:ruddock:+3"]

[[talk]]
id = "gale_referee"
npc = "gale"
title = "Mr. Gale needs a referee"
when = ["rank:rowing>=1"]
first = "open"
[[talk.node]]
id = "open"
text = "Mr. Gale has a junior boat race to start and a whistle that has been confiscated by a seagull. 'You know the course. Referee. And do not blow it like a bird.'"
[[talk.node.choice]]
label = "Referee the junior race"
say = "You start it clean, call it fair, and hand out the oranges. Mr. Gale writes a very short note, which says 'Good.'"
effects = ["merit:rowing:+3", "bond:gale:+4", "stand:rowing_eight:+2", "xp:fleet:1"]
[[talk.node.choice]]
label = "Run the finish flag instead"
say = "You sprint the length of the bank twice. The flag has never been so punctual."
effects = ["bond:gale:+2", "xp:fleet:1"]
[[talk.node.choice]]
label = "Say you would rather row"
say = "'Then row,' says Mr. Gale. 'But next time, ask.'"

[[talk]]
id = "tarn_washing"
npc = "tarn"
title = "Mrs. Tarn and the washing-up"
when = ["day>=6"]
first = "open"
[[talk.node]]
id = "open"
text = "Mrs. Tarn has a sink full of bowls and an air of private grief. 'Forty bowls, three pairs of hands, and one pair of them is mine.'"
[[talk.node.choice]]
label = "Wash up for the afternoon"
say = "Your hands go wrinkled and your sleeves go damp. She presses two warm coins into your palm and does not say what for."
effects = ["bond:tarn:+4", "stat:cash:+2"]
[[talk.node.choice]]
label = "Dry, and return the strays to their shelves"
needs = ["skill:sneak>=1"]
say = "You put forty bowls away in perfect silence. Mrs. Tarn looks at the shelf and then at you. 'Hm,' she says, which is high praise."
effects = ["bond:tarn:+3", "xp:sneak:1", "stat:cash:+1"]
[[talk.node.choice]]
label = "Say you have a lesson"
say = "'You always do,' says Mrs. Tarn, not unkindly."

[[talk]]
id = "soames_descant"
npc = "soames"
title = "Reverend Soames and the descant"
when = ["day>=9"]
first = "open"
[[talk.node]]
id = "open"
text = "Reverend Soames is trying to teach the choir a descant that the choir does not want to learn. 'It goes up here. It is quite definitely supposed to go up here.'"
[[talk.node.choice]]
label = "Sing the top line"
needs = ["rank:drama>=1"]
say = "You have the stage voice, and it finds the note. The choir stops, and then follows you up. Reverend Soames closes his eyes."
effects = ["merit:drama:+2", "bond:soames:+4", "stat:cool:+2"]
[[talk.node.choice]]
label = "Hold the music"
say = "You hold the music and turn the pages at all the right places. He is glad of the company."
effects = ["bond:soames:+2"]
[[talk.node.choice]]
label = "Back quietly out of the chapel"
say = "The descant goes up. Or at least, somebody's does."

[[talk]]
id = "marsh_monitor"
npc = "marsh"
title = "Mr. Marsh has a job for you"
when = ["grades>=70", "day>=6"]
first = "open"
[[talk.node]]
id = "open"
text = "Mr. Marsh has the clipboard pressed to his chest, and for once it is not about you. 'The corridor monitors are one short. I looked at the grades. I looked at the file. I will say no more.'"
[[talk.node.choice]]
label = "Accept the armband"
needs = ["not:trait:known_troublemaker"]
say = "The armband is two sizes too big. Mr. Marsh straightens it, with the expression of a man doing something he will explain to nobody."
effects = ["bond:marsh:+4", "stand:lamplighters:+3", "wary:marsh:-1"]
[[talk.node.choice]]
label = "Ask for something in return"
needs = ["tag:charm"]
say = "He looks pained. 'A pass to the library,' he says. 'Once.' It is the smoothest negotiation of your career."
effects = ["stat:cool:+2", "bond:marsh:+1"]
[[talk.node.choice]]
label = "Decline, politely"
say = "'As you wish,' says Mr. Marsh, and writes it down, which is somehow worse."

[[talk]]
id = "wick_noise"
npc = "wick"
title = "Cordelia Wick has been counting"
when = ["notoriety>=15"]
first = "open"
[[talk.node]]
id = "open"
text = "Cordelia Wick closes her notebook on one finger. 'Your name is on four of my lists. I am not saying it is deserved. I am saying it is a lot of lists.'"
[[talk.node.choice]]
label = "Promise to keep the noise down"
needs = ["not:trait:known_troublemaker"]
say = "She weighs the promise as though it were a coin that might be false. 'Keep it,' she says, 'and I will cross you off two.'"
effects = ["bond:wick:+3", "stand:lamplighters:+2", "stat:heat:-3"]
[[talk.node.choice]]
label = "Ask which lists"
needs = ["skill:bluff>=1"]
say = "She reads them out, and by the third you have learned a good deal more than you have given."
effects = ["xp:bluff:1", "know:prefect_lists", "bond:wick:+1"]
[[talk.node.choice]]
label = "Shrug"
say = "'Hm,' says Wick, and writes something small."

[[talk]]
id = "bramley_dinner"
npc = "bramley"
title = "Tobias Bramley has nine minutes"
when = ["day>=7", "standing:lamplighters>=4"]
first = "open"
[[talk.node]]
id = "open"
text = "Tobias Bramley is eating his dinner at the speed of a man who has been told it is the last dinner. 'I have nine minutes. Say your piece.'"
[[talk.node.choice]]
label = "Ask about the Lamplighters' rota"
needs = ["know:prefect_rounds"]
say = "He chews, thinks, and swallows. 'You know more about it than I do,' he says, a little relieved, and tells you the rest."
effects = ["bond:bramley:+2", "stand:lamplighters:+2"]
[[talk.node.choice]]
label = "Pass him the salt"
say = "There is a long silence while he considers whether this is a bribe. It is not, and he is almost disappointed."
effects = ["bond:bramley:+3"]
[[talk.node.choice]]
label = "Leave him to his dinner"
say = "'Thank you,' says Bramley, with deep and real feeling."

[[talk]]
id = "hollis_training"
npc = "hollis"
title = "Rafe Hollis and the dawn row"
when = ["standing:rowing_eight>=6"]
first = "open"
[[talk.node]]
id = "open"
text = "Rafe Hollis claps you on the shoulder, hard. 'The Eight are one oar short for tomorrow's dawn row. You are not an oar. But you are the right shape.'"
[[talk.node.choice]]
label = "Join the Eight for a morning's training"
needs = ["rank:rowing>=1"]
say = "You row until your hands blister, and the Eight call you one of their own. The blisters are worth it."
effects = ["merit:rowing:+3", "stand:rowing_eight:+3", "bond:hollis:+3"]
[[talk.node.choice]]
label = "Race the boat along the bank"
needs = ["skill:fleet>=1"]
say = "You keep pace with the boat for the full length of the lake, and Rafe is still shouting about it at lunch."
effects = ["xp:fleet:2", "bond:hollis:+4"]
[[talk.node.choice]]
label = "Wish them luck"
say = "'We do not need it,' says Rafe. 'But thank you.'"
effects = ["bond:hollis:+1"]

[[talk]]
id = "crouch_aftermath"
npc = "crouch"
title = "Barnaby Crouch on the bottom step"
when = ["know:stood_up_to_crouch"]
first = "open"
[[talk.node]]
id = "open"
text = "Barnaby Crouch is sitting alone on the bottom step and looking at his boots. He does not look up. 'I suppose you want me to say sorry.'"
[[talk.node.choice]]
label = "Tell him it would be a start"
say = "He is quiet for a while. 'To them,' he says at last. 'Not to you. I will think about it.'"
effects = ["bond:crouch:+3", "stand:strays:+2"]
[[talk.node.choice]]
label = "Tell him you do not need anything from him"
say = "He looks up, surprised, and then back down again."
effects = ["bond:crouch:+1"]
[[talk.node.choice]]
label = "Keep walking"
say = "You leave him to his boots."

[[talk]]
id = "mags_rota"
npc = "mags"
title = "Marguerite Lund's folded paper"
when = ["day>=8"]
first = "open"
[[talk.node]]
id = "open"
text = "Marguerite Lund slides a folded paper across the table without looking up. 'The staff rota for the next fortnight, drawn from memory. Do not ask how long it took.'"
[[talk.node.choice]]
label = "Study it carefully"
needs = ["skill:sneak>=1"]
say = "You read it twice and put it back, and you know exactly where every member of staff will be and when they will not."
effects = ["know:staff_timings", "xp:sneak:2", "bond:mags:+3"]
[[talk.node.choice]]
label = "Offer to copy it out for her"
say = "She lets you. Her handwriting is better than yours, and she says so, and then she thanks you."
effects = ["bond:mags:+3", "stand:ink_society:+1"]
[[talk.node.choice]]
label = "Fold it back up"
say = "'Wise,' says Marguerite. 'Mostly.'"

[[talk]]
id = "tilly_hiding"
npc = "tilly"
title = "Tilly Brandt's new hiding place"
when = ["know:hiding_places"]
once = false
cooldown = 6
first = "open"
[[talk.node]]
id = "open"
text = "Tilly Brandt has found a new place to hide and is bursting to share it. 'Behind the third bookcase. It is quite roomy and nobody has been in there since 1974.'"
[[talk.node.choice]]
label = "Hide there with her until the bell"
say = "You sit behind the bookcase in the dust and the quiet and eat half a biscuit each. It is the best period of the week."
effects = ["bond:tilly:+3", "stand:strays:+3"]
[[talk.node.choice]]
label = "Ask whether it would keep a secret"
needs = ["skill:sneak>=1"]
say = "'Better than I do,' says Tilly, which is true. You note the gap between the shelf and the wall."
effects = ["know:bookcase_nook", "xp:sneak:1", "bond:tilly:+2"]
[[talk.node.choice]]
label = "Say you will remember it"
say = "'Please do,' says Tilly. 'But do not say where.'"
effects = ["bond:tilly:+1"]

[[talk]]
id = "pip_robot"
npc = "pip"
title = "Pip Aldous and the robot that walks in circles"
when = ["rank:robotics>=2"]
first = "open"
[[talk.node]]
id = "open"
text = "Pip Aldous is watching the club's robot walk in a circle. It has been walking in a circle for an hour. 'It is very committed,' says Pip, 'but not to the right direction.'"
[[talk.node.choice]]
label = "Straighten it with a new servo"
needs = ["item:servo"]
say = "You fit the servo and set it down. It rolls the whole length of the workshop in a dead straight line and bumps the wall, delighted."
effects = ["bond:pip:+4", "merit:robotics:+2", "xp:tinker:2"]
[[talk.node.choice]]
label = "Give it a name"
say = "You name it Gerald the Second. Pip makes a little plaque and nobody says a word against it."
effects = ["bond:pip:+3", "stand:workshop:+2"]
[[talk.node.choice]]
label = "Tell it to stop"
say = "It goes around once more, as a courtesy."
