# Cliques and the first small cast. A schedule rule is `when` (a slot kind such as
# "class:maths", "class", "lunch", "free", "after", "evening", "night", "chapel" or "*"),
# optional `days` (0 = Monday), and the place. The first matching rule wins; `home` is the fallback.

[[clique]]
id = "rowing_eight"
name = "The Rowing Eight"
blurb = "Athletes, with the loudest voices in the building."
rivals = ["ink_society", "workshop"]

[[clique]]
id = "ink_society"
name = "The Ink Society"
blurb = "Writers and the school paper. They know everything first."
rivals = ["rowing_eight"]

[[clique]]
id = "the_bench"
name = "The Bench"
blurb = "The back-of-the-bus rebels."
rivals = ["lamplighters"]

[[clique]]
id = "lamplighters"
name = "The Lamplighters"
blurb = "The prefects' circle."
rivals = ["the_bench"]

[[clique]]
id = "workshop"
name = "The Workshop"
blurb = "Tinkerers and the robotics club."
rivals = ["rowing_eight"]

[[clique]]
id = "strays"
name = "The Strays"
blurb = "The kids nobody claims. Allies, never targets."
rivals = []

