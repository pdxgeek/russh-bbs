# Traits change outcomes: every number here is read by the engine. Percentages are relative
# (`accident_pct = -40` makes accidents 40% less likely). `scar = true` traits cannot be hired
# with; they are earned from injuries.

[[trait]]
id = "steady"
name = "Steady"
blurb = "Keeps a level head when the water rises."
accident_pct = -40

[[trait]]
id = "greedy"
name = "Greedy"
blurb = "Works hard for the take, and takes a little extra."
yield_pct = 5
pocket_pct = 10
hire_pct = -15

[[trait]]
id = "sea-born"
name = "Sea-born"
blurb = "Grew up on the flats. The water is a road, not a wall."
wet_pct = 25
accident_pct = -20

[[trait]]
id = "fearful"
name = "Fearful"
blurb = "Will not go out when the water is high. Rarely hurt, for it."
refuses_high = true
accident_pct = -20
morale = -1

[[trait]]
id = "lucky"
name = "Lucky"
blurb = "Things turn up where they dig."
luck_pct = 12

[[trait]]
id = "drinks"
name = "Drinks"
blurb = "Good company, bad mornings. Costs a tally a night."
