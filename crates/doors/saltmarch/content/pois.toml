# Point-of-interest templates. The generator places `count` of each on a tile of one of the
# `tiles` kinds, in the distance `band` from the Tidecourt ("near", "mid", "far") or in the
# Deep. `paints` turns the tile into that kind (a drowned town, a wreck).

[[poi]]
id = "reed-camp"
name = "Reed-cutters' camp"
blurb = "A ring of lean-tos. The cutters will trade, if you bring salt."
kind = "camp"
tiles = ["reedbed", "island"]
band = "near"
count = 3

[[poi]]
id = "drover-camp"
name = "Drovers' camp"
blurb = "Peat drovers rest here between tides."
kind = "camp"
tiles = ["island", "peat-bog"]
band = "mid"
count = 2

