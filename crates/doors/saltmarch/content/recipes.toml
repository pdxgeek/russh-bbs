# What the workshops can make. `learn` says how a clan comes to know it: "start" and
# "workshop" recipes are known as soon as their workshop is built; "ruin" plans are found in
# the drowned towns and "trade" knowledge is bought from other clans (both arrive in later
# slices; until then they stay locked).

[[recipe]]
id = "braid-rope"
name = "Braid rope"
workshop = "ropewalk"
inputs = { reed = 3 }
output = "rope"
qty = 1
turns = 1
skill = "wader"
learn = "workshop"

