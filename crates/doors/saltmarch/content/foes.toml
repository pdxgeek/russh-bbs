[[group]]
id = "leech-swarm"
intro = "The black water of the bog begins to shiver, and then to climb your boots."
foes = ["peat-leech", "peat-leech", "peat-leech", "peat-leech", "peat-leech"]

[[group]]
id = "mere-drake"
intro = "The mere heaves. A crested head comes up, and the eels come with it."
foes = ["mere-drake", "mire-eel", "mire-eel"]

[[group]]
id = "wrecker-gang"
intro = "Axes ring on the hulk's rail. The wreckers have been waiting for someone to do their stripping."
foes = ["wrecker", "wrecker", "cutter", "slinger"]

[[group]]
id = "deep-sentinels"
intro = "A glass shape turns on the stair, quickly, as if it had never stopped listening. The hounds it keeps do not bark."
foes = ["spire-sentinel", "bog-hound", "bog-hound"]

[[group]]
id = "drowned-king"
intro = "Water stands in the hall to the knee. At the far end, something crowned lifts its head, and its court rises."
foes = ["drowned-king", "mud-wight", "tide-hag"]

[[group]]
id = "leech-and-hag"
intro = "The bog is quiet in the wrong way. Then a woman's shape stands up out of the leeches."
foes = ["tide-hag", "peat-leech", "peat-leech", "peat-leech"]

[[group]]
id = "wrecker-hounds"
intro = "A whistle from the dune, and the hounds come down with two men behind them."
foes = ["bog-hound", "bog-hound", "wrecker", "slinger"]

[[group]]
id = "crab-and-eel"
intro = "Shells and long shadows, all at the water's edge. They have shared this bank for years."
foes = ["salt-crab", "mire-eel", "mire-eel", "wrack-gull"]
