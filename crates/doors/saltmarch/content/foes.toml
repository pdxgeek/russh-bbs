# Creatures and bandits, and the groups they fight in. Attack, armour and speed are in the
# skirmish's own small numbers (a crew member has about 4 attack, 18 hit points, 1 armour).
# `mass` is how hard a foe is to shove between rows. `aquatic` foes are better in the water,
# `tidal` ones stronger when it is high. Behaviours: bruiser (hits the front rank), lurker
# (the weakest, whatever the rank), hurler (throws from the back), skittish (runs when hurt)
# and swarm (weak alone).

[[foe]]
id = "mire-eel"
name = "Mire-eel"
blurb = "As long as a boathook and twice as quick. It lives in the mud and does not mind the tide."
hp = 12
atk = 4
def = 0
spd = 7
mass = 3
row = "middle"
behaviour = "lurker"
aquatic = true
drops = { fish = 4 }

[[foe]]
id = "reed-cat"
name = "Reed-cat"
blurb = "A lean grey cat with a ringed tail. It drops from the reeds and does not stay to argue."
