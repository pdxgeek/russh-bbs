[[group]]
id = "slinger-nest"
intro = "Lead shot whistles past before you hear the sling."
foes = ["cutter", "slinger", "slinger"]

[[group]]
id = "rival-crew"
intro = "A crew in rival colours stands across the causeway. Nobody speaks first."
foes = ["reaver", "reaver", "slinger"]

[[group]]
id = "wight-walk"
intro = "The shape in the bog stops being a stump."
foes = ["mud-wight"]

[[group]]
id = "wight-and-hounds"
intro = "The hounds circle the thing that walks, and neither will let you pass."
foes = ["mud-wight", "bog-hound"]

[[group]]
id = "warden"
intro = "The spire's door opens, and what was holding it open steps out."
foes = ["spire-warden"]

