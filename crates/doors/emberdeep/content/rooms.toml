fail_text = "The rock shifts and the rope burns your palms."
[[room.option]]
id = "peer"
label = "Peer up the shaft"
need = [{ kind = "no_tag", tag = "ropework" }, { kind = "no_tag", tag = "climb" }, { kind = "no_tag", tag = "brawn" }]
cost = 1
