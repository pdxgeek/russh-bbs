fail_text = "The light flickers and drops you."
[[room.option]]
id = "look-down"
label = "Look down the chasm"
need = [{ kind = "no_tag", tag = "nimble" }, { kind = "no_tag", tag = "bridgewright" }, { kind = "no_tag", tag = "runecraft" }, { kind = "no_tag", tag = "bless" }]
cost = 1
ok = [{ kind = "xp", amount = 5 }]
ok_text = "A very long way. You have a better idea of what the dungeon is, and no way across."

[[room]]
id = "rope-shaft"
kind = "shaft"
bands = [1, 2, 3, 4, 5]
name = "The Rope Shaft"
text = "A vertical shaft with rusted pitons in the wall and the frayed end of a rope line. A fixed line here would let people come and go quickly."
[[room.option]]
id = "fix-line"
label = "Fix the pitons and rig a rope line"
need = [{ kind = "tag", tag = "ropework" }]
cost = 1
ok = [{ kind = "shortcut", shortcut = "rope" }, { kind = "xp", amount = 18 }]
