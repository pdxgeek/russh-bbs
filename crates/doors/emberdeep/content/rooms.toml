# ---------------- Shafts: where a hero can open a shortcut for everyone ----------------
[[room]]
id = "broken-lift"
kind = "shaft"
bands = [1, 2, 3, 4, 5]
name = "The Broken Lift"
text = "An iron cage hangs in a shaft above the stair, its winch jammed and its chain slack. A working lift would save everyone a long climb."
[[room.option]]
id = "rune-winch"
label = "Re-seat the winch with rune-work"
need = [{ kind = "tag", tag = "runecraft" }]
cost = 2
ok = [{ kind = "shortcut", shortcut = "lift" }, { kind = "xp", amount = 20 }]
ok_text = "The runes bite, the winch turns, and the cage lifts with a groan. The lift runs."
[[room.option]]
id = "tinker-winch"
label = "Rig the winch with a tinker's touch"
need = [{ kind = "tag", tag = "tinker" }, { kind = "no_tag", tag = "runecraft" }]
cost = 3
check = { attr = "wits", dc = 12 }
ok = [{ kind = "shortcut", shortcut = "lift" }, { kind = "xp", amount = 16 }]
ok_text = "Cogs, wire and swearing. The lift runs, mostly."
fail = [{ kind = "hurt", amount = 3 }]
fail_text = "The winch kicks and the handle takes a chunk out of your hand."
[[room.option]]
id = "haul-chain"
label = "Haul the chain up by hand and make a rope line"
need = [{ kind = "tag", tag = "brawn" }]
cost = 3
check = { attr = "might", dc = 13 }
ok = [{ kind = "shortcut", shortcut = "rope" }, { kind = "xp", amount = 14 }]
ok_text = "Hand over hand, you pull the chain free and anchor it. It is not a lift, but it will hold a person."
fail = [{ kind = "hurt", amount = 5 }, { kind = "fatigue", amount = 6 }]
fail_text = "The chain runs back through your hands and takes the skin."
[[room.option]]
id = "study"
label = "Study the broken lift"
need = [{ kind = "no_tag", tag = "runecraft" }, { kind = "no_tag", tag = "tinker" }, { kind = "no_tag", tag = "brawn" }]
cost = 1
ok = [{ kind = "xp", amount = 5 }]
ok_text = "You cannot fix it. You can see exactly why you cannot."

[[room]]
id = "chasm-span"
kind = "shaft"
bands = [2, 3, 4, 5]
name = "The Chasm Span"
text = "The floor ends in a chasm. The old bridge is a few rotted planks and the stubs of its chains; the far side is a long way down and a short way across."
[[room.option]]
id = "leap-and-anchor"
label = "Leap the gap and anchor a line"
need = [{ kind = "tag", tag = "nimble" }]
cost = 2
check = { attr = "finesse", dc = 13 }
ok = [{ kind = "shortcut", shortcut = "bridge" }, { kind = "xp", amount = 18 }]
ok_text = "You land light, drive the anchor and haul the planks level. The bridge stands."
fail = [{ kind = "hurt", amount = 6 }]
fail_text = "You catch the far lip with your chest."
[[room.option]]
id = "rig-bridge"
label = "Climb across and rig a bridge"
need = [{ kind = "tag", tag = "bridgewright" }]
cost = 2
ok = [{ kind = "shortcut", shortcut = "bridge" }, { kind = "xp", amount = 24 }]
ok_text = "Planks, ropes and nerve: a proper bridge."
[[room.option]]
id = "rune-span"
label = "Cast a rune-span across the gap"
need = [{ kind = "tag", tag = "runecraft" }]
cost = 3
ok = [{ kind = "shortcut", shortcut = "bridge" }, { kind = "xp", amount = 18 }]
ok_text = "A span of faint red light, solid underfoot. The bridge stands."
[[room.option]]
id = "light-span"
label = "Pray for a span of light"
need = [{ kind = "tag", tag = "bless" }]
cost = 2
check = { attr = "spirit", dc = 14 }
ok = [{ kind = "shortcut", shortcut = "bridge" }, { kind = "xp", amount = 18 }]
ok_text = "Light hardens across the gap. The bridge stands."
