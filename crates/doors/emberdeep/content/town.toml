# The tavern board, the people to court, and what is overheard over a drink.
# depth is a level number (1 to 25); a band is five levels. need limits who the board offers it to.

contract = [
  # Kill a named beast: any monster of that kind at that depth or deeper counts.
  { id = "old-scorchtail", name = "Old Scorchtail", text = "A slag rat that has taken the cellar of the Ash Pantry. Drive it out for good.", kind = "beast", depth = 1, monster = "slag-rat", coin = 34, xp = 30, days = 3, done_text = "The board-keeper nails Scorchtail's tail over the door and counts out your coin." },
  { id = "the-spitting-widow", name = "The Spitting Widow", text = "A cinder imp that has killed two lamp-lighters. The guild pays for its head.", kind = "beast", depth = 2, monster = "cinder-imp", coin = 40, xp = 36, days = 3, done_text = "The lamp-lighters' guild pays, and says nothing, and pays again." },
  { id = "hollow-sir-aldous", name = "Hollow Sir Aldous", text = "An empty suit of armour still guarding a door nobody remembers. End the watch.", kind = "beast", depth = 2, monster = "rust-warden", coin = 56, xp = 50, days = 4, done_text = "Someone takes the armour for a scrapyard, and someone lays a flower." },
  { id = "blister-brood", name = "The Blister Brood", text = "A slag crawler heavy with eggs. Kill it before it nests under the stair.", kind = "beast", depth = 6, monster = "slag-crawler", coin = 90, xp = 90, days = 4, done_text = "The nest is ash. The stair is safe again." },
  { id = "the-chain-gang", name = "The Chain-Gang Foreman", text = "A forge thrall that still shouts orders. Its workers will not stop until it does.", kind = "beast", depth = 7, monster = "forge-thrall", coin = 120, xp = 120, days = 4, done_text = "The hammering below stops. For a moment the whole town listens." },
  { id = "mirror-of-the-keep", name = "The Mirror of the Keep", text = "A mirror knight that wears the face of whoever it fights last. It has worn too many.", kind = "beast", depth = 12, monster = "mirror-knight", coin = 220, xp = 240, days = 5, done_text = "The knight's last face is yours, and then it is no one's." },
  { id = "the-singing-hound", name = "The Singing Hound", text = "An echo hound whose bark carries up the shafts and keeps the night shift awake.", kind = "beast", depth = 11, monster = "echo-hound", coin = 200, xp = 220, days = 5, done_text = "The shafts are quiet. The night shift sleeps, and sends you a cake." },

  # Recover an heirloom: reach a kind of room at that depth (the heirloom is there to be taken).
  { id = "pell-strongbox", name = "The Pell Strongbox", text = "Wide Pell's savings went down with him on level 2. Bring his strongbox home.", kind = "heirloom", depth = 2, room = "vault", coin = 50, xp = 44, days = 4, done_text = "Pell's widow weeps over the lid, and presses a purse into your hands." },
  { id = "quiet-ledger", name = "A Quiet Ledger", text = "A creditor's ledger lies in a guild strongroom. No one asked you to fetch it. No one will say you did.", kind = "heirloom", depth = 3, room = "vault", need = [{ kind = "tag", tag = "sneak" }], coin = 85, xp = 70, days = 4, done_text = "The ledger changes hands without a word. The coin is heavier than it should be." },
  { id = "okwes-hammer", name = "Master Okwe's Hammer", text = "A smith's hammer left in a dead forge on level 4. Its owner's apprentices want it back.", kind = "heirloom", depth = 4, room = "forge", coin = 75, xp = 66, days = 4, done_text = "The apprentices pass the hammer from hand to hand. It is a good hammer." },
  { id = "maker-plate", name = "A Maker's Plate", text = "The reading-room wants a rune plate copied before it crumbles. Only a rune-reader can lift it clean.", kind = "heirloom", depth = 7, room = "forge", need = [{ kind = "tag", tag = "runecraft" }], coin = 130, xp = 130, days = 5, done_text = "The scholars hold the plate to the light and thank you in three languages." },
  { id = "the-locket", name = "A Mother's Locket", text = "A locket on a cairn on level 3. The family wants it, and the prayers said over it.", kind = "heirloom", depth = 3, room = "shrine", need = [{ kind = "tag", tag = "bless" }], coin = 70, xp = 62, days = 4, done_text = "The family kneels. The sisters bless the locket twice." },
  { id = "sunken-bell", name = "The Sunken Bell", text = "A chapel bell fell into the drowned halls on level 6. The town wants its voice back.", kind = "heirloom", depth = 6, room = "flooded", coin = 110, xp = 110, days = 5, done_text = "The bell rings once in the square, and every dog in Cindermere answers." },

  # Bring a lost soul home: reach a kind of room, then carry them up (the climb is a turn dearer).
  { id = "lost-lamplighter", name = "Tam the Lamplighter", text = "Tam went down to relight the stair lamps on level 2 and has not come up.", kind = "rescue", depth = 2, room = "corridor", escort = true, coin = 60, xp = 54, days = 3, done_text = "Tam is thin and cross and alive, and will not go down there again." },
  { id = "lost-novice", name = "A Novice of the Hearth", text = "A novice of the temple went to pray at a shrine on level 4 and lost her way.", kind = "rescue", depth = 4, room = "shrine", escort = true, coin = 95, xp = 90, days = 4, done_text = "The sisters take the novice by both hands, and look at you as if you were a saint." },
  { id = "lost-surveyor", name = "The Surveyor's Boy", text = "A surveyor's boy fell down a flooded shaft on level 7. His father is offering all he has.", kind = "rescue", depth = 7, room = "flooded", escort = true, coin = 160, xp = 150, days = 4, done_text = "The surveyor does not speak. He grips your hand until it hurts." },
]

companion = [
