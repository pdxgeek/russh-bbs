# The tavern board, the people to court, and what is overheard over a drink.
# depth is a level number (1 to 25); a band is five levels. need limits who the board offers it to.

contract = [
  # Kill a named beast: any monster of that kind at that depth or deeper counts.
  { id = "old-scorchtail", name = "Old Scorchtail", text = "A slag rat that has taken the cellar of the Ash Pantry. Drive it out for good.", kind = "beast", depth = 1, monster = "slag-rat", coin = 34, xp = 30, days = 3, done_text = "The board-keeper nails Scorchtail's tail over the door and counts out your coin." },
  { id = "the-spitting-widow", name = "The Spitting Widow", text = "A cinder imp that has killed two lamp-lighters. The guild pays for its head.", kind = "beast", depth = 2, monster = "cinder-imp", coin = 40, xp = 36, days = 3, done_text = "The lamp-lighters' guild pays, and says nothing, and pays again." },
  { id = "hollow-sir-aldous", name = "Hollow Sir Aldous", text = "An empty suit of armour still guarding a door nobody remembers. End the watch.", kind = "beast", depth = 2, monster = "rust-warden", coin = 56, xp = 50, days = 4, done_text = "Someone takes the armour for a scrapyard, and someone lays a flower." },
  { id = "blister-brood", name = "The Blister Brood", text = "A slag crawler heavy with eggs. Kill it before it nests under the stair.", kind = "beast", depth = 6, monster = "slag-crawler", coin = 90, xp = 90, days = 4, done_text = "The nest is ash. The stair is safe again." },
  { id = "the-chain-gang", name = "The Chain-Gang Foreman", text = "A forge thrall that still shouts orders. Its workers will not stop until it does.", kind = "beast", depth = 7, monster = "forge-thrall", coin = 120, xp = 120, days = 4, done_text = "The hammering below stops. For a moment the whole town listens." },
  { id = "mirror-of-the-keep", name = "The Mirror of the Keep", text = "A mirror knight that wears the face of whoever it fights last. It has worn too many.", kind = "beast", depth = 12, monster = "mirror-knight", coin = 220, xp = 240, days = 5, recipe = "found-glass-scale", done_text = "The knight's last face is yours, and then it is no one's." },
  { id = "the-singing-hound", name = "The Singing Hound", text = "An echo hound whose bark carries up the shafts and keeps the night shift awake.", kind = "beast", depth = 11, monster = "echo-hound", coin = 200, xp = 220, days = 5, done_text = "The shafts are quiet. The night shift sleeps, and sends you a cake." },

  # Recover an heirloom: reach a kind of room at that depth (the heirloom is there to be taken).
  { id = "pell-strongbox", name = "The Pell Strongbox", text = "Wide Pell's savings went down with him on level 2. Bring his strongbox home.", kind = "heirloom", depth = 2, room = "vault", coin = 50, xp = 44, days = 4, done_text = "Pell's widow weeps over the lid, and presses a purse into your hands." },
  { id = "quiet-ledger", name = "A Quiet Ledger", text = "A creditor's ledger lies in a guild strongroom. No one asked you to fetch it. No one will say you did.", kind = "heirloom", depth = 3, room = "vault", need = [{ kind = "tag", tag = "sneak" }], coin = 85, xp = 70, days = 4, done_text = "The ledger changes hands without a word. The coin is heavier than it should be." },
  { id = "okwes-hammer", name = "Master Okwe's Hammer", text = "A smith's hammer left in a dead forge on level 4. Its owner's apprentices want it back.", kind = "heirloom", depth = 4, room = "forge", coin = 75, xp = 66, days = 4, done_text = "The apprentices pass the hammer from hand to hand. It is a good hammer." },
  { id = "maker-plate", name = "A Maker's Plate", text = "The reading-room wants a rune plate copied before it crumbles. Only a rune-reader can lift it clean.", kind = "heirloom", depth = 7, room = "forge", need = [{ kind = "tag", tag = "runecraft" }], coin = 130, xp = 130, days = 5, done_text = "The scholars hold the plate to the light and thank you in three languages." },
  { id = "the-locket", name = "A Mother's Locket", text = "A locket on a cairn on level 3. The family wants it, and the prayers said over it.", kind = "heirloom", depth = 3, room = "shrine", need = [{ kind = "tag", tag = "bless" }], coin = 70, xp = 62, days = 4, done_text = "The family kneels. The sisters bless the locket twice." },
  { id = "sunken-bell", name = "The Sunken Bell", text = "A chapel bell fell into the drowned halls on level 6. The town wants its voice back.", kind = "heirloom", depth = 6, room = "flooded", coin = 110, xp = 110, days = 5, done_text = "The bell rings once in the square, and every dog in Cindermere answers." },

  # Bring a lost soul home: reach a kind of room, then carry them up (the climb is a turn dearer).
  { id = "lost-lamplighter", name = "Tam the Lamplighter", text = "Tam went down to relight the stair lamps on level 2 and has not come up.", kind = "rescue", depth = 2, room = "corridor", escort = true, coin = 60, xp = 54, days = 3, done_text = "Tam is thin and cross and alive, and will not go down there again." },
  { id = "lost-novice", name = "A Novice of the Hearth", text = "A novice of the temple went to pray at a shrine on level 4 and lost her way.", kind = "rescue", depth = 4, room = "shrine", escort = true, coin = 95, xp = 90, days = 4, core = "ward-core", done_text = "The sisters take the novice by both hands, and look at you as if you were a saint." },
  { id = "lost-surveyor", name = "The Surveyor's Boy", text = "A surveyor's boy fell down a flooded shaft on level 7. His father is offering all he has.", kind = "rescue", depth = 7, room = "flooded", escort = true, coin = 160, xp = 150, days = 4, done_text = "The surveyor does not speak. He grips your hand until it hurts." },

  # More beasts.
  { id = "cellar-gnawer", name = "The Cellar Gnawer", text = "Something big has been at the grain sacks under the Ash Pantry. The baker wants it gone before the next loaf.", kind = "beast", depth = 1, monster = "slag-rat", coin = 38, xp = 36, days = 3, done_text = "The baker sends round a loaf, still warm, and does not say what is in it." },
  { id = "lamp-snuffer", name = "The Lamp-Snuffer", text = "A cinder imp puts out the stair lamps on level 3 as fast as they are lit. Find it and make it stop.", kind = "beast", depth = 3, monster = "cinder-imp", coin = 66, xp = 62, days = 3, recipe = "found-pommel-core", done_text = "The stair lamps burn all night, and the lamplighters buy you a round." },
  { id = "gatepost-knight", name = "The Gatepost Knight", text = "An armoured husk stands at the gate of level 4 and turns back every miner. The foreman wants the gate open.", kind = "beast", depth = 4, monster = "rust-warden", coin = 80, xp = 76, days = 4, recipe = "found-miners-brigandine", done_text = "The gate stands open. The foreman nails the helmet over the lintel." },
  { id = "gutter-spitter", name = "The Gutter Spitter", text = "A spitter on level 8 has scalded three haulers from behind a barrel wall. The haulers have clubbed together for a bounty.", kind = "beast", depth = 8, monster = "slag-spitter", coin = 136, xp = 129, days = 4, done_text = "The haulers pass the hat, and the hat is heavy." },
  { id = "long-crawl", name = "The Long Crawl", text = "A slag crawler on level 9 has laid a glowing trail across the main shaft. It is getting longer every night.", kind = "beast", depth = 9, monster = "slag-crawler", coin = 150, xp = 142, days = 4, done_text = "The trail fades to a dull black scar, and the shaft is open again." },
  { id = "singing-shard", name = "The Singing Shard", text = "A glass wisp keeps up a thin note across level 13. Three prospectors have followed it and not come back the same.", kind = "beast", depth = 13, monster = "glass-wisp", coin = 206, xp = 195, days = 5, done_text = "The note stops. For an hour the town sleeps better than it has in a month." },
  { id = "hales-twin", name = "Hale's Twin", text = "A mirror knight on level 14 wears the face of the surveyor Hale, who is alive and very upset about it.", kind = "beast", depth = 14, monster = "mirror-knight", coin = 220, xp = 209, days = 5, recipe = "found-whip-dagger", done_text = "Hale shakes your hand, and checks, afterwards, that he still has his own face." },
  { id = "lower-stair-hound", name = "The Hound of the Lower Stair", text = "An echo hound has made a den on the stair to level 16. Its bark carries up three floors and rattles the lamps.", kind = "beast", depth = 16, monster = "echo-hound", coin = 248, xp = 235, days = 5, done_text = "The stair is quiet. The lamps hang still." },
  { id = "fire-keeper", name = "The Fire-Keeper", text = "A cinder priest on level 17 feeds the old brazier with whatever it can catch. Put it out, and the brazier with it.", kind = "beast", depth = 17, monster = "cinder-priest", coin = 262, xp = 248, days = 5, done_text = "The brazier is cold. The sisters of the temple say a small prayer for the priest." },
  { id = "wyrm-in-the-warm", name = "The Wyrm in the Warm", text = "A hearth wyrm has grown fat on level 19 and the only warm room within a mile belongs to it. Evict it.", kind = "beast", depth = 19, monster = "hearth-wyrm", coin = 290, xp = 275, days = 6, done_text = "The warm room is yours to look over, and the ground smells of old smoke." },
  { id = "last-smiths-shade", name = "The Last Smith's Shade", text = "A rime wraith on level 21 still tries to forge. The sound of it carries all the way up the old pipes.", kind = "beast", depth = 21, monster = "rime-wraith", coin = 318, xp = 302, days = 6, done_text = "The pipes are silent, and it is a new silence." },
  { id = "anvil-of-nothing", name = "The Anvil of Nothing", text = "A frozen smith on level 23 strikes an empty anvil without pause. The sound is wearing on the lift crews.", kind = "beast", depth = 23, monster = "frozen-smith", coin = 346, xp = 328, days = 6, done_text = "The strikes stop. The lift crews stand about not knowing what to do with the quiet." },
  { id = "furnace-hound", name = "The Furnace Hound", text = "A cold hound has taken over the mouth of the final stair. No one has gone past it, and no one has come back.", kind = "beast", depth = 25, monster = "cold-hound", coin = 374, xp = 355, days = 7, done_text = "The way to the last stair lies open. It does not feel like a victory yet." },

  # More heirlooms.
  { id = "childs-whistle", name = "A Child's Whistle", text = "A tin whistle was dropped in a corridor of level 1, and a girl has been crying about it for a week. A small errand, but a real one.", kind = "heirloom", depth = 1, room = "corridor", coin = 43, xp = 40, days = 3, done_text = "The girl blows the whistle once, and the whole street winces, and smiles." },
  { id = "widows-candlestick", name = "The Widow's Candlestick", text = "A silver candlestick sat on a shrine of level 5 for forty years. Its owner wants to die with it on the table.", kind = "heirloom", depth = 5, room = "shrine", coin = 95, xp = 90, days = 4, done_text = "The widow lights the candle at once, and the room is brighter than a candle should make it." },
  { id = "assayers-scales", name = "The Assayer's Scales", text = "A pair of brass scales is locked in a vault on level 6. The assay office is paralysed without them.", kind = "heirloom", depth = 6, room = "vault", need = [{ kind = "tag", tag = "lockpick" }], coin = 108, xp = 102, days = 4, done_text = "The assay office is open again. They weigh your coin twice, to be polite." },
  { id = "founders-tongs", name = "The Founder's Tongs", text = "A pair of tongs lies in a dead forge on level 9. The guild wants them hung over the new hearth.", kind = "heirloom", depth = 9, room = "forge", coin = 147, xp = 139, days = 5, recipe = "found-thorn-core", done_text = "The tongs go up on the wall, black and heavy, and the smiths salute them." },
  { id = "drowned-choir-book", name = "The Drowned Choir's Book", text = "A hymnal fell with the choir into the flooded hall on level 10. The temple wants the tunes back, if the pages can be read.", kind = "heirloom", depth = 10, room = "flooded", need = [{ kind = "tag", tag = "lore" }], coin = 160, xp = 152, days = 5, done_text = "The sisters dry the pages one by one. Three hymns are still legible, and they sing them that night." },
  { id = "glasswrights-tally", name = "The Glasswright's Tally", text = "A glasswright's tally-stick is in a vault of level 12. His apprentices have been unable to settle his debts without it.", kind = "heirloom", depth = 12, room = "vault", coin = 186, xp = 176, days = 5, recipe = "found-shardplate", done_text = "The debts are paid, and the apprentices find, at the end of the stick, a mark of thanks." },
  { id = "prism-cutters-die", name = "A Prism-Cutter's Die", text = "A rune-cut die is lying on a forge floor on level 15. The reading-room hopes to learn how it was cut.", kind = "heirloom", depth = 15, room = "forge", need = [{ kind = "tag", tag = "runecraft" }], coin = 225, xp = 213, days = 5, core = "breaker-core", done_text = "The scholars turn the die in the lamplight and argue about it until dawn." },
  { id = "kings-ash-urn", name = "The King's Ash-Urn", text = "An urn of ashes sits in a shrine of level 18. The sisters say the ash belongs in the ground, and would be grateful for a pair of careful hands.", kind = "heirloom", depth = 18, room = "shrine", need = [{ kind = "tag", tag = "bless" }], coin = 264, xp = 250, days = 6, done_text = "The urn is buried in the temple garden, under a stone with no name." },
  { id = "smiths-last-letter", name = "A Smith's Last Letter", text = "A letter lies in a corridor of level 22, written by a smith to a daughter who never got it. The daughter is old now and waiting.", kind = "heirloom", depth = 22, room = "corridor", coin = 316, xp = 300, days = 6, done_text = "The letter is read aloud in the square. Afterwards no one says anything for a long time." },
  { id = "cold-ledger", name = "The Cold Ledger", text = "A ledger of every debt owed to the Furnace lies in a vault of level 24. The guild would very much like to know who owes what.", kind = "heirloom", depth = 24, room = "vault", need = [{ kind = "tag", tag = "sneak" }], coin = 342, xp = 324, days = 7, done_text = "The ledger changes hands in the dark. Three names in it make the guildmaster go pale." },

  # More rescues.
  { id = "lost-apprentice", name = "The Lost Apprentice", text = "A smith's apprentice went to fetch a lost ladle on level 3 and has not returned. Her master cannot sleep.", kind = "rescue", depth = 3, room = "corridor", escort = true, coin = 73, xp = 69, days = 4, done_text = "The apprentice is sooty and sheepish, and her master hugs her hard enough to bruise." },
  { id = "stranded-haulers", name = "The Stranded Haulers", text = "A hauler crew is cut off by a flooded gallery on level 9. The ropes were their only way out.", kind = "rescue", depth = 9, room = "flooded", escort = true, coin = 163, xp = 154, days = 5, done_text = "The haulers come up grey and shivering, and the foreman counts them twice." },
  { id = "lost-glazier", name = "The Lost Glazier", text = "An old glazier went to look at the Glass Halls on level 12 and has not been seen since. His wife keeps his chair warm.", kind = "rescue", depth = 12, room = "corridor", escort = true, coin = 208, xp = 197, days = 5, done_text = "The old man sits in his own chair and tells the whole story, wrongly, three times." },
  { id = "pilgrim-sister", name = "The Pilgrim Sister", text = "A sister of the temple went on a pilgrimage to a shrine on level 16 and the way home has been lost.", kind = "rescue", depth = 16, room = "shrine", escort = true, coin = 268, xp = 254, days = 5, core = "ward-core", done_text = "The sisters kneel, and the pilgrim says something quiet to each of them." },
  { id = "drowned-surveyors", name = "The Drowned Surveyors", text = "Two surveyors are stuck on a drowned stair on level 20, clinging to a rail and a promise to come home.", kind = "rescue", depth = 20, room = "flooded", escort = true, coin = 328, xp = 311, days = 6, done_text = "The surveyors are carried to the temple wrapped in blankets and laughing and weeping." },
  { id = "last-lamplighter", name = "The Last Lamplighter", text = "Tam's old master went to relight the stair lamps of level 24 and the lamps went dark behind him. His family waits on the stairs.", kind = "rescue", depth = 24, room = "corridor", escort = true, coin = 388, xp = 368, days = 7, done_text = "The old lamplighter's hand is warm in yours, and a little lamp is waiting at the top of the stair." },
]

companion = [
  { id = "maren", name = "Maren the Lamp-Tender", text = "Keeps the town lamps. Dry-humoured, quick to notice when you are not telling the truth.", attr = "spirit", dc = 11, gift = 6, steps = [
    { name = "A Familiar Face", text = "Maren saves you the lamp by the door, and tells you which of the stairs creak.", effects = [{ kind = "trap_sense", amount = 1 }] },
    { name = "The Lamp-Bearer", text = "Maren trims a lamp for your belt. It burns steadier than any you have owned.", effects = [{ kind = "tag", tag = "lantern" }, { kind = "fatigue_guard", amount = 8 }] },
    { name = "Steady Hand", text = "Maren will not say she worries. She mends your straps every night, anyway.", effects = [{ kind = "death_save", amount = 8 }, { kind = "carry", amount = 6 }] },
  ] },
  { id = "odo", name = "Odo the Cellarman", text = "Runs a cellar of salvage nobody asks about. Knows the worth of everything and the price of everyone.", attr = "wits", dc = 12, gift = 8, steps = [
    { name = "A Regular", text = "Odo keeps your corner of the cellar swept, and slips you the tip-offs he can.", effects = [{ kind = "loot_pct", amount = 6 }] },
    { name = "Friend of the Cellar", text = "Odo shows you how to read the stamp on a piece of scrap.", effects = [{ kind = "tag", tag = "appraise" }, { kind = "carry", amount = 6 }] },
    { name = "Partner", text = "Odo lets you in on the real books. It is a good deal for you both.", effects = [{ kind = "loot_pct", amount = 10 }, { kind = "max_hp", amount = 4 }] },
  ] },
  { id = "quill", name = "Sister Quill the Scribe", text = "Copies the temple's rolls and reads the ones she is not meant to. Precise, curious, impatient.", attr = "wits", dc = 13, gift = 10, steps = [
    { name = "A Borrowed Book", text = "Sister Quill lends you a volume of builders' shorthand, margins crowded with her notes.", effects = [{ kind = "tag", tag = "lore" }] },
    { name = "Marginalia", text = "Her notes in the margin save you more than one wrong turn.", effects = [{ kind = "move", id = "brand" }, { kind = "attr", attr = "wits", amount = 1 }] },
    { name = "Co-Author", text = "She writes you into her great book. You, in turn, never get lost in the dark.", effects = [{ kind = "tag", tag = "deepmap" }, { kind = "start_focus", amount = 1 }] },
  ] },
]

rumour = [
  { id = "r-merry", text = "The barkeep pours you a second, and a third. The room goes warm and kind.", effect = { kind = "boon", id = "merry" } },
  { id = "r-hear-the-stair", text = "An old miner whispers which stair creaks before a pack passes. You listen closely.", effect = { kind = "boon", id = "sharp-eared" } },
  { id = "r-luck", text = "A drunk pilgrim presses a coin in your palm and says it has never lost a toss.", effect = { kind = "boon", id = "lucky-streak" } },
  { id = "r-purse", text = "Someone left a purse under the bench, and you were quicker than the barkeep.", effect = { kind = "coin", amount = 6 } },
  { id = "r-tip-three", text = "A surveyor sketches the third level on a napkin and slides it over.", effect = { kind = "tip", depth = 3 } },
  { id = "r-tip-two", text = "A lamplighter draws you the second level, grumbling about who pays for oil.", effect = { kind = "tip", depth = 2 } },
  { id = "r-tip-four", text = "A pale scholar swears to the layout of the fourth level, and charges you for the ink.", effect = { kind = "tip", depth = 4 } },
  { id = "r-tip-six", text = "A wild-eyed hauler describes the sixth level so exactly that you check he is not a ghost.", effect = { kind = "tip", depth = 6 } },
  { id = "r-coin-flip", text = "A card-sharp loses a hand on purpose and calls it a welcome gift.", effect = { kind = "coin", amount = 9 } },
  { id = "r-tip-one", text = "A child sells you a map of level 1, the corner chewed by something with teeth.", effect = { kind = "tip", depth = 1 } },
  { id = "r-tip-five", text = "A burned-out smith traces the fifth level on the tabletop in spilled beer, and makes you promise not to wipe it.", effect = { kind = "tip", depth = 5 } },
  { id = "r-tip-eight", text = "A hauler who has been to level 8 and back sells you the way, a little at a time, for the price of a pie.", effect = { kind = "tip", depth = 8 } },
  { id = "r-tip-ten", text = "A pilgrim mutters the stations of the tenth level like a prayer. You write it down as fast as you can.", effect = { kind = "tip", depth = 10 } },
  { id = "r-drilled", text = "A retired drill-sergeant corrects your stance over a mug of cider, and you leave sharper than you came.", effect = { kind = "boon", id = "drilled" } },
  { id = "r-found-coin", text = "A coin rolls out from under the stove, fat and bright. The barkeep says it is yours by right of noticing.", effect = { kind = "coin", amount = 12 } },
  { id = "r-whisper", text = "The lamplighter leans in and tells you which stairs echo, and which swallow sound. Good to know.", effect = { kind = "boon", id = "sharp-eared" } },
]
