    { name = "A Familiar Face", text = "Maren saves you the lamp by the door, and tells you which of the stairs creak.", effects = [{ kind = "trap_sense", amount = 1 }] },
    { name = "The Lamp-Bearer", text = "Maren trims a lamp for your belt. It burns steadier than any you have owned.", effects = [{ kind = "tag", tag = "lantern" }, { kind = "fatigue_guard", amount = 8 }] },
    { name = "Steady Hand", text = "Maren will not say she worries. She mends your straps every night, anyway.", effects = [{ kind = "death_save", amount = 8 }, { kind = "carry", amount = 6 }] },
  ] },
