  { id = "great-hearth", name = "The Great Hearth", text = "A king's hearth under the forge: the finest patterns and the cheapest repairs.", coin = 600, salvage = 220, requires = ["new-bellows"], effect = { kind = "forge", level = 3 }, done_text = "The Great Hearth is lit. There is nothing the forge cannot work now." },
  { id = "temple-roof", name = "A Roof for the Temple", text = "The sisters can tend the wounded at once instead of in turn.", coin = 160, salvage = 50, effect = { kind = "temple", level = 1 }, done_text = "The temple has a roof and a second pair of hands. No one waits to be tended." },
  { id = "temple-choir", name = "The Temple Choir", text = "A choir whose hymns ease every rite the temple offers.", coin = 500, salvage = 150, requires = ["temple-roof"], effect = { kind = "temple", level = 2 }, done_text = "The choir sings. Every rite costs less." },
