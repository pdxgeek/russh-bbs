# Shipped theme: green screen. Replaces colors and a few strings (the menu title and the key
# hint words), to show that a theme can change wording. It cannot change the status line, where
# security markers are drawn.
name = "green"

[meta]
title = "Green"
credit = "russh-bbs project"

[colors]
heading = "lightgreen"
key = "lightgreen"
border = "green"
info = "green"
error = "lightred"
selected = "white"

[ui.hint]
help = "HELP"
back = "BACK"
logoff = "LOG OFF"

[menu.main]
title = "MAIN MENU"
