# The string table: every fixed, user-facing string of the screens built on the menu framework
# (M2-A). Keys are dotted paths; TOML tables nest them. A theme or translation replaces values
# and keeps the keys. `{name}` marks a placeholder filled by the code.
#
# Rules (checked at boot, see `ui::strings`):
#   * every key the menu tree and the layout use must be present, and no other key may be;
#   * a value is non-empty plain text: no control characters, escape sequences, invisible
#     characters, private-use characters or the reserved security-marker characters;
#   * nothing here may call content "private" or draw a lock: the server can read everything
#     except PGP-encrypted mail and files members encrypt themselves.

