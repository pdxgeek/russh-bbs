[package]
name = "russh-bbs-server"
description = "russh-bbs SSH and SFTP front end (the binary)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
russh-bbs-core = { workspace = true }
russh-bbs-store = { workspace = true }
# The door framework and the example door the board ships with (M4-D0, D98).
russh-bbs-door = { workspace = true }
russh-bbs-door-example = { workspace = true }
russh-bbs-door-emberdeep = { workspace = true }
russh-bbs-door-saltmarch = { workspace = true }
russh = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
ratatui = { workspace = true }
tui-textarea-2 = { workspace = true }
anes = { workspace = true }
rand = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
# Feed fetcher and RSS out (M3-G, D89): see the workspace Cargo.toml.
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
tokio-rustls = { workspace = true }
rustls-native-certs = { workspace = true }
rustls-pki-types = { workspace = true }
url = "2"
# TLS client config for the feed fetcher (already in the tree through sqlx); ring provider only.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Wipes a typed password from memory when the telnet login drops it (already in the tree).
zeroize = { workspace = true }

[features]
# QA only, never in a release build: lets the feed fetcher reach exact addresses named in
# QA_FEED_ALLOW (a local test server). Off by default (D89).
qa-loopback-feeds = []

[dev-dependencies]
tempfile = { workspace = true }
# Test-only: the access-path tests take a permission away with raw SQL (the role editing
# services are a later slice). Already a dependency of the store crate; no new crate.
sqlx = { workspace = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
