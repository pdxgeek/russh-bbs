# russh-bbs example configuration.
#
# Every key is shown with its built-in default, so this file changes nothing: a server started
# with it behaves exactly like one started with no config file. Delete what you do not change.
# Keys with no fixed default, and keys that would pin a stored setting, are commented out. Unknown keys are an error.
#
# Precedence, lowest to highest: built-in defaults < this file < RUSSH_BBS_* environment
# variables < command-line flags. Every key, its environment variable and its status is in
# docs/config.md.
#
# Default location: $XDG_CONFIG_HOME/russh-bbs/config.toml (else ~/.config/russh-bbs/config.toml),
# then /data/config.toml in the container. Choose another with --config or RUSSH_BBS_CONFIG.
#
# Never put object-store credentials here (they come from the environment, D30). A postgres
# URL may hold a password: keep this file at mode 0600 if it does.

# Who may register: "invite", "apply" or "open". Commented out on purpose: the default is
# "invite", but any value set here (or by environment or flag) is written to the board's stored
# setting at every start and wins over it, which would override a mode chosen later in the
# admin UI. Uncomment only to pin the mode from config. Decision D38.
# registration_mode = "invite"

[board]
# The board's identity and what members may choose (UI-2). Everything is optional; the screens
# use the same words as before until you set them. Text is plain: it may not claim the board is
# private, secure or encrypted, and control or invisible characters are refused.
# name = "russh-bbs"
# tagline = "A bulletin board in your terminal."
# location = "Portland, Oregon"
# since = "2026"
# An accent colour that replaces the style's: "#rrggbb", a 0-255 index, or a colour name.
# accent = "#ff2bd6"
# What new members start with. Styles: default, phosphor, neon, paper, amber, deepspace, ansi,
# green, contrast (plus any in the themes directory). Layouts: classic, lightbar, compact,
# dashboard, wide, focus, split.
# style = "neon"
# layout = "dashboard"
# Limit what members can pick (comma-separated). One entry locks the choice for everyone.
# styles = "neon,paper,ansi"
# layouts = "classic,dashboard,wide"
# Banner and header art (UI-3). Bundled art is on by default; put your own files in `art/` beside
# the host key (see docs/ui.md, "Board art"). false draws the board name in large letters only.
# art = true
# Logoff quotes, separated by "|". One is shown on the logoff screen.
# quotes = "Keep the line open.|See you in the morning."
# Set false to turn motion off for every member.
# motion = true

[mail]
# The key that seals stored mail (M3-I, D90). Default: mail.key beside the host key (in the
# data directory). Created with mode 0600 on the first start of a board with no mail; the server
# refuses to start if it is missing while mail exists. BACK IT UP SEPARATELY FROM THE DATABASE.
# key_file = "/data/mail.key"

[ssh]
listen = "0.0.0.0:2222"
# Host key path. Default: $XDG_DATA_HOME/russh-bbs/host_ed25519_key, else
# ~/.local/share/russh-bbs/host_ed25519_key. Generated with mode 0600 on first start.
# host_key = "/data/host_ed25519_key"
auth_timeout_secs = 30
idle_timeout_secs = 600
keepalive_interval_secs = 30
# Concurrent connections. Each session may hold two render buffers of render_cols x render_rows
# cells (48 bytes a cell), so this times that is the memory ceiling; the server logs it at start.
# 64 at the default 500x200 is about 600 MB worst case; members at 80x24 use about 0.2 MB each.
max_connections = 64
# Widest and tallest area a session draws into (80-500 x 24-200). A bigger window is centered on
# it. Lower both on a small host; decision D53.
render_cols = 500
render_rows = 200
max_auth_attempts = 6
auth_rejection_millis = 1000
# Per-session limits after login (D49). One session redraws at most 1000 / redraw_interval_millis
# times a second; window changes are folded into the latest size and keys into one batch.
redraw_interval_millis = 50
# Requests per second (data packets and window changes together) and input bytes per second.
# Excess data is dropped; a session that keeps pushing past both is disconnected after
# flood_strikes over-budget events (each excess request, and each started KiB of excess input).
requests_per_second = 200
input_bytes_per_second = 8192
flood_strikes = 1000
# A peer that does not read for this long, with output waiting, is disconnected.
write_stall_secs = 10
# Password login over SSH (D81, D94 (10)). On by default: ssh is the transport and the account is
# handle plus password; a key bound to the handle is the everyday extra. Every account has a
# password (it is asked for when joining). `ssh new@host` joins, `ssh <handle>@host` signs in.
# Set false for a key-only board: the board then logs a warning at start. Not keyboard-interactive.
allow_password_login = true

[datasource]
# "sqlite" (default) or "postgres". There is no fallback from one to the other.
kind = "sqlite"
# SQLite file. Default: $XDG_DATA_HOME/russh-bbs/russh-bbs.db, else
# ~/.local/share/russh-bbs/russh-bbs.db. Only with kind = "sqlite".
# path = "/data/russh-bbs.db"
# The settings below apply only with kind = "postgres" (D31). There is no way to turn TLS off.
# Use the host name in the URL (not a unix socket) and leave sslmode out: tls_mode decides.
# url = "postgres://user:password@host:5432/dbname"
tls_mode = "require"          # "require" (encrypt only unless tls_root_cert is set), "verify-ca" or "verify-full"
# tls_root_cert = "/data/rds-ca.pem"
iam_auth = false              # true is refused at boot: IAM token auth is not built

[blobs]
# Member-uploaded bytes (D30). Nothing uses the store until file areas land (M4-F2).
backend = "local"             # "local" or "s3"
# dir = "/data/blobs"         # with backend = "local"; default: blobs/ in the data directory
# endpoint = "https://minio.example:9000"   # with backend = "s3"; credentials come from the environment
#                                           # (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY), never this file
# bucket = "russh-bbs"        # must already exist
# region = "us-east-1"
# path_style = true           # MinIO and most self-hosted servers
# ca_file = "/data/blobs-ca.pem"            # replaces the platform CA store for the S3 connection
# multipart_threshold_bytes = 16777216      # s3 uploads above this go up in parts (min 5 MiB)
max_object_bytes = 268435456  # the largest object either backend stores

[telnet]
# Telnet is unencrypted (D27, D85). Turning it on is low-security mode: the server logs a
# warning, staff screens show LOW-SECURITY, and every telnet screen shows UNENCRYPTED.
# Off by default; when off no port is bound.
enabled = false
allow_login = false           # second opt-in: members may sign in with a password over telnet
listen = "0.0.0.0:2323"

[feeds]
# RSS in (M3-G, D89). Off by default: with it off the server makes no outbound request for feeds.
# On, the sysop's feeds (added on the forums screen with `f`) are read on a schedule through an
# SSRF-guarded fetcher: https only unless a feed is flagged otherwise, no private or loopback
# addresses, no proxy. Items appear as read-only boards.
enabled = false
# RSS out. Off by default; when off no port is bound. On, boards the sysop marked public are
# served as RSS 2.0 at <base_url>/rss/<board id> over plain HTTP on this address, so put a TLS
# proxy in front or keep it on a private address.
rss_out_enabled = false
rss_out_listen = "127.0.0.1:8081"
# rss_out_base_url = "https://bbs.example/feeds"   # required with rss_out_enabled; no trailing slash
# CA certificates (PEM) that https feeds are verified against (D92). Unset: the platform store (in the
# container image, the bundled Mozilla list). Set, it replaces that store for feed fetching only, e.g.
# for a feed behind a private CA. The file must exist and hold a certificate.
# ca_file = "/data/feeds-ca.pem"

[waiting_room]
# Rate limits (D37). Per network: a burst, then one new connection per interval.
ip_burst = 10
ip_interval_secs = 2
# Per key: authentication attempts.
key_burst = 5
key_interval_secs = 10
# Form submissions one session may make before it is disconnected.
max_form_submissions = 5
# Networks and keys each limiter remembers before evicting the oldest.
max_tracked_sources = 10000
