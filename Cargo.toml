[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/store",
    "crates/server",
    "crates/proto",
    "crates/api",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
# No license is declared on purpose: the repo license is an open owner decision (Q1).
publish = false

[workspace.dependencies]
# Internal crates. Dependency direction: server, store, api -> core. core depends on none of them.
russh-bbs-core = { path = "crates/core" }
russh-bbs-store = { path = "crates/store" }

# External crates.
unicode-normalization = "0.1"
proptest = "1"
# OS-seeded RNG for generating the host key (already in the tree via russh).
rand = "0.10"
# SHA-256 for the founder setup-token hash (D38); already in the tree via russh.
sha2 = "0.10"
# Constant-time comparison of token hashes (D38); already in the tree via russh.
subtle = "2"
# Temporary directories for tests, so tests never touch the operator's files.
tempfile = "3"
# SSH server library (decision D7). Default features off: `ring` backend instead of aws-lc-rs, and no `rsa`
# (the `rsa` crate has an unfixed timing advisory, and RSA host/user keys are not needed).
russh = { version = "0.65", default-features = false, features = ["ring", "flate2"] }
# Async runtime for the SSH server.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
# Storage (decisions D6, D24, D34): SQLite and Postgres only. The default features would add the MySQL driver, whose `rsa` dependency has an unfixed advisory (D21).
# Postgres TLS uses rustls with the ring provider and the platform CA store (no native-tls, no aws-lc, no webpki-roots whose license is not on the allow list).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "tls-rustls-ring-native-roots", "macros", "migrate"] }
# Unicode property lookups (Default_Ignorable_Code_Point, general category) for the shared sanitizer. Already in the tree via sqlx/idna; Unicode-3.0 license.
icu_properties = "2.4.0"
# Structured logging (architecture.md Cross-cutting).
tracing = "0.1"
# Log output for the binary.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Typed errors in library code.
thiserror = "2"
# Errors at the binary edge only.
anyhow = "1"
# CLI flags and environment for the server binary.
clap = { version = "4", features = ["derive", "env"] }
# Config file parsing for the server (M1-H): the TOML format the sysop writes.
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
# Typed config structs (M1-H); derive only, no format of its own.
serde = { version = "1", features = ["derive"] }
# Password hashing (D79, M3-D): argon2id from RustCrypto. Already in the tree through `ssh-key`; the default features
# (`alloc`, `getrandom`, `password-hash`) give the PHC string format and the OS salt source.
argon2 = "0.6"
# Wipes typed passwords from memory on drop (D81): `Zeroizing<String>`. Already in the tree through `russh` and `ssh-key`.
zeroize = "1"
# Terminal input parser (D50): escape sequences, UTF-8 and the Esc-vs-sequence decision, with the parser
# state kept across SSH data packets. Only the `parser` feature; its one dependency (`bitflags`) is already in the tree.
anes = { version = "0.2", default-features = false, features = ["parser"] }
# Permission names, parsing and variant list from one enum definition (D47, access.md plan section 5); already in the tree.
strum = { version = "0.28", features = ["derive"] }
# Terminal rendering over the PTY (decision D7, Q5/D19).
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# Multi-line editor widget for the M3 message editor (D48). `no-backend` drops its crossterm
# input conversion: keys come from our own parser and are built by hand.
tui-textarea-2 = { version = "=0.13.2", default-features = false, features = ["no-backend"] }

# Feed fetcher (M3-G, D89). `hyper` parses HTTP/1.1 (status, headers, chunked bodies) over a socket the
# fetcher opened itself, so the SSRF guard connects to the address it checked; it also serves RSS out.
# Only the client, server and http1 features: no HTTP/2, no connection pool, no redirect or cookie logic.
hyper = { version = "1", default-features = false, features = ["client", "server", "http1"] }
# `TokioIo` adapter between tokio sockets and hyper; nothing else of hyper-util is built.
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
# Body type for the requests and the streaming read with a size cap.
http-body-util = "0.1"
# TLS for https feeds over the fetcher's own socket, ring provider only (no aws-lc, as in D44).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The platform's CA certificates for https feeds (already in the tree through sqlx).
rustls-native-certs = "0.8"
# Server name type for TLS verification (already in the tree through rustls).
rustls-pki-types = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
print_stdout = "warn"
todo = "warn"
# Pedantic lints we do not follow:
module_name_repetitions = "allow" # domain names read better fully qualified
missing_errors_doc = "allow"      # error types are documented on the type
