pack = 1
theme = '''
version = 2
# Example style for the russh-bbs board kit: a rock pool at dusk. Deep teal water, coral and
# sand accents, rounded boxes and a gentle tide. Original; edit it freely.
name = "tidepool"

[meta]
title = "Tidepool"
credit = "russh-bbs project (example kit)"

[colors]
surface = "#08201f"
panel = "#0d2b2a"
popup = "#12383a"
