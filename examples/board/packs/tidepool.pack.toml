title = "#ffcba8"

[style.borders]
frame = "rounded"
pane = "rounded"
popup = "rounded"

[style.title]
treatment = "rule"
align = "left"

[style.header]
decoration = "diamonds"
gradient = false

[style.backdrop]
kind = "none"

[style.motion]
default = true
'''

