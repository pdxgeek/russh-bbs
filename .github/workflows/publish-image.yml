name: Publish image

# Publishes the container image to GHCR on version tags only (D25, D46). Never on pull requests
# or pushes to main. `workflow_dispatch` is a DRY RUN: it builds both architectures exactly as
# a release would and pushes nothing (no registry login, `push` is false).
# Both architectures are cross-compiled on the amd64 runner by the Dockerfile (zig, D66); nothing
# runs under emulation, so a release takes minutes, not hours.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# No permissions by default; the one job asks for exactly what it needs.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # A release must not hang for hours (the QEMU build ran past two). The cross build takes
    # minutes; 45 leaves room for a cold cache and a slow registry, and fails loudly past that.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # No QEMU: the Dockerfile compiles for arm64 on the runner's own architecture and its
      # final stage has no RUN, so nothing executes an arm64 binary during the build (D66).
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      # Only a tag push logs in; a dry run never holds a registry credential.
      - if: github.ref_type == 'tag'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          # The action lowercases the repository name, as GHCR requires.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` follows stable tags only; a pre-release tag (v0.1.0-rc1) does not move it.
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            # A dry run needs a tag to build with; it is never pushed.
            type=raw,value=dry-run,enable=${{ github.ref_type != 'tag' }}
      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Tag pushes publish; a manual dispatch builds both architectures and discards them.
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
